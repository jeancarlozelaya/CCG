<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cumpleañeros del Mes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="subpage-body">
    <div class="container-fluid">
        <div id="contenedor-cumpleaneros" class="row"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/db.js"></script>
    <script>
        let activos = [];

        $(document).ready(async function() {
            await cargarYRenderizar();

            if (syncChannel) {
                syncChannel.onmessage = cargarYRenderizar;
            }
            window.addEventListener('message', (event) => {
                if (event.data && event.data.tipo === 'PB_DB_EVENT') {
                    cargarYRenderizar();
                }
            });
        });

        async function cargarYRenderizar() {
            const datos = await PB_DB.obtenerDatosPrincipales();
            activos = datos.activos || [];
            mostrarCumpleanerosDelMes();
        }

        function mostrarCumpleanerosDelMes() {
            const mesActual = new Date().getMonth();
            const cumpleaneros = activos
                .filter(col => col.fechaNacimiento && new Date(col.fechaNacimiento + 'T00:00:00').getMonth() === mesActual)
                .sort((a, b) => new Date(a.fechaNacimiento + 'T00:00:00').getDate() - new Date(b.fechaNacimiento + 'T00:00:00').getDate());

            const contenedor = $('#contenedor-cumpleaneros').empty();
            if (cumpleaneros.length === 0) {
                contenedor.html('<div class="col-12"><p class="text-center text-muted py-4">No hay cumpleaños este mes.</p></div>');
                return;
            }

            const nombreMes = new Date(2000, mesActual).toLocaleString('es-ES', { month: 'long' });
            cumpleaneros.forEach(col => {
                const dia = new Date(col.fechaNacimiento + 'T00:00:00').getDate();
                const fotoHtml = col.fotoUrl
                    ? `<img src="${col.fotoUrl}" class="cumpleanero-img" alt="${col.nombre}">`
                    : `<i class="fas fa-user-circle cumpleanero-img-icon"></i>`;

                contenedor.append(`
                    <div class="col-lg-3 col-md-4 col-sm-6 col-6 mb-4 d-flex align-items-stretch">
                        <div class="cumpleanero-card w-100">
                            <div class="cumpleanero-img-container">${fotoHtml}</div>
                            <div class="cumpleanero-info">
                                <h5>${col.nombre}</h5>
                                <p><i class="fas fa-birthday-cake"></i> ${dia} de ${nombreMes}</p>
                            </div>
                        </div>
                    </div>`);
            });
        }
    </script>
</body>
</html>
