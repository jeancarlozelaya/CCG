<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Encuestas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .examen-auxiliar-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            padding: 15px 12px;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid #e9ecef;
            height: 100%;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
        }
        .examen-auxiliar-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1); }
        .examen-auxiliar-card .foto-container {
            width: 70px; height: 70px; border-radius: 50%; margin: 0 auto 10px; flex-shrink: 0;
            border: 3px solid #e9ecef; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #f0f0f0;
        }
        .examen-auxiliar-card .auxiliar-foto { width: 100%; height: 100%; object-fit: cover; }
        .examen-auxiliar-card .foto-placeholder {
            width: 70px; height: 70px; border-radius: 50%; background: #3498db; color: white;
            display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 700;
            margin: 0 auto 10px; flex-shrink: 0;
        }
        .examen-auxiliar-card .info-container { flex: 1; display: flex; flex-direction: column; justify-content: center; width: 100%; min-height: 50px; }
        .examen-auxiliar-card .auxiliar-nombre {
            font-weight: 600; color: var(--primary-color); font-size: 0.9rem; min-height: 2.2rem;
            display: flex; align-items: center; justify-content: center; word-break: break-word; padding: 0 2px; line-height: 1.2; margin-bottom: 2px;
        }
        .examen-auxiliar-card .footer-container {
            width: 100%; display: flex; align-items: center; justify-content: center;
            margin-top: auto; padding-top: 8px; border-top: 1px solid #f0f0f0; flex-shrink: 0; min-height: 30px;
        }
        .form-switch .form-check-input { cursor: pointer; background-color: #ccc; border-color: #ccc; }
        .form-switch .form-check-input:checked { background-color: var(--success-color); border-color: var(--success-color); }
        .examen-historial-item {
            background: #f8f9fa; border-radius: 10px; padding: 15px 20px; margin-bottom: 10px;
            border-left: 4px solid var(--secondary-color); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .examen-historial-item .historial-info { display: flex; flex-direction: column; gap: 2px; }
        .examen-historial-item .historial-tema { font-weight: 600; color: var(--primary-color); }
        .examen-historial-item .historial-fecha { font-size: 0.8rem; color: #7f8c8d; }
    </style>
</head>
<body class="subpage-body">
    <div class="container-fluid">
        <!-- Vista de Periodos -->
        <div class="card mb-4" id="vista-periodos">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="fas fa-calendar-alt me-2"></i>Periodos con Encuestas</span>
                <button class="btn btn-light btn-sm" id="btn-refrescar-encuestas"><i class="fas fa-sync-alt me-1"></i>Actualizar</button>
            </div>
            <div class="card-body">
                <div id="contenedor-temas-encuestas" class="row g-3"></div>
            </div>
        </div>

        <!-- Detalle de Encuestas por Periodo -->
        <div id="detalle-encuesta-container" style="display: none;">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-users me-2"></i>Colaboradores - <span id="encuesta-seleccionada-titulo"></span></span>
                    <button class="btn btn-secondary btn-sm" id="btn-volver-periodos-encuestas">
                        <i class="fas fa-arrow-left me-1"></i>Volver a Periodos
                    </button>
                </div>
                <div class="card-body">
                    <div id="contenedor-colaboradores-encuesta" class="row g-3"></div>
                </div>
            </div>
        </div>

        <!-- Historial por Colaborador -->
        <div id="historial-encuesta-container" style="display: none;">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-history me-2"></i>Historial de Encuestas - <span id="colaborador-encuesta-nombre"></span></span>
                    <button class="btn btn-secondary btn-sm" id="btn-volver-colaboradores-encuestas">
                        <i class="fas fa-arrow-left me-1"></i>Volver a Colaboradores
                    </button>
                </div>
                <div class="card-body">
                    <div id="contenedor-historial-encuesta"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="overlay">
        <div class="spinner"></div>
        <div id="loadingMessage"><h4>Por favor espera un momento...</h4><p></p></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/db.js"></script>
    <script>
        let encuestas = [];
        let encuestasAgrupadasPorPeriodo = {};
        let colaboradoresActivos = [];
        let colaboradoresEgresos = [];
        let intervaloAutoRefreshEncuestas = null;
        let periodoActualEncuestas = '';

        $(document).ready(async function() {
            await cargarDatosBase();
            await cargarEncuestas(false);

            $('#btn-refrescar-encuestas').on('click', () => cargarEncuestas(true));

            $(document).on('click', '#btn-volver-periodos-encuestas', function() {
                detenerAutoRefreshEncuestas();
                $('#detalle-encuesta-container, #historial-encuesta-container').hide();
                $('#vista-periodos').show();
            });

            $(document).on('click', '#btn-volver-colaboradores-encuestas', function() {
                $('#historial-encuesta-container').hide();
                $('#detalle-encuesta-container').show();
            });

            if (syncChannel) {
                syncChannel.onmessage = cargarDatosBase;
            }
        });

        async function cargarDatosBase() {
            const datos = await PB_DB.obtenerDatosPrincipales();
            colaboradoresActivos = datos.activos || [];
            colaboradoresEgresos = datos.egresos || [];
        }

        async function cargarEncuestas(forzarRed = false) {
            const containerTemas = $('#contenedor-temas-encuestas');
            $('#detalle-encuesta-container, #historial-encuesta-container').hide();
            $('#vista-periodos').show();

            const cached = await PB_DB.obtenerCache('encuestas');
            if (cached && cached.datos && !forzarRed) {
                encuestas = cached.datos;
                agruparEncuestasPorPeriodo();
                mostrarPeriodosEncuestas();
            } else {
                containerTemas.html('<div class="col-12 text-center p-4"><div class="spinner-border text-primary" role="status"></div><p class="mt-2">Cargando encuestas...</p></div>');
            }

            if (navigator.onLine && (forzarRed || !cached)) {
                try {
                    const response = await fetch(ENCUESTAS_SCRIPT_URL + "?t=" + Date.now());
                    if (!response.ok) throw new Error('Error HTTP: ' + response.status);
                    const data = await response.json();
                    if (data.error) throw new Error(data.error);

                    encuestas = data.encuestas || [];
                    await PB_DB.guardarCache('encuestas', encuestas);

                    if (encuestas.length === 0) {
                        containerTemas.html(`
                            <div class="col-12 text-center p-5">
                                <i class="fas fa-inbox" style="font-size: 4rem; color: #bdc3c7; display: block; margin-bottom: 15px;"></i>
                                <h5 class="text-muted">No hay encuestas registradas</h5>
                                <p class="text-muted small">Aún no se han realizado encuestas de clima laboral.</p>
                            </div>`);
                        return;
                    }
                    agruparEncuestasPorPeriodo();
                    mostrarPeriodosEncuestas();
                } catch (error) {
                    console.error('Error cargando encuestas:', error);
                    if (!cached) {
                        containerTemas.html(`
                            <div class="col-12">
                                <div class="alert alert-danger text-center">
                                    <i class="fas fa-exclamation-triangle me-2"></i>
                                    Error de conexión al cargar las encuestas: ${error.message}
                                    <br><button class="btn btn-primary btn-sm mt-2" onclick="cargarEncuestas(true)"><i class="fas fa-sync-alt me-2"></i>Reintentar</button>
                                </div>
                            </div>`);
                    }
                }
            }
        }

        function agruparEncuestasPorPeriodo() {
            encuestasAgrupadasPorPeriodo = {};
            encuestas.forEach((enc) => {
                if (!enc.fecha) return;
                let fechaObj = (typeof enc.fecha === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(enc.fecha))
                    ? new Date(enc.fecha + 'T00:00:00')
                    : new Date(enc.fecha);
                if (!fechaObj || isNaN(fechaObj.getTime())) return;

                const key = fechaObj.getFullYear() + '-' + String(fechaObj.getMonth() + 1).padStart(2, '0');
                if (!encuestasAgrupadasPorPeriodo[key]) {
                    encuestasAgrupadasPorPeriodo[key] = { periodo: key, encuestas: [] };
                }
                encuestasAgrupadasPorPeriodo[key].encuestas.push(enc);
            });
        }

        function mostrarPeriodosEncuestas() {
            const containerTemas = $('#contenedor-temas-encuestas').empty();
            const periodosArray = Object.values(encuestasAgrupadasPorPeriodo).sort((a, b) => b.periodo.localeCompare(a.periodo));

            containerTemas.append(`
                <div class="col-12 mb-3">
                    <div class="search-container">
                        <i class="fas fa-search"></i>
                        <input type="text" class="form-control" id="buscador-periodos-encuestas" placeholder="Buscar por periodo (ej: 2026-08)...">
                    </div>
                </div>
                <div class="col-12" id="tabla-periodos-encuestas-container"></div>`);

            function renderPeriodos(filtro = '') {
                const filtroLower = filtro.toLowerCase();
                const periodosFiltrados = periodosArray.filter(p => p.periodo.toLowerCase().includes(filtroLower));

                let html = `
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>Periodo</th>
                                    <th>Total Encuestas</th>
                                    <th>Participantes</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody>`;

                if (periodosFiltrados.length === 0) {
                    html += `<tr><td colspan="4" class="text-center text-muted">${filtro ? 'No se encontraron periodos con ese filtro.' : 'No hay periodos disponibles.'}</td></tr>`;
                } else {
                    periodosFiltrados.forEach(p => {
                        const participantes = new Set(p.encuestas.map(e => e.identidad).filter(Boolean)).size;
                        html += `
                            <tr class="periodo-encuesta-row" data-periodo="${p.periodo}" style="cursor: pointer;">
                                <td><strong>${p.periodo}</strong></td>
                                <td><span class="badge bg-secondary">${p.encuestas.length}</span></td>
                                <td><span class="badge bg-primary">${participantes}</span></td>
                                <td>
                                    <button class="btn btn-primary btn-sm btn-ver-periodo-encuesta" data-periodo="${p.periodo}" style="margin-right: 5px;">
                                        <i class="fas fa-users me-1"></i>Ver Participantes
                                    </button>
                                    <button class="btn btn-success btn-sm btn-resultados-encuesta" data-periodo="${p.periodo}">
                                        <i class="fas fa-chart-bar me-1"></i>Resultados
                                    </button>
                                </td>
                            </tr>`;
                    });
                }
                html += `</tbody></table></div>`;
                $('#tabla-periodos-encuestas-container').html(html);

                $('.periodo-encuesta-row, .btn-ver-periodo-encuesta').off('click').on('click', function(e) {
                    e.stopPropagation();
                    mostrarColaboradoresPorPeriodo($(this).data('periodo'));
                });
                $('.btn-resultados-encuesta').off('click').on('click', function(e) {
                    e.stopPropagation();
                    descargarResultadosEncuesta($(this).data('periodo'));
                });
            }

            renderPeriodos('');
            $('#buscador-periodos-encuestas').off('input').on('input', function() { renderPeriodos($(this).val()); });
        }

        // ==================== MODAL DE RESULTADOS (DISEÑO ORIGINAL) ====================
        function descargarResultadosEncuesta(periodo) {
            const periodoData = encuestasAgrupadasPorPeriodo[periodo];
            if (!periodoData || periodoData.encuestas.length === 0) {
                Swal.fire('Sin Datos', 'No hay encuestas en este periodo.', 'info');
                return;
            }

            const encuestasPeriodo = periodoData.encuestas;
            const total = encuestasPeriodo.length;

            const items = [
                { id: 'clima_1', label: 'Me siento a gusto trabajando' },
                { id: 'clima_2', label: 'Existe respeto entre compañeros' },
                { id: 'clima_3', label: 'Colaboración entre compañeros' },
                { id: 'clima_4', label: 'Ambiente sin tensión constante' },
                { id: 'clima_5', label: 'Puedo expresar opiniones sin temor' },
                { id: 'clima_6', label: 'Problemas atendidos adecuadamente' },
                { id: 'super_1', label: 'Supervisor: Me trata con respeto' },
                { id: 'super_2', label: 'Supervisor: Escucha mis opiniones' },
                { id: 'super_3', label: 'Supervisor: Corrección respetuosa' },
                { id: 'super_4', label: 'Supervisor: Llamadas profesionales' },
                { id: 'super_5', label: 'Supervisor: Reconoce buen trabajo' },
                { id: 'super_6', label: 'Supervisor: Es justo con el personal' },
                { id: 'super_7', label: 'Supervisor: Respeta mi dignidad' },
                { id: 'super_8', label: 'Supervisor: Puedo hablar sin miedo' },
                { id: 'coord_1', label: 'Coordinación: Comunicación adecuada' },
                { id: 'coord_2', label: 'Coordinación: Escucha necesidades' },
                { id: 'coord_3', label: 'Coordinación: Conoce dificultades' },
                { id: 'coord_4', label: 'Coordinación: Interés en mejorar' },
                { id: 'respeto_1', label: 'Respetado por compañeros' },
                { id: 'respeto_2', label: 'Respetado por supervisores' },
                { id: 'respeto_3', label: 'Sin burlas u ofensas' },
                { id: 'respeto_4', label: 'Llamadas privadas y respetuosas' }
            ];

            const resultados = items.map(item => {
                let suma = 0, count = 0;
                encuestasPeriodo.forEach(enc => {
                    const valor = parseInt(enc[item.id]);
                    if (valor >= 1 && valor <= 5) { suma += valor; count++; }
                });
                const promedio = count > 0 ? (suma / count) : 0;
                const porcentaje = count > 0 ? ((suma / (count * 5)) * 100) : 0;
                return { ...item, promedio, porcentaje, count, totalEncuestas: total };
            });

            const alertas = resultados.filter(r => r.promedio > 0 && r.promedio < 3);

            function obtenerRespuestasConFoto(campo) {
                return encuestasPeriodo
                    .filter(enc => enc[campo] && enc[campo].trim() && enc[campo] !== 'No especificado')
                    .map(enc => {
                        let col = colaboradoresActivos.find(c => c.identidad === enc.identidad) || colaboradoresEgresos.find(c => c.identidad === enc.identidad);
                        return { nombre: enc.nombre, identidad: enc.identidad, respuesta: enc[campo], fotoUrl: (col && col.fotoUrl) ? col.fotoUrl : '', fecha: enc.fecha };
                    });
            }

            const respuestasMejorar = obtenerRespuestasConFoto('mejorar');
            const respuestasMaltrato = obtenerRespuestasConFoto('maltrato');
            const respuestasGustaCambiar = obtenerRespuestasConFoto('gusta_cambiar');

            const htmlId = 'resultados-html-' + periodo;
            const tabId = 'tab-resultados-' + Date.now();

            function generarContenidoPestania(titulo, icono, color, respuestas, mensajeVacio, esPrimera = false) {
                const slug = titulo.replace(/\s/g, '-') + '-' + Date.now();
                const tabPanelId = 'panel-' + slug;
                const listaId = 'lista-' + slug;

                let html = `
                    <div class="tab-pane fade ${esPrimera ? 'show active' : ''}" id="${tabPanelId}" role="tabpanel">
                        <div style="margin-bottom: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                            <div style="flex: 1; min-width: 200px;">
                                <div class="search-container" style="position: relative; margin-bottom: 0;">
                                    <i class="fas fa-search" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #aaa;"></i>
                                    <input type="text" class="form-control filtro-pestania" data-lista="${listaId}" placeholder="🔍 Buscar por nombre..."
                                           style="padding-left: 35px; border-radius: 8px; border: 2px solid #e9ecef; font-size: 0.95rem;">
                                </div>
                            </div>
                            <span style="font-size: 0.85rem; color: #7f8c8d; white-space: nowrap;">
                                <i class="fas fa-user me-1"></i>${respuestas.length} respuestas
                            </span>
                        </div>
                        <div id="${listaId}" style="max-height: 350px; overflow-y: auto; padding-right: 5px;">`;

                if (respuestas.length === 0) {
                    html += `
                        <div style="background: #f8f9fa; border-radius: 8px; padding: 25px; text-align: center; color: #7f8c8d; font-size: 14px;">
                            <i class="fas fa-inbox" style="font-size: 32px; display: block; margin-bottom: 10px; color: #bdc3c7;"></i>
                            ${mensajeVacio || 'No hay respuestas registradas'}
                        </div>`;
                } else {
                    respuestas.forEach((r, index) => {
                        const fotoSize = '45px';
                        const fotoHtml = r.fotoUrl
                            ? `<img src="${r.fotoUrl}" style="width: ${fotoSize}; height: ${fotoSize}; border-radius: 50%; object-fit: cover; border: 3px solid #dee2e6; flex-shrink: 0;" onerror="this.style.display='none'; this.parentElement.innerHTML = '<div style=\\'width:${fotoSize};height:${fotoSize};border-radius:50%;background:#3498db;color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0;\\'>${r.nombre.charAt(0)}</div>'">`
                            : `<div style="width: ${fotoSize}; height: ${fotoSize}; border-radius: 50%; background: #3498db; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; flex-shrink: 0;">${r.nombre.charAt(0)}</div>`;
                        const bgColor = index % 2 === 0 ? '#f8f9fa' : 'white';
                        html += `
                            <div class="respuesta-item-pestania" data-nombre="${r.nombre.toLowerCase()}"
                                 style="display: flex; align-items: center; gap: 14px; padding: 12px 16px; margin-bottom: 4px; border-radius: 8px; background: ${bgColor}; border-left: 4px solid ${color}; text-align: left; transition: all 0.2s;">
                                ${fotoHtml}
                                <div style="flex: 1; min-width: 0; text-align: left;">
                                    <strong style="font-size: 14px; display: block; text-align: left; color: #2c3e50;">${r.nombre}</strong>
                                    <span style="font-size: 13px; color: #34495e; text-align: left; display: block; line-height: 1.5;">${r.respuesta}</span>
                                </div>
                            </div>`;
                    });
                }
                html += `</div></div>`;
                return { html, listaId, tabPanelId };
            }

            const tab1 = generarContenidoPestania('Sugerencias de Mejora', 'fa-lightbulb', '#f39c12', respuestasMejorar, 'No hay sugerencias de mejora registradas', true);
            const tab2 = generarContenidoPestania('Reportes de Maltrato', 'fa-exclamation-triangle', '#e74c3c', respuestasMaltrato, 'No hay reportes de maltrato registrados', false);
            const tab3 = generarContenidoPestania('Gustos y Cambios', 'fa-heart', '#2ecc71', respuestasGustaCambiar, 'No hay respuestas registradas', false);

            let html = `
                <div style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 0; max-height: 80vh; overflow-y: auto;">
                    <div style="display: flex; justify-content: flex-end; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; position: sticky; top: 0; background: white; z-index: 10; padding: 8px 0;">
                        <button class="btn btn-success" onclick="descargarHTMLResultados('${periodo}')" style="border-radius: 8px; padding: 8px 18px; font-weight: 600; font-size: 13px;">
                            <i class="fas fa-file-code me-2"></i>Descargar HTML
                        </button>
                    </div>

                    <div id="${htmlId}" style="padding: 20px; background: white; border-radius: 12px;">
                        <div style="text-align: center; margin-bottom: 25px;">
                            <h3 style="color: #2c3e50; margin: 0; font-size: 22px; font-weight: 700;">📊 Resultados de Encuesta de Clima Laboral</h3>
                            <p style="color: #7f8c8d; margin: 8px 0 4px; font-size: 15px;">Periodo: <strong style="color: #2c3e50;">${periodo}</strong></p>
                            <p style="color: #7f8c8d; margin: 0; font-size: 15px;">Total de encuestas: <strong style="color: #2c3e50;">${total}</strong></p>
                        </div>

                        <div style="margin-bottom: 25px; padding: 0 5px;">
                            <h5 style="font-weight: 700; color: #2c3e50; border-bottom: 2px solid #e9ecef; padding-bottom: 10px; font-size: 16px; margin-bottom: 15px;">
                                <i class="fas fa-bell me-2 text-warning"></i>Alertas y Puntos de Atención
                            </h5>`;

            if (alertas.length === 0) {
                html += `
                    <div style="background: #d4edda; border-radius: 10px; padding: 18px 20px; border-left: 5px solid #2ecc71;">
                        <p style="margin: 0; color: #155724; font-size: 15px; font-weight: 500;">
                            <i class="fas fa-check-circle me-2" style="color: #2ecc71;"></i>
                            ¡Buenas noticias! Todos los indicadores están en niveles aceptables (promedio ≥ 3).
                        </p>
                    </div>`;
            } else {
                const criticas = alertas.filter(r => r.promedio < 2);
                if (criticas.length > 0) {
                    html += `
                        <div style="background: #f8d7da; border-radius: 10px; padding: 18px 20px; margin-bottom: 12px; border-left: 5px solid #e74c3c; text-align: left;">
                            <p style="margin: 0 0 8px 0; font-weight: 700; color: #721c24; font-size: 15px;"><i class="fas fa-exclamation-circle me-2"></i>ÁREAS CRÍTICAS (Promedio &lt; 2):</p>
                            <ul style="margin: 0; padding-left: 25px; color: #721c24; font-size: 14px;">
                                ${criticas.map(r => `<li style="margin-bottom: 3px;"><strong>${r.label}</strong>: ${r.promedio.toFixed(2)}/5 (${r.porcentaje.toFixed(0)}%)</li>`).join('')}
                            </ul>
                        </div>`;
                }
                const moderadas = alertas.filter(r => r.promedio >= 2 && r.promedio < 3);
                if (moderadas.length > 0) {
                    html += `
                        <div style="background: #fff3cd; border-radius: 10px; padding: 18px 20px; border-left: 5px solid #f39c12; text-align: left;">
                            <p style="margin: 0 0 8px 0; font-weight: 700; color: #856404; font-size: 15px;"><i class="fas fa-exclamation-triangle me-2"></i>ÁREAS A MEJORAR (Promedio 2-2.99):</p>
                            <ul style="margin: 0; padding-left: 25px; color: #856404; font-size: 14px;">

                            </ul>

                }
            }

            html += `</div>
                <div style="margin-bottom: 25px; padding: 0 5px;">

                        <table style="width: 100%; border-collapse: collapse; font-size: 13px; background: white; min-width: 600px;">
                            <thead style="position: sticky; top: 0; z-index: 5;">
                                <tr style="background: #2c3e50; color: white;">
                                    <th style="padding: 10px 14px; text-align: left; border: 1px solid #34495e; font-weight: 700; font-size: 12px;">Ítem</th>
                                    <th style="padding: 10px 14px; text-align: center; border: 1px solid #34495e; font-weight: 700; font-size: 12px;">Respuestas</th>
                                    <th style="padding: 10px 14px; text-align: center; border: 1px solid #34495e; font-weight: 700; font-size: 12px;">Promedio</th>
                                    <th style="padding: 10px 14px; text-align: center; border: 1px solid #34495e; font-weight: 700; font-size: 12px;">%</th>
                                    <th style="padding: 10px 14px; text-align: center; border: 1px solid #34495e; font-weight: 700; font-size: 12px;">Estado</th>

            resultados.forEach((r, index) => {
                let estado = '🟢 OK', bgColor = 'white', badgeColor = 'success';
                if (r.promedio > 0 && r.promedio < 2) { estado = '🔴 Crítico'; bgColor = '#f8d7da'; badgeColor = 'danger'; }
                else if (r.promedio > 0 && r.promedio < 3) { estado = '🟡 Mejorar'; bgColor = '#fff3cd'; badgeColor = 'warning'; }

                html += `
                    <tr style="background: ${bgColor}; ${index % 2 === 0 && bgColor === 'white' ? 'background: #fafafa;' : ''}">
                        <td style="padding: 8px 14px; border: 1px solid #ddd; text-align: left; font-size: 12px; font-weight: 500;">${r.label}</td>
                        <td style="padding: 8px 14px; border: 1px solid #ddd; text-align: center; font-size: 12px;"><span class="badge bg-secondary" style="font-size: 11px; padding: 3px 12px;">${r.count}/${r.totalEncuestas}</span></td>
                        <td style="padding: 8px 14px; border: 1px solid #ddd; text-align: center; font-weight: ${r.promedio > 0 && r.promedio < 3 ? '700' : 'normal'}; font-size: 13px;">${r.promedio > 0 ? r.promedio.toFixed(2) : 'N/A'}</td>
                        <td style="padding: 8px 14px; border: 1px solid #ddd; text-align: center; font-size: 12px;">${r.promedio > 0 ? r.porcentaje.toFixed(0) + '%' : 'N/A'}</td>
                        <td style="padding: 8px 14px; border: 1px solid #ddd; text-align: center; font-size: 12px;"><span class="badge bg-${badgeColor}" style="font-size: 11px; padding: 4px 14px;">${estado}</span></td>
                    </tr>`;
            });

            html += `</tbody></table></div></div>
                <div style="padding: 0 5px;">
                    <h5 style="font-weight: 700; color: #2c3e50; border-bottom: 2px solid #e9ecef; padding-bottom: 10px; font-size: 16px; margin-bottom: 15px;">
                        <i class="fas fa-comment-dots me-2 text-primary"></i>Preguntas Abiertas
                    </h5>
                    <ul class="nav nav-tabs" id="${tabId}" role="tablist" style="border-bottom: 2px solid #dee2e6; gap: 4px; flex-wrap: wrap;">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="tab-${tab1.tabPanelId}" data-bs-toggle="tab" data-bs-target="#${tab1.tabPanelId}" type="button" role="tab"
                                    style="border: none; border-radius: 8px 8px 0 0; padding: 10px 20px; font-weight: 600; font-size: 13px; color: #2c3e50; background: #e9ecef; transition: all 0.3s;">
                                <i class="fas fa-lightbulb me-2" style="color: #f39c12;"></i>Sugerencias de Mejora
                                <span class="badge bg-secondary ms-1" style="font-size: 10px;">${respuestasMejorar.length}</span>
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="tab-${tab2.tabPanelId}" data-bs-toggle="tab" data-bs-target="#${tab2.tabPanelId}" type="button" role="tab"
                                    style="border: none; border-radius: 8px 8px 0 0; padding: 10px 20px; font-weight: 600; font-size: 13px; color: #2c3e50; background: #e9ecef; transition: all 0.3s;">
                                <i class="fas fa-exclamation-triangle me-2" style="color: #e74c3c;"></i>Reportes de Maltrato
                                <span class="badge bg-secondary ms-1" style="font-size: 10px;">${respuestasMaltrato.length}</span>
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="tab-${tab3.tabPanelId}" data-bs-toggle="tab" data-bs-target="#${tab3.tabPanelId}" type="button" role="tab"
                                    style="border: none; border-radius: 8px 8px 0 0; padding: 10px 20px; font-weight: 600; font-size: 13px; color: #2c3e50; background: #e9ecef; transition: all 0.3s;">
                                <i class="fas fa-heart me-2" style="color: #2ecc71;"></i>Gustos y Cambios
                                <span class="badge bg-secondary ms-1" style="font-size: 10px;">${respuestasGustaCambiar.length}</span>
                            </button>
                        </li>
                    </ul>
                    <div class="tab-content" style="padding: 15px 5px 5px 5px; background: white; border-radius: 0 0 10px 10px;">
                        ${tab1.html}${tab2.html}${tab3.html}
                    </div>
                </div>
                <div style="text-align: center; margin-top: 25px; padding-top: 15px; border-top: 2px solid #eee; font-size: 11px; color: #999;">
                    Documento generado desde el Sistema de Gestión de Empleados - ${new Date().toLocaleDateString()}
                </div>
            </div></div>`;

            Swal.fire({
                title: `📊 Resultados - ${periodo}`,
                html,
                width: window.innerWidth < 576 ? '95%' : '950px',
                showCloseButton: true,
                showConfirmButton: false,
                customClass: { popup: 'animated fadeInDown' },
                didOpen: function() {
                    setTimeout(function() {
                        $('.filtro-pestania').on('input', function() {
                            const texto = $(this).val().toLowerCase().trim();
                            const listaId = $(this).data('lista');
                            $('#' + listaId).find('.respuesta-item-pestania').each(function() {
                                const nombre = $(this).data('nombre') || '';
                                $(this).toggle(texto === '' || nombre.includes(texto));
                            });
                        });
                    }, 200);
                }
            });
        }

        // ==================== PARTICIPANTES POR PERIODO ====================
        function mostrarColaboradoresPorPeriodo(periodo) {
            periodoActualEncuestas = periodo;
            const periodoData = encuestasAgrupadasPorPeriodo[periodo];
            if (!periodoData) return Swal.fire('Error', 'No se encontraron datos para este periodo.', 'error');

            $('#encuesta-seleccionada-titulo').text(periodo);
            $('#vista-periodos, #historial-encuesta-container').hide();
            $('#detalle-encuesta-container').show();

            $('#contenedor-colaboradores-encuesta').html(`
                <div class="col-12 mb-3">
                    <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between">
                        <div class="search-container" style="flex: 1; min-width: 200px; margin-bottom: 0;">
                            <i class="fas fa-search"></i>
                            <input type="text" class="form-control" id="buscador-colaboradores-encuesta" placeholder="Buscar por nombre o identidad...">
                        </div>
                        <div class="d-flex gap-2 align-items-center">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="switch-auto-refresh-encuestas" style="width: 40px; height: 20px; cursor: pointer;">
                                <label class="form-check-label" for="switch-auto-refresh-encuestas" style="font-size: 0.85rem; font-weight: 500;">Auto-Refresh</label>
                            </div>
                            <span id="tiempo-refresh-encuestas" style="font-size: 0.75rem; color: #7f8c8d; min-width: 60px;"></span>
                        </div>
                    </div>
                </div>
                <div class="col-12"><div class="row g-3" id="cards-colaboradores-encuesta-grid"></div></div>`);

            renderColaboradoresGrid('');
            $('#buscador-colaboradores-encuesta').off('input').on('input', function() { renderColaboradoresGrid($(this).val()); });
            $('#switch-auto-refresh-encuestas').off('change').on('change', function() {
                if ($(this).is(':checked')) iniciarAutoRefreshEncuestas();
                else detenerAutoRefreshEncuestas();
            });
        }

        function renderColaboradoresGrid(filtro = '') {
            const pData = encuestasAgrupadasPorPeriodo[periodoActualEncuestas];
            if (!pData) return;
            const unicos = [];
            pData.encuestas.forEach(enc => { if (!unicos.some(c => c.identidad === enc.identidad)) unicos.push(enc); });

            const fl = (filtro || '').toLowerCase();
            const filtrados = unicos.filter(enc => enc.nombre.toLowerCase().includes(fl) || enc.identidad.includes(fl));
            const grid = $('#cards-colaboradores-encuesta-grid').empty();

            if (!filtrados.length) return grid.html('<div class="col-12 text-center p-4"><p class="text-muted">No se encontraron colaboradores.</p></div>');

            filtrados.forEach(enc => {
                const col = colaboradoresActivos.find(c => c.identidad === enc.identidad) || colaboradoresEgresos.find(c => c.identidad === enc.identidad);
                const fotoHtml = (col && col.fotoUrl)
                    ? `<div class="foto-container"><img src="${col.fotoUrl}" class="auxiliar-foto" onerror="this.parentElement.innerHTML='<div class=\\'foto-placeholder\\'>${enc.nombre.charAt(0)}</div>'"></div>`
                    : `<div class="foto-placeholder">${enc.nombre.charAt(0)}</div>`;

                grid.append(`
                    <div class="col-lg-2 col-md-3 col-sm-4 col-6 mb-3 d-flex align-items-stretch">
                        <div class="examen-auxiliar-card encuesta-card" data-identidad="${enc.identidad}">
                            ${fotoHtml}
                            <div class="info-container"><div class="auxiliar-nombre">${enc.nombre}</div></div>
                            <div class="footer-container">
                                <span class="badge bg-primary" style="font-size: 0.7rem;"><i class="fas fa-calendar-check me-1"></i>Encuesta completada</span>
                            </div>
                        </div>
                    </div>`);
            });

            $('.encuesta-card').off('click').on('click', function() {
                mostrarHistorialEncuestasColaborador($(this).data('identidad'));
            });
        }

        function iniciarAutoRefreshEncuestas() {
            detenerAutoRefreshEncuestas();
            let seg = 5;
            $('#tiempo-refresh-encuestas').text(`⌛ ${seg}s`);
            intervaloAutoRefreshEncuestas = setInterval(async () => {
                seg--;
                if (seg <= 0) {
                    seg = 5;
                    if (navigator.onLine) {
                        try {
                            const res = await fetch(ENCUESTAS_SCRIPT_URL + "?t=" + Date.now());
                            const data = await res.json();
                            if (!data.error) {
                                encuestas = data.encuestas || [];
                                await PB_DB.guardarCache('encuestas', encuestas);
                                agruparEncuestasPorPeriodo();
                                renderColaboradoresGrid($('#buscador-colaboradores-encuesta').val() || '');
                            }
                        } catch (e) {}
                    }
                }
                $('#tiempo-refresh-encuestas').text(`⌛ ${seg}s`);
            }, 1000);
        }

        function detenerAutoRefreshEncuestas() {
            if (intervaloAutoRefreshEncuestas) { clearInterval(intervaloAutoRefreshEncuestas); intervaloAutoRefreshEncuestas = null; }
            $('#tiempo-refresh-encuestas').text('');
        }

        function mostrarHistorialEncuestasColaborador(identidad) {
            const lista = encuestas.filter(enc => enc.identidad === identidad).sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
            if (!lista.length) return Swal.fire('Sin Datos', 'No se encontraron encuestas.', 'info');

            $('#colaborador-encuesta-nombre').text(lista[0].nombre);
            const cont = $('#contenedor-historial-encuesta').empty();
            const ultimaStr = new Date(lista[0].fecha).toLocaleDateString('es-ES', { year: 'numeric', month: 'long' });

            cont.append(`
                <div class="row mb-3">
                    <div class="col-md-4"><div class="stat-card" style="background: #d4edda;"><h3>${lista.length}</h3><p>Total de Encuestas</p></div></div>
                    <div class="col-md-4"><div class="stat-card" style="background: #d1ecf1;"><h3>${ultimaStr}</h3><p>Última encuesta</p></div></div>
                    <div class="col-md-4"><div class="stat-card" style="background: #fff3cd;"><h3>${lista[0].area || 'N/A'}</h3><p>Área de trabajo</p></div></div>
                </div>`);

            lista.forEach(enc => {
                const fechaStr = new Date(enc.fecha).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
                cont.append(`
                    <div class="examen-historial-item" style="cursor: pointer;" onclick="verDetalleEncuesta('${enc.identidad}', '${enc.fecha}')">
                        <div class="historial-info">
                            <div class="historial-tema"><i class="fas fa-clipboard-list me-2" style="color: #3498db;"></i>Encuesta de Clima Laboral</div>
                            <div class="historial-fecha"><i class="fas fa-calendar-alt me-1"></i>${fechaStr}</div>
                            <div style="font-size: 0.8rem; color: #7f8c8d; margin-top: 3px;">
                                <span class="badge bg-info me-1">${enc.area || 'N/A'}</span>
                                <span class="badge bg-secondary">${enc.tiempo || 'N/A'}</span>
                            </div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                            <span class="badge bg-primary" style="font-size: 0.85rem; padding: 5px 15px;"><i class="fas fa-check-circle me-1"></i>Completada</span>
                            <button class="btn btn-sm btn-outline-primary" onclick="event.stopPropagation(); verDetalleEncuesta('${enc.identidad}', '${enc.fecha}')"><i class="fas fa-eye me-1"></i>Ver Detalles</button>
                        </div>
                    </div>`);
            });

            $('#detalle-encuesta-container').hide();
            $('#historial-encuesta-container').show();
        }

        // ==================== DETALLE DE ENCUESTA INDIVIDUAL (DISEÑO ORIGINAL + DESCARGA HTML) ====================
        function verDetalleEncuesta(identidad, fecha) {
            const encuesta = encuestas.find(enc => enc.identidad === identidad && enc.fecha === fecha);
            if (!encuesta) return Swal.fire('Error', 'No se encontró la encuesta.', 'error');

            const col = colaboradoresActivos.find(c => c.identidad === encuesta.identidad) || colaboradoresEgresos.find(c => c.identidad === encuesta.identidad);
            const fotoUrl = (col && col.fotoUrl) ? col.fotoUrl : '';

            const fechaStr = new Date(encuesta.fecha).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            const getStars = (v) => { const n = parseInt(v); return (!v || isNaN(n)) ? 'No respondió' : ('★'.repeat(n) + '☆'.repeat(5 - n)); };
            const getStarsText = (v) => { const n = parseInt(v); return (!v || isNaN(n)) ? 'No respondió' : (n + '/5'); };

            const isMobile = window.innerWidth < 576;
            const fotoSize = isMobile ? '50px' : '65px';
            const htmlId = 'encuesta-html-content-' + Date.now();

            function generarFilaEstrellas(label, valor) {
                return `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: #f8f9fa; border-radius: 6px; margin-bottom: 4px; page-break-inside: avoid;">
                        <span style="font-size: 0.85rem; color: #2c3e50; flex: 1; text-align: left;">${label}</span>
                        <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
                            <span style="font-size: 1rem;">${getStars(valor)}</span>
                            <span style="font-size: 0.7rem; color: #999; min-width: 30px; text-align: right;">${getStarsText(valor)}</span>
                        </div>
                    </div>`;
            }

            const html = `
                <div style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 0; max-height: 70vh; overflow-y: auto;">
                    <div style="display: flex; justify-content: flex-end; margin-bottom: 10px; gap: 8px; position: sticky; top: 0; background: white; z-index: 10; padding: 5px 0;">
                        <button class="btn btn-success btn-sm" onclick="descargarHTMLEncuesta('${htmlId}', '${encuesta.nombre.replace(/'/g, "\\'")}', '${fechaStr.replace(/\//g, '-')}')" style="border-radius: 8px; padding: 6px 16px;">
                            <i class="fas fa-file-code me-1"></i>Descargar HTML
                        </button>
                    </div>

                    <div id="${htmlId}" style="padding: 20px; background: white; border-radius: 12px; text-align: left;">
                        <div style="background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); border-radius: 16px; padding: ${isMobile ? '15px' : '20px'}; margin-bottom: 20px; color: white;">
                            <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                                <div style="position: relative; flex-shrink: 0;">
                                    ${fotoUrl ? `
                                        <img src="${fotoUrl}" style="width: ${fotoSize}; height: ${fotoSize}; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255,255,255,0.3);"
                                             onerror="this.style.display='none'; this.parentElement.innerHTML = '<div style=\\'width:${fotoSize};height:${fotoSize};border-radius:50%;background:rgba(52,152,219,0.3);display:flex;align-items:center;justify-content:center;font-size:1.5rem;\\'>${encuesta.nombre.charAt(0)}</div>'">`
                                        : `<div style="width: ${fotoSize}; height: ${fotoSize}; border-radius: 50%; background: rgba(52, 152, 219, 0.3); display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">${encuesta.nombre.charAt(0)}</div>`}
                                    <div style="position: absolute; bottom: -2px; right: -2px; background: #2ecc71; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; border: 2px solid #1a1a2e;">
                                        <i class="fas fa-check" style="font-size: 8px; color: white;"></i>
                                    </div>
                                </div>
                                <div>
                                    <h3 style="margin: 0; font-weight: 700; font-size: ${isMobile ? '1.1rem' : '1.3rem'};">${encuesta.nombre}</h3>
                                    <div style="margin-top: 5px; display: flex; flex-wrap: wrap; gap: 5px;">
                                        <span class="badge" style="background: rgba(255,255,255,0.15); padding: 3px 10px; border-radius: 20px; font-size: 0.7rem;"><i class="fas fa-id-card me-1"></i>${encuesta.identidad}</span>
                                        <span class="badge" style="background: rgba(52, 152, 219, 0.3); padding: 3px 10px; border-radius: 20px; font-size: 0.7rem;"><i class="fas fa-calendar-alt me-1"></i>${fechaStr}</span>
                                        <span class="badge" style="background: rgba(46, 204, 113, 0.3); padding: 3px 10px; border-radius: 20px; font-size: 0.7rem;"><i class="fas fa-building me-1"></i>${encuesta.area || 'N/A'}</span>
                                        <span class="badge" style="background: rgba(243, 156, 18, 0.3); padding: 3px 10px; border-radius: 20px; font-size: 0.7rem;"><i class="fas fa-clock me-1"></i>${encuesta.tiempo || 'N/A'}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div style="display: grid; grid-template-columns: ${isMobile ? '1fr' : '1fr 1fr'}; gap: 15px; margin-bottom: 20px;">
                            <div style="background: #f8f9fa; border-radius: 10px; padding: 12px;">
                                <h6 style="font-weight: 700; color: #2c3e50; margin-bottom: 8px; font-size: 0.85rem;"><i class="fas fa-clock me-2 text-primary"></i>Tiempo en la organización</h6>
                                <p style="margin: 0; font-size: 0.95rem;">${encuesta.tiempo || 'No especificado'}</p>
                            </div>
                            <div style="background: #f8f9fa; border-radius: 10px; padding: 12px;">
                                <h6 style="font-weight: 700; color: #2c3e50; margin-bottom: 8px; font-size: 0.85rem;"><i class="fas fa-building me-2 text-primary"></i>Área de trabajo</h6>
                                <p style="margin: 0; font-size: 0.95rem;">${encuesta.area || 'No especificada'}</p>
                            </div>
                        </div>

                        <div style="margin-bottom: 20px;">
                            <h5 style="font-weight: 700; color: #2c3e50; margin-bottom: 12px; border-bottom: 2px solid #e9ecef; padding-bottom: 8px; font-size: 1rem;"><i class="fas fa-handshake me-2 text-primary"></i>Clima Laboral</h5>

                                ${generarFilaEstrellas('Ambiente sin tensión constante', encuesta.clima_4)}

                                ${generarFilaEstrellas('Llamadas de atención profesionales', encuesta.super_4)}

                            <h5 style="font-weight: 700; color: #2c3e50; margin-bottom: 12px; border-bottom: 2px solid #e9ecef; padding-bottom: 8px; font-size: 1rem;"><i class="fas fa-users-cog me-2 text-primary"></i>Trato de Coordinación</h5>
                            <div style="display: grid; grid-template-columns: ${isMobile ? '1fr' : '1fr 1fr'}; gap: 6px;">

                            <div style="display: grid; grid-template-columns: ${isMobile ? '1fr' : '1fr 1fr'}; gap: 6px;">

                        <div style="margin-bottom: 20px;">
                            <h5 style="font-weight: 700; color: #2c3e50; margin-bottom: 12px; border-bottom: 2px solid #e9ecef; padding-bottom: 8px; font-size: 1rem;"><i class="fas fa-comment-dots me-2 text-primary"></i>Preguntas Abiertas</h5>
                            <div style="background: #fff9e6; border-radius: 8px; padding: 12px 15px; margin-bottom: 8px; border-left: 4px solid #f39c12;">
                                <div style="font-size: 0.8rem; color: #7f8c8d; font-weight: 600;"><i class="fas fa-lightbulb me-1" style="color: #f39c12;"></i>1. ¿Qué mejorarías en la empresa?</div>
                                <div style="font-size: 0.9rem; margin-top: 3px;">${encuesta.mejorar || 'No especificado'}</div>
                            </div>
                            <div style="background: #f8d7da; border-radius: 8px; padding: 12px 15px; margin-bottom: 8px; border-left: 4px solid #e74c3c;">
                                <div style="font-size: 0.8rem; color: #7f8c8d; font-weight: 600;"><i class="fas fa-exclamation-triangle me-1" style="color: #e74c3c;"></i>2. ¿Has sido víctima de maltrato, gritos o humillaciones?</div>
                                <div style="font-size: 0.9rem; margin-top: 3px;">${encuesta.maltrato || 'No especificado'}</div>
                            </div>
                            <div style="background: #d4edda; border-radius: 8px; padding: 12px 15px; border-left: 4px solid #2ecc71;">
                                <div style="font-size: 0.8rem; color: #7f8c8d; font-weight: 600;"><i class="fas fa-heart me-1" style="color: #2ecc71;"></i>3. ¿Qué te gusta de tu trabajo y qué cambiarías?</div>
                                <div style="font-size: 0.9rem; margin-top: 3px;">${encuesta.gusta_cambiar || 'No especificado'}</div>
                            </div>
                        </div>

                        ${encuesta.firma ? `
                            <div class="firma-container" style="background: #f0f8ff; border-radius: 10px; padding: 12px; border: 1px solid #d4edda; text-align: center; margin-top: 10px;">
                                <h6 style="font-weight: 700; color: #2c3e50; margin-bottom: 8px; font-size: 0.85rem;"><i class="fas fa-signature me-2 text-success"></i>Firma del Responsable</h6>
                                <img src="${encuesta.firma}" style="max-width: 180px; max-height: 70px; border: 1px solid #ccc; border-radius: 8px; padding: 5px; background: white; display: block; margin: 0 auto;"
                                     onerror="this.style.display='none'; this.parentElement.innerHTML += '<p style=\\'color: #999; font-size: 0.85rem;\\'>No se pudo cargar la firma</p>'">
                            </div>` : ''}

                        <div style="text-align: center; margin-top: 20px; padding-top: 10px; border-top: 1px solid #eee; font-size: 0.65rem; color: #999;">
                            Documento generado desde el Sistema de Gestión de Empleados - ${new Date().toLocaleDateString()}
                        </div>
                    </div>
                </div>`;

            Swal.fire({
                title: 'Detalle de Encuesta',
                html,
                width: window.innerWidth < 576 ? '95%' : '800px',
                showCloseButton: true,
                showConfirmButton: false,
                customClass: { popup: 'animated fadeInDown' }
            });
        }

        // ==================== DESCARGAR HTML INDIVIDUAL ====================
        function descargarHTMLEncuesta(elementId, nombre, fecha) {
            const element = document.getElementById(elementId);
            if (!element) return Swal.fire('Error', 'No se pudo generar el archivo.', 'error');

            $('#overlay').css('display', 'flex');
            $('#loadingMessage p').text('Generando archivo HTML de la encuesta...');

            const clon = element.cloneNode(true);
            const htmlCompleto = `<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta - ${nombre}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; padding: 30px 15px; color: #2c3e50; }
        .container-encuesta { max-width: 900px; margin: 0 auto; background: white; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); padding: 25px; }
        @media (max-width: 768px) { .container-encuesta { padding: 15px; } [style*="grid-template-columns: 1fr 1fr"] { grid-template-columns: 1fr !important; } }
    </style>
</head>
<body>
    <div class="container-encuesta">${clon.innerHTML}</div>
</body>
</html>`;

            const blob = new Blob([htmlCompleto], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Encuesta_${nombre.replace(/\s/g, '_')}_${fecha.replace(/\//g, '-')}.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            $('#overlay').hide();
            $('#loadingMessage p').text('');
            Swal.fire({ icon: 'success', title: '¡Descarga completada!', text: 'El archivo se ha descargado correctamente.', timer: 2500 });
        }

        // ==================== DESCARGAR HTML COMPLETO DE RESULTADOS ====================
        function descargarHTMLResultados(periodo) {
            const periodoData = encuestasAgrupadasPorPeriodo[periodo];
            if (!periodoData || periodoData.encuestas.length === 0) return Swal.fire('Sin Datos', 'No hay encuestas en este periodo.', 'info');

            $('#overlay').css('display', 'flex');
            $('#loadingMessage p').text('Generando archivo HTML con todos los resultados...');

            const encuestasPeriodo = periodoData.encuestas;
            const total = encuestasPeriodo.length;

            const items = [
                { id: 'clima_1', label: 'Me siento a gusto trabajando' }, { id: 'clima_2', label: 'Existe respeto entre compañeros' },
                { id: 'clima_3', label: 'Colaboración entre compañeros' }, { id: 'clima_4', label: 'Ambiente sin tensión constante' },
                { id: 'clima_5', label: 'Puedo expresar opiniones sin temor' }, { id: 'clima_6', label: 'Problemas atendidos adecuadamente' },
                { id: 'super_1', label: 'Supervisor: Me trata con respeto' }, { id: 'super_2', label: 'Supervisor: Escucha mis opiniones' },
                { id: 'super_3', label: 'Supervisor: Corrección respetuosa' }, { id: 'super_4', label: 'Supervisor: Llamadas profesionales' },
                { id: 'super_5', label: 'Supervisor: Reconoce buen trabajo' }, { id: 'super_6', label: 'Supervisor: Es justo con el personal' },
                { id: 'super_7', label: 'Supervisor: Respeta mi dignidad' }, { id: 'super_8', label: 'Supervisor: Puedo hablar sin miedo' },
                { id: 'coord_1', label: 'Coordinación: Comunicación adecuada' }, { id: 'coord_2', label: 'Coordinación: Escucha necesidades' },
                { id: 'coord_3', label: 'Coordinación: Conoce dificultades' }, { id: 'coord_4', label: 'Coordinación: Interés en mejorar' },
                { id: 'respeto_1', label: 'Respetado por compañeros' }, { id: 'respeto_2', label: 'Respetado por supervisores' },
                { id: 'respeto_3', label: 'Sin burlas u ofensas' }, { id: 'respeto_4', label: 'Llamadas privadas y respetuosas' }
            ];

            const resultados = items.map(item => {
                let suma = 0, count = 0;
                encuestasPeriodo.forEach(enc => {
                    const v = parseInt(enc[item.id]);
                    if (v >= 1 && v <= 5) { suma += v; count++; }
                });
                return { ...item, promedio: count ? suma / count : 0, porcentaje: count ? (suma / (count * 5)) * 100 : 0, count, totalEncuestas: total };
            });

            const alertas = resultados.filter(r => r.promedio > 0 && r.promedio < 3);

            function obtenerRespuestasConFoto(campo) {
                return encuestasPeriodo
                    .filter(enc => enc[campo] && enc[campo].trim() && enc[campo] !== 'No especificado')
                    .map(enc => {
                        const col = colaboradoresActivos.find(c => c.identidad === enc.identidad) || colaboradoresEgresos.find(c => c.identidad === enc.identidad);
                        return { nombre: enc.nombre, respuesta: enc[campo], fotoUrl: (col && col.fotoUrl) ? col.fotoUrl : '' };
                    });
            }

            const respuestasMejorar = obtenerRespuestasConFoto('mejorar');
            const respuestasMaltrato = obtenerRespuestasConFoto('maltrato');
            const respuestasGustaCambiar = obtenerRespuestasConFoto('gusta_cambiar');

            const getStars = (v) => { const n = parseInt(v); return (!v || isNaN(n)) ? 'No respondió' : ('★'.repeat(n) + '☆'.repeat(5 - n)); };
            const getStarsText = (v) => { const n = parseInt(v); return (!v || isNaN(n)) ? 'No respondió' : (n + '/5'); };
            const genFila = (label, valor) => `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#f8f9fa;border-radius:6px;margin-bottom:4px;">
                    <span style="font-size:0.85rem;color:#2c3e50;flex:1;">${label}</span>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span style="font-size:1rem;">${getStars(valor)}</span>
                        <span style="font-size:0.7rem;color:#999;min-width:30px;text-align:right;">${getStarsText(valor)}</span>
                    </div>
                </div>`;

            let encuestasIndividualesHTML = '';
            encuestasPeriodo.forEach((enc) => {
                const col = colaboradoresActivos.find(c => c.identidad === enc.identidad) || colaboradoresEgresos.find(c => c.identidad === enc.identidad);
                const fotoParaHTML = (col && col.fotoUrl) ? col.fotoUrl : '';
                const fechaStr = new Date(enc.fecha).toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

                encuestasIndividualesHTML += `
                    <div class="encuesta-individual-completa" data-nombre="${enc.nombre.toLowerCase()}" style="margin-bottom:30px;border:1px solid #e9ecef;border-radius:12px;padding:20px;background:white;box-shadow:0 2px 8px rgba(0,0,0,0.05);">
                        <div style="background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);border-radius:16px;padding:20px 25px;margin-bottom:20px;color:white;">
                            <div style="display:flex;align-items:center;gap:15px;flex-wrap:wrap;">
                                ${fotoParaHTML ? `<img src="${fotoParaHTML}" style="width:65px;height:65px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,0.3);">` : `<div style="width:65px;height:65px;border-radius:50%;background:rgba(52,152,219,0.3);display:flex;align-items:center;justify-content:center;font-size:1.5rem;">${enc.nombre.charAt(0)}</div>`}
                                <div>
                                    <h3 style="margin:0;font-weight:700;font-size:1.2rem;">${enc.nombre}</h3>
                                    <div style="margin-top:5px;display:flex;flex-wrap:wrap;gap:5px;">
                                        <span class="badge" style="background:rgba(255,255,255,0.15);">${enc.identidad}</span>
                                        <span class="badge" style="background:rgba(52,152,219,0.3);">${fechaStr}</span>
                                        <span class="badge" style="background:rgba(46,204,113,0.3);">${enc.area || 'N/A'}</span>
                                        <span class="badge" style="background:rgba(243,156,18,0.3);">${enc.tiempo || 'N/A'}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:15px;">
                            ${genFila('Me siento a gusto trabajando', enc.clima_1)}${genFila('Existe respeto entre compañeros', enc.clima_2)}
                            ${genFila('Colaboración entre compañeros', enc.clima_3)}${genFila('Ambiente sin tensión constante', enc.clima_4)}
                            ${genFila('Puedo expresar opiniones sin temor', enc.clima_5)}${genFila('Problemas atendidos adecuadamente', enc.clima_6)}
                            ${genFila('Supervisor: Me trata con respeto', enc.super_1)}${genFila('Supervisor: Escucha opiniones', enc.super_2)}
                            ${genFila('Supervisor: Corrección respetuosa', enc.super_3)}${genFila('Supervisor: Llamadas profesionales', enc.super_4)}
                            ${genFila('Supervisor: Reconoce buen trabajo', enc.super_5)}${genFila('Supervisor: Es justo', enc.super_6)}
                            ${genFila('Supervisor: Respeta dignidad', enc.super_7)}${genFila('Supervisor: Hablar sin miedo', enc.super_8)}
                            ${genFila('Coordinación: Comunicación adecuada', enc.coord_1)}${genFila('Coordinación: Escucha necesidades', enc.coord_2)}
                            ${genFila('Coordinación: Conoce dificultades', enc.coord_3)}${genFila('Coordinación: Interés en mejorar', enc.coord_4)}
                            ${genFila('Respetado por compañeros', enc.respeto_1)}${genFila('Respetado por supervisores', enc.respeto_2)}
                            ${genFila('Sin burlas u ofensas', enc.respeto_3)}${genFila('Llamadas privadas y respetuosas', enc.respeto_4)}
                        </div>
                        <div style="background:#fff9e6;border-radius:8px;padding:10px 14px;margin-bottom:6px;border-left:4px solid #f39c12;"><strong>1. ¿Qué mejorarías?</strong><div>${enc.mejorar || 'No especificado'}</div></div>
                        <div style="background:#f8d7da;border-radius:8px;padding:10px 14px;margin-bottom:6px;border-left:4px solid #e74c3c;"><strong>2. ¿Maltrato?</strong><div>${enc.maltrato || 'No especificado'}</div></div>
                        <div style="background:#d4edda;border-radius:8px;padding:10px 14px;border-left:4px solid #2ecc71;"><strong>3. ¿Qué te gusta y qué cambiarías?</strong><div>${enc.gusta_cambiar || 'No especificado'}</div></div>
                        ${enc.firma ? `<div style="text-align:center;margin-top:10px;"><img src="${enc.firma}" style="max-width:160px;max-height:60px;border:1px solid #ccc;border-radius:6px;"></div>` : ''}
                    </div>`;
            });

            function genPanelPreg(idPanel, color, lista, vacio, activo) {
                const itemsHtml = lista.length
                    ? lista.map((r, i) => `<div class="respuesta-item-pestania" data-nombre="${r.nombre.toLowerCase()}" style="display:flex;align-items:center;gap:14px;padding:10px 16px;margin-bottom:4px;border-radius:8px;background:${i%2===0?'#f8f9fa':'white'};border-left:4px solid ${color};">
                        ${r.fotoUrl ? `<img src="${r.fotoUrl}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">` : `<div style="width:40px;height:40px;border-radius:50%;background:#3498db;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;">${r.nombre.charAt(0)}</div>`}
                        <div><strong>${r.nombre}</strong><div>${r.respuesta}</div></div>
                    </div>`).join('')
                    : `<p class="text-muted text-center p-4">${vacio}</p>`;

                return `<div class="tab-pane fade ${activo ? 'show active' : ''}" id="panel-${idPanel}">
                    <input type="text" class="form-control mb-2 filtro-preguntas" data-panel="panel-${idPanel}" placeholder="🔍 Buscar por nombre...">
                    <div style="max-height:350px;overflow-y:auto;">${itemsHtml}</div>
                </div>`;
            }

            const tablaRows = resultados.map(r => {
                const bg = (r.promedio > 0 && r.promedio < 2) ? '#f8d7da' : ((r.promedio > 0 && r.promedio < 3) ? '#fff3cd' : 'white');
                const est = (r.promedio > 0 && r.promedio < 2) ? '🔴 Crítico' : ((r.promedio > 0 && r.promedio < 3) ? '🟡 Mejorar' : '🟢 OK');
                return `<tr style="background:${bg};"><td>${r.label}</td><td style="text-align:center;">${r.count}/${r.totalEncuestas}</td><td style="text-align:center;">${r.promedio ? r.promedio.toFixed(2) : 'N/A'}</td><td style="text-align:center;">${r.promedio ? r.porcentaje.toFixed(0)+'%' : 'N/A'}</td><td style="text-align:center;">${est}</td></tr>`;
            }).join('');

            const alertasHtml = alertas.length === 0
                ? `<div class="alert alert-success">¡Buenas noticias! Todos los indicadores están en niveles aceptables (promedio ≥ 3).</div>`
                : `<div class="alert alert-warning"><strong>Puntos de Atención:</strong><ul>${alertas.map(a => `<li><strong>${a.label}</strong>: ${a.promedio.toFixed(2)}/5 (${a.porcentaje.toFixed(0)}%)</li>`).join('')}</ul></div>`;

            const htmlCompleto = `<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados Encuesta - ${periodo}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"><\/script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; padding: 30px 20px; color: #2c3e50; }
        .container-resultados { max-width: 1100px; margin: 0 auto; background: white; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); padding: 25px; }
        @media (max-width: 768px) { [style*="grid-template-columns:1fr 1fr"] { grid-template-columns: 1fr !important; } }
    </style>
</head>
<body>
    <div class="container-resultados">
        <div class="text-center border-bottom pb-3 mb-4">
            <h1 class="h3 fw-bold">📊 Resultados de Encuesta de Clima Laboral</h1>
            <p class="text-muted mb-0">Periodo: <strong>${periodo}</strong> | Total de encuestas: <strong>${total}</strong></p>
        </div>

        <ul class="nav nav-tabs mb-3" role="tablist">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#panel-resumen" type="button">Resumen Estadístico</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#panel-individuales" type="button">Encuestas Individuales (${total})</button></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="panel-resumen">
                ${alertasHtml}
                <div class="table-responsive mb-4" style="max-height:420px;">
                    <table class="table table-bordered table-sm">
                        <thead class="table-dark"><tr><th>Ítem</th><th>Resp.</th><th>Promedio</th><th>%</th><th>Estado</th></tr></thead>
                        <tbody>${tablaRows}</tbody>
                    </table>
                </div>
                <h5 class="fw-bold mb-2">Preguntas Abiertas</h5>
                <ul class="nav nav-tabs mb-3" role="tablist">
                    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#panel-mejorar" type="button">Sugerencias (${respuestasMejorar.length})</button></li>
                    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#panel-maltrato" type="button">Maltrato (${respuestasMaltrato.length})</button></li>
                    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#panel-gustos" type="button">Gustos y Cambios (${respuestasGustaCambiar.length})</button></li>
                </ul>
                <div class="tab-content">
                    ${genPanelPreg('mejorar', '#f39c12', respuestasMejorar, 'Sin sugerencias', true)}
                    ${genPanelPreg('maltrato', '#e74c3c', respuestasMaltrato, 'Sin reportes de maltrato', false)}
                    ${genPanelPreg('gustos', '#2ecc71', respuestasGustaCambiar, 'Sin respuestas', false)}
                </div>
            </div>

            <div class="tab-pane fade" id="panel-individuales">
                <input type="text" id="filtro-individuales" class="form-control mb-3" placeholder="🔍 Buscar por nombre de colaborador...">
                ${encuestasIndividualesHTML}
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.filtro-preguntas').forEach(function(inp) {
                inp.addEventListener('input', function() {
                    var q = this.value.toLowerCase().trim();
                    var panel = document.getElementById(this.getAttribute('data-panel'));
                    if (!panel) return;
                    panel.querySelectorAll('.respuesta-item-pestania').forEach(function(it) {
                        it.style.display = (!q || (it.getAttribute('data-nombre') || '').includes(q)) ? 'flex' : 'none';
                    });
                });
            });
            var fi = document.getElementById('filtro-individuales');
            if (fi) {
                fi.addEventListener('input', function() {
                    var q = this.value.toLowerCase().trim();
                    document.querySelectorAll('.encuesta-individual-completa').forEach(function(it) {
                        it.style.display = (!q || (it.getAttribute('data-nombre') || '').includes(q)) ? 'block' : 'none';
                    });
                });
            }
        });
    <\/script>
</body>
</html>`;

            const blob = new Blob([htmlCompleto], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Resultados_Encuesta_${periodo}.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            $('#overlay').hide();
            $('#loadingMessage p').text('');
            Swal.fire({ icon: 'success', title: '¡Descarga completada!', text: 'El archivo se ha descargado correctamente.', timer: 2500 });
        }
    </script>
</body>
</html>
