<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progreso de Evaluaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .tema-row:hover { background-color: rgba(52, 152, 219, 0.05) !important; }
        .tema-row td { vertical-align: middle; }

        .examen-auxiliar-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            padding: 15px 12px;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid #e9ecef;
            height: 100%;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
        }
        .examen-auxiliar-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1); }
        .examen-auxiliar-card .foto-container {
            width: 70px; height: 70px; border-radius: 50%; margin: 0 auto 10px;
            flex-shrink: 0; border: 3px solid #e9ecef; overflow: hidden;
            display: flex; align-items: center; justify-content: center; background: #f0f0f0;
        }
        .examen-auxiliar-card .auxiliar-foto { width: 100%; height: 100%; object-fit: cover; }
        .examen-auxiliar-card .foto-placeholder {
            width: 70px; height: 70px; border-radius: 50%; background: #3498db; color: white;
            display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 700;
            margin: 0 auto 10px; flex-shrink: 0;
        }
        .examen-auxiliar-card .info-container { flex: 1; display: flex; flex-direction: column; justify-content: center; width: 100%; min-height: 50px; }
        .examen-auxiliar-card .auxiliar-nombre {
            font-weight: 600; color: var(--primary-color); font-size: 0.9rem; min-height: 2.2rem;
            display: flex; align-items: center; justify-content: center; word-break: break-word; padding: 0 2px; line-height: 1.2; margin-bottom: 2px;
        }
        .examen-auxiliar-card .footer-container {
            width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 6px;
            margin-top: auto; padding-top: 8px; border-top: 1px solid #f0f0f0; flex-shrink: 0; min-height: 38px;
        }
        .examen-auxiliar-card .auxiliar-nota { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; justify-content: center; white-space: nowrap; flex-shrink: 0; padding: 2px 0; }
        .examen-auxiliar-card .nota-aprobado, .nota-aprobado { color: var(--success-color); font-weight: 700; }
        .examen-auxiliar-card .nota-reprobado, .nota-reprobado { color: var(--accent-color); font-weight: 700; }
        .examen-auxiliar-card .btn-container { flex: 1; display: flex; justify-content: flex-end; min-width: 0; max-width: 60%; }
        .examen-auxiliar-card .btn-outline-primary { font-size: 0.65rem; padding: 3px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #cards-auxiliares-grid .col-lg-2,
        #cards-auxiliares-grid .col-md-3,
        #cards-auxiliares-grid .col-sm-4,
        #cards-auxiliares-grid .col-6 { display: flex; }
        #cards-auxiliares-grid .col-lg-2 > div,
        #cards-auxiliares-grid .col-md-3 > div,
        #cards-auxiliares-grid .col-sm-4 > div,
        #cards-auxiliares-grid .col-6 > div { width: 100%; }

        .form-switch .form-check-input { cursor: pointer; background-color: #ccc; border-color: #ccc; }
        .form-switch .form-check-input:checked { background-color: var(--success-color); border-color: var(--success-color); }
        #tiempo-refresh { font-variant-numeric: tabular-nums; min-width: 60px; text-align: center; font-size: 0.75rem; color: #7f8c8d; }

        .examen-historial-item {
            background: #f8f9fa; border-radius: 10px; padding: 15px 20px; margin-bottom: 10px;
            border-left: 4px solid var(--secondary-color); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .examen-historial-item .historial-info { display: flex; flex-direction: column; gap: 2px; }
        .examen-historial-item .historial-tema { font-weight: 600; color: var(--primary-color); }
        .examen-historial-item .historial-fecha { font-size: 0.8rem; color: #7f8c8d; }
        .examen-historial-item .historial-nota { font-size: 1.2rem; font-weight: 700; }
        .examen-historial-item .btn-ver-pdf { background: var(--secondary-color); color: white; border: none; border-radius: 8px; padding: 6px 14px; font-size: 0.8rem; transition: all 0.3s ease; text-decoration: none; }
        .examen-historial-item .btn-ver-pdf:hover { background: #2980b9; transform: scale(1.05); color: white; }

        @media (max-width: 768px) {
            .tema-row td { font-size: 0.85rem; padding: 8px 5px; }
            .examen-auxiliar-card .auxiliar-nombre { font-size: 0.8rem; min-height: 1.8rem; }
            .examen-auxiliar-card .auxiliar-nota { font-size: 1rem; }
            .examen-auxiliar-card .btn-outline-primary { font-size: 0.6rem; padding: 2px 6px; }
        }
        @media (max-width: 576px) {
            .examen-auxiliar-card { padding: 10px 8px; }
            .examen-auxiliar-card .foto-container, .examen-auxiliar-card .foto-placeholder { width: 50px; height: 50px; font-size: 1.2rem; }
            .examen-auxiliar-card .auxiliar-nombre { font-size: 0.7rem; min-height: 1.5rem; }
            .examen-auxiliar-card .auxiliar-nota { font-size: 0.85rem; }
            .examen-auxiliar-card .btn-outline-primary { font-size: 0.55rem; padding: 2px 5px; }
            .examen-historial-item { padding: 12px 15px; flex-direction: column; align-items: stretch; text-align: center; }
            .examen-historial-item .historial-info { align-items: center; }
            .examen-historial-item .btn-ver-pdf { width: 100%; text-align: center; }
        }
    </style>
</head>
<body class="subpage-body">
    <div class="container-fluid">
        <!-- Vista de Temas -->
        <div class="card mb-4" id="vista-temas">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="fas fa-book me-2"></i>Temas Impartidos</span>
                <button class="btn btn-light btn-sm" id="btn-refrescar-examenes">
                    <i class="fas fa-sync-alt me-1"></i>Actualizar
                </button>
            </div>
            <div class="card-body">
                <div id="contenedor-temas" class="row g-3"></div>
            </div>
        </div>

        <!-- Detalle de Exámenes por Tema -->
        <div id="detalle-tema-container" style="display: none;">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-users me-2"></i>Presentes - <span id="tema-seleccionado-titulo"></span></span>
                    <button class="btn btn-secondary btn-sm" id="btn-volver-temas">
                        <i class="fas fa-arrow-left me-1"></i>Volver a Temas
                    </button>
                </div>
                <div class="card-body">
                    <div id="contenedor-auxiliares-tema" class="row g-3"></div>
                </div>
            </div>
        </div>

        <!-- Historial por Auxiliar -->
        <div id="historial-auxiliar-container" style="display: none;">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-history me-2"></i>Historial de Evaluaciones - <span id="auxiliar-seleccionado-nombre"></span></span>
                    <button class="btn btn-secondary btn-sm" id="btn-volver-auxiliares">
                        <i class="fas fa-arrow-left me-1"></i>Volver a Notas
                    </button>
                </div>
                <div class="card-body">
                    <div id="contenedor-historial-auxiliar"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/db.js"></script>
    <script>
        let examenes = [];
        let examenesAgrupadosPorTema = {};
        let colaboradoresActivos = [];
        let colaboradoresEgresos = [];
        let intervaloAutoRefresh = null;
        let temaActual = '';
        let fechaActual = '';

        $(document).ready(async function() {
            await cargarDatosBase();
            await cargarExamenes(false);

            $('#btn-refrescar-examenes').on('click', () => cargarExamenes(true));
            $('#btn-volver-auxiliares').on('click', () => {
                $('#historial-auxiliar-container').hide();
                $('#detalle-tema-container').show();
            });

            if (syncChannel) {
                syncChannel.onmessage = cargarDatosBase;
            }
        });

        async function cargarDatosBase() {
            const p = await PB_DB.obtenerDatosPrincipales();
            colaboradoresActivos = p.activos || [];
            colaboradoresEgresos = p.egresos || [];
        }

        async function cargarExamenes(forzarRed = false) {
            const containerTemas = $('#contenedor-temas');
            $('#detalle-tema-container, #historial-auxiliar-container').hide();
            $('#vista-temas').show();

            const cached = await PB_DB.obtenerCache('examenes');
            if (cached && cached.datos && !forzarRed) {
                examenes = cached.datos;
                agruparExamenesPorTema();
                mostrarTemas();
            } else {
                containerTemas.html('<div class="col-12 text-center p-4"><div class="spinner-border text-primary" role="status"></div><p class="mt-2">Cargando evaluaciones...</p></div>');
            }

            if (navigator.onLine && (forzarRed || !cached)) {
                try {
                    const response = await fetch(SCRIPT_URL_EXAMENES + "?t=" + Date.now());
                    const data = await response.json();
                    if (data.error) throw new Error(data.error);

                    examenes = data.examenes || [];
                    await PB_DB.guardarCache('examenes', examenes);

                    if (examenes.length === 0) {
                        containerTemas.html(`
                            <div class="col-12 text-center p-5">
                                <i class="fas fa-inbox" style="font-size: 4rem; color: #bdc3c7; display: block; margin-bottom: 15px;"></i>
                                <h5 class="text-muted">No hay evaluaciones registradas</h5>
                                <p class="text-muted small">Aún no se han cargado evaluaciones en el sistema.</p>
                            </div>`);
                        return;
                    }
                    agruparExamenesPorTema();
                    mostrarTemas();
                } catch (error) {
                    console.error('Error cargando evaluaciones:', error);
                    if (!cached) {
                        containerTemas.html(`
                            <div class="col-12">
                                <div class="alert alert-danger text-center">
                                    <i class="fas fa-exclamation-triangle me-2"></i>
                                    Error de conexión al cargar las evaluaciones.
                                    <br><button class="btn btn-primary btn-sm mt-2" onclick="cargarExamenes(true)"><i class="fas fa-sync-alt me-2"></i>Reintentar</button>
                                </div>
                            </div>`);
                    }
                }
            }
        }

        function agruparExamenesPorTema() {
            examenesAgrupadosPorTema = {};
            examenes.forEach(ex => {
                const key = ex.tema + '|' + ex.fecha;
                if (!examenesAgrupadosPorTema[key]) {
                    examenesAgrupadosPorTema[key] = { tema: ex.tema, fecha: ex.fecha, examenes: [] };
                }
                examenesAgrupadosPorTema[key].examenes.push(ex);
            });
        }

        function mostrarTemas() {
            const containerTemas = $('#contenedor-temas').empty();
            const temasArray = Object.values(examenesAgrupadosPorTema).sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

            containerTemas.append(`
                <div class="col-12 mb-3">
                    <div class="search-container">
                        <i class="fas fa-search"></i>
                        <input type="text" class="form-control" id="buscador-temas" placeholder="Buscar por tema...">
                    </div>
                </div>
                <div class="col-12" id="tabla-temas-container"></div>`);

            function renderTemas(filtro = '') {
                const filtroLower = filtro.toLowerCase();
                const temasFiltrados = temasArray.filter(t => t.tema.toLowerCase().includes(filtroLower));

                let html = `
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>Tema</th>
                                    <th>Fecha</th>
                                    <th>Presentes</th>
                                    <th>Aprobación</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody>`;

                if (temasFiltrados.length === 0) {
                    html += `<tr><td colspan="5" class="text-center text-muted">No se encontraron temas con ese filtro.</td></tr>`;
                } else {
                    temasFiltrados.forEach(temaData => {
                        const mejoresNotas = {};
                        temaData.examenes.forEach(ex => {
                            const nota = parseFloat(ex.nota);
                            if (!mejoresNotas[ex.identidad] || nota > parseFloat(mejoresNotas[ex.identidad].nota)) {
                                mejoresNotas[ex.identidad] = ex;
                            }
                        });

                        const auxiliaresUnicos = Object.values(mejoresNotas);
                        const totalAuxiliares = auxiliaresUnicos.length;
                        const aprobados = auxiliaresUnicos.filter(ex => parseFloat(ex.nota) >= 70).length;
                        const porcentajeAprobacion = totalAuxiliares > 0 ? Math.round((aprobados / totalAuxiliares) * 100) : 0;

                        let badgeColor = 'success';
                        if (porcentajeAprobacion < 70) badgeColor = 'danger';
                        else if (porcentajeAprobacion < 85) badgeColor = 'warning';

                        html += `
                            <tr class="tema-row" data-tema="${temaData.tema}" data-fecha="${temaData.fecha}" style="cursor: pointer;">
                                <td><strong>${temaData.tema}</strong></td>
                                <td><i class="fas fa-calendar-alt me-1"></i>${formatearFecha(temaData.fecha)}</td>
                                <td><span class="badge bg-secondary">${totalAuxiliares}</span></td>
                                <td><span class="badge bg-${badgeColor}" style="font-size: 0.85rem; padding: 5px 12px;">${porcentajeAprobacion}%</span></td>
                                <td>
                                    <button class="btn btn-primary btn-sm btn-ver-tema" data-tema="${temaData.tema}" data-fecha="${temaData.fecha}">
                                        <i class="fas fa-users me-1"></i>Ver Notas
                                    </button>
                                </td>
                            </tr>`;
                    });
                }

                html += `</tbody></table></div>`;
                $('#tabla-temas-container').html(html);

                $('.tema-row, .btn-ver-tema').off('click').on('click', function(e) {
                    e.stopPropagation();
                    mostrarAuxiliaresPorTema($(this).data('tema'), $(this).data('fecha'));
                });
            }

            renderTemas('');
            $('#buscador-temas').off('input').on('input', function() { renderTemas($(this).val()); });
        }

        function mostrarAuxiliaresPorTema(tema, fecha) {
            temaActual = tema;
            fechaActual = fecha;
            const key = tema + '|' + fecha;
            const temaData = examenesAgrupadosPorTema[key];
            if (!temaData) return Swal.fire('Error', 'No se encontraron datos para este tema.', 'error');

            $('#tema-seleccionado-titulo').text(tema + ' - ' + formatearFecha(fecha));

            const containerAuxiliares = $('#contenedor-auxiliares-tema').empty();
            containerAuxiliares.append(`
                <div class="col-12 mb-3">
                    <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between">
                        <div class="search-container" style="flex: 1; min-width: 200px; margin-bottom: 0;">
                            <i class="fas fa-search"></i>
                            <input type="text" class="form-control" id="buscador-auxiliares-tema" placeholder="Buscar por nombre o identidad...">
                        </div>
                        <div class="d-flex gap-2 align-items-center">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="switch-auto-refresh" style="width: 40px; height: 20px; cursor: pointer;">
                                <label class="form-check-label" for="switch-auto-refresh" style="font-size: 0.85rem; font-weight: 500; color: var(--primary-color);">
                                    Auto-Refresh
                                </label>
                            </div>
                            <span id="tiempo-refresh"></span>
                        </div>
                    </div>
                </div>
                <div class="col-12" id="cards-auxiliares-container">
                    <div class="row g-3" id="cards-auxiliares-grid"></div>
                </div>`);

            const gridContainer = $('#cards-auxiliares-grid');
            let autoRefreshActivo = false;
            let contadorSegundos = 0;
            const INTERVALO_REFRESH = 5;

            function ordenarAuxiliares(auxiliaresData, modo) {
                if (modo === 'autoRefresh') {
                    return [...auxiliaresData].sort((a, b) => (a.fecha && b.fecha) ? (new Date(b.fecha) - new Date(a.fecha)) : 0);
                }
                return [...auxiliaresData].sort((a, b) => parseFloat(b.nota) - parseFloat(a.nota));
            }

            function renderAuxiliaresConDatos(auxiliaresData, filtro = '') {
                const filtroLower = filtro.toLowerCase();
                gridContainer.empty();

                const filtrados = auxiliaresData.filter(ex =>
                    ex.nombre.toLowerCase().includes(filtroLower) || ex.identidad.includes(filtroLower)
                );

                if (filtrados.length === 0) {
                    gridContainer.html('<div class="col-12 text-center p-4"><p class="text-muted">No se encontraron auxiliares con ese filtro.</p></div>');
                    return;
                }

                filtrados.forEach(ex => {
                    const nota = parseFloat(ex.nota);
                    const notaClase = nota >= 70 ? 'nota-aprobado' : 'nota-reprobado';
                    const notaIcono = nota >= 70 ? 'fa-check-circle' : 'fa-times-circle';

                    const col = colaboradoresActivos.find(c => c.identidad === ex.identidad) || colaboradoresEgresos.find(c => c.identidad === ex.identidad);
                    const fotoUrl = (col && col.fotoUrl) ? col.fotoUrl : '';
                    const fotoHtml = fotoUrl
                        ? `<div class="foto-container"><img src="${fotoUrl}" class="auxiliar-foto" onerror="this.parentElement.innerHTML = '<div class=\\'foto-placeholder\\'>${ex.nombre.charAt(0)}</div>'"></div>`
                        : `<div class="foto-placeholder">${ex.nombre.charAt(0)}</div>`;

                    gridContainer.append(`
                        <div class="col-lg-2 col-md-3 col-sm-4 col-6 mb-3 d-flex align-items-stretch">
                            <div class="examen-auxiliar-card" data-identidad="${ex.identidad}">
                                ${fotoHtml}
                                <div class="info-container">
                                    <div class="auxiliar-nombre">${ex.nombre}</div>
                                </div>
                                <div class="footer-container">
                                    <span class="auxiliar-nota ${notaClase}">
                                        <i class="fas ${notaIcono} me-1"></i>${ex.nota}
                                    </span>
                                    <div class="btn-container">
                                        ${ex.enlace ? `<a href="${ex.enlace}" target="_blank" class="btn btn-sm btn-outline-primary"><i class="fas fa-file-pdf me-1"></i>Ver PDF</a>` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>`);
                });
            }

            function actualizarVista(tData) {
                const mejoresNotas = {};
                tData.examenes.forEach(ex => {
                    const nota = parseFloat(ex.nota);
                    if (!mejoresNotas[ex.identidad] || nota > parseFloat(mejoresNotas[ex.identidad].nota)) {
                        mejoresNotas[ex.identidad] = ex;
                    }
                });
                const modo = autoRefreshActivo ? 'autoRefresh' : 'normal';
                const ordenados = ordenarAuxiliares(Object.values(mejoresNotas), modo);
                renderAuxiliaresConDatos(ordenados, $('#buscador-auxiliares-tema').val() || '');
            }

            async function cargarDatosAuxiliares() {
                if (!navigator.onLine) return;
                const estadoAnterior = JSON.stringify(examenes);
                try {
                    const response = await fetch(SCRIPT_URL_EXAMENES + "?t=" + Date.now());
                    const data = await response.json();
                    if (data.error) return;

                    const nuevosExamenes = data.examenes || [];
                    const hayCambios = estadoAnterior !== JSON.stringify(nuevosExamenes);
                    examenes = nuevosExamenes;
                    await PB_DB.guardarCache('examenes', examenes);
                    agruparExamenesPorTema();

                    const temaDataActual = examenesAgrupadosPorTema[temaActual + '|' + fechaActual];
                    if (temaDataActual) {
                        const prev = JSON.parse(estadoAnterior || '[]').filter(ex => ex.tema === temaActual && ex.fecha === fechaActual);
                        actualizarVista(temaDataActual);
                        if (hayCambios) {
                            const idsPrev = new Set(prev.map(ex => ex.identidad));
                            const nuevos = temaDataActual.examenes.filter(ex => !idsPrev.has(ex.identidad));
                            if (nuevos.length > 0) {
                                Swal.fire({
                                    toast: true, position: 'top-end', icon: 'info',
                                    title: `📝 ${nuevos.length} nuevo(s) examen(es) agregado(s)`,
                                    showConfirmButton: false, timer: 2000
                                });
                            }
                        }
                    }
                } catch (e) {
                    console.error('Error en auto-refresh:', e);
                }
            }

            function iniciarAutoRefresh() {
                detenerAutoRefresh(false);
                autoRefreshActivo = true;
                contadorSegundos = 0;
                $('#tiempo-refresh').text(`⌛ ${INTERVALO_REFRESH}s`);
                intervaloAutoRefresh = setInterval(() => {
                    const rest = INTERVALO_REFRESH - contadorSegundos;
                    $('#tiempo-refresh').text(`⌛ ${rest}s`);
                    contadorSegundos++;
                    if (contadorSegundos >= INTERVALO_REFRESH) {
                        contadorSegundos = 0;
                        if ($('#switch-auto-refresh').is(':checked')) cargarDatosAuxiliares();
                    }
                }, 1000);
                cargarDatosAuxiliares();
            }

            function detenerAutoRefresh(reordenar = true) {
                if (intervaloAutoRefresh !== null) {
                    clearInterval(intervaloAutoRefresh);
                    intervaloAutoRefresh = null;
                }
                autoRefreshActivo = false;
                $('#tiempo-refresh').text('');
                contadorSegundos = 0;
                if (reordenar) {
                    const tData = examenesAgrupadosPorTema[temaActual + '|' + fechaActual];
                    if (tData) actualizarVista(tData);
                }
            }

            actualizarVista(temaData);

            $('#buscador-auxiliares-tema').off('input').on('input', () => {
                const tData = examenesAgrupadosPorTema[temaActual + '|' + fechaActual];
                if (tData) actualizarVista(tData);
            });

            $(document).off('click', '.examen-auxiliar-card').on('click', '.examen-auxiliar-card', function(e) {
                if ($(e.target).closest('a').length) return;
                mostrarHistorialAuxiliar($(this).data('identidad'));
            });

            $('#switch-auto-refresh').off('change').on('change', function() {
                if ($(this).is(':checked')) iniciarAutoRefresh();
                else detenerAutoRefresh(true);
            });

            $('#btn-volver-temas').off('click').on('click', () => {
                detenerAutoRefresh(false);
                $('#detalle-tema-container, #historial-auxiliar-container').hide();
                $('#vista-temas').show();
            });

            $('#vista-temas, #historial-auxiliar-container').hide();
            $('#detalle-tema-container').show();
        }

        function mostrarHistorialAuxiliar(identidad) {
            const examenesAuxiliar = examenes.filter(ex => ex.identidad === identidad);
            if (examenesAuxiliar.length === 0) return Swal.fire('Sin Datos', 'No se encontraron evaluaciones para este colaborador.', 'info');

            $('#auxiliar-seleccionado-nombre').text(examenesAuxiliar[0].nombre);
            const containerHistorial = $('#contenedor-historial-auxiliar').empty();

            const mejoresNotasPorExamen = {};
            examenesAuxiliar.forEach(ex => {
                const key = ex.tema + '|' + ex.fecha;
                const nota = parseFloat(ex.nota);
                if (!mejoresNotasPorExamen[key] || nota > parseFloat(mejoresNotasPorExamen[key].nota)) {
                    mejoresNotasPorExamen[key] = ex;
                }
            });

            const historialOrdenado = Object.values(mejoresNotasPorExamen).sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
            const totalExamenes = historialOrdenado.length;
            const promedio = (historialOrdenado.reduce((sum, ex) => sum + parseFloat(ex.nota), 0) / totalExamenes).toFixed(2);
            const aprobados = historialOrdenado.filter(ex => parseFloat(ex.nota) >= 70).length;

            containerHistorial.append(`
                <div class="row mb-3">
                    <div class="col-md-4"><div class="stat-card" style="background: #d4edda;"><h3>${totalExamenes}</h3><p>Total de Evaluaciones</p></div></div>
                    <div class="col-md-4"><div class="stat-card" style="background: #d1ecf1;"><h3>${promedio}%</h3><p>Promedio</p></div></div>
                    <div class="col-md-4"><div class="stat-card" style="background: ${aprobados === totalExamenes ? '#d4edda' : '#f8d7da'};"><h3>${aprobados}/${totalExamenes}</h3><p>Evaluaciones Aprobadas</p></div></div>
                </div>`);

            historialOrdenado.forEach(ex => {
                const nota = parseFloat(ex.nota);
                const notaClase = nota >= 70 ? 'nota-aprobado' : 'nota-reprobado';

                containerHistorial.append(`
                    <div class="examen-historial-item">
                        <div class="historial-info">
                            <div class="historial-tema">${ex.tema}</div>
                            <div class="historial-fecha"><i class="fas fa-calendar-alt me-1"></i>${formatearFecha(ex.fecha)}</div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                            <span class="historial-nota ${notaClase}">${ex.nota}%</span>
                            ${ex.enlace ? `<a href="${ex.enlace}" target="_blank" class="btn-ver-pdf"><i class="fas fa-file-pdf me-1"></i>Ver PDF</a>` : ''}
                        </div>
                    </div>`);
            });

            $('#detalle-tema-container').hide();
            $('#historial-auxiliar-container').show();
        }
    </script>
</body>
</html>
