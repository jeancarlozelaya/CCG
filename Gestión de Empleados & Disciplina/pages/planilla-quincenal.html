<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planilla Quincenal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .planilla-wrapper { max-height: 60vh; overflow: auto; border-radius: 8px; }
        #tabla-planilla { white-space: nowrap; }
        #tabla-planilla th, #tabla-planilla td { text-align: center; vertical-align: middle; min-width: 45px; padding: 0.45rem 0.25rem; }
        #tabla-planilla td:first-child { text-align: left; min-width: 200px; position: sticky; left: 0; background-color: white; z-index: 2; border-right: 2px solid var(--border-color); }
        #tabla-planilla thead th { background-color: var(--primary-color); color: white; }
        #tabla-planilla thead tr:first-child th { position: sticky; top: 0; z-index: 1; }
        #tabla-planilla thead tr:first-child th:first-child,
        #tabla-planilla thead tr:nth-child(2) th:first-child { position: sticky; left: 0; z-index: 3; min-width: 200px; text-align: left; }
        #tabla-planilla td.asistencia { color: white; background-color: var(--success-color); font-weight: bold; }
        #tabla-planilla td.incapacidad, #tabla-planilla td.falta, #tabla-planilla td.permiso, #tabla-planilla td.nuevo-ingreso { background-color: var(--light-yellow); color: #665200; font-weight: bold; }
        #tabla-planilla td.egreso-cell { background-color: var(--light-yellow); color: #333; font-style: italic; font-size: 0.9em; }
        .planilla-simbologia { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; font-size: 0.85rem; }
        .planilla-simbologia span { padding: 3px 10px; border-radius: 4px; font-weight: bold; }
        .simb-asistencia { background-color: var(--success-color); color: white; }
        .simb-ausencia, .simb-egreso { background-color: var(--light-yellow); color: #665200; border: 1px solid #ffeeba; }
    </style>
</head>
<body class="subpage-body">
    <div class="container-fluid">
        <div class="row justify-content-center mb-3">
            <div class="col-md-4">
                <label for="planilla-date-picker" class="form-label fw-semibold">Seleccionar Fecha para Quincena:</label>
                <input type="date" class="form-control" id="planilla-date-picker">
            </div>
        </div>

        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" class="form-control" id="buscador-planilla" placeholder="Buscar por nombre...">
        </div>

        <div class="planilla-wrapper">
            <table class="table table-bordered table-hover" id="tabla-planilla">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>

        <div id="planilla-simbologia" class="mt-3"></div>

        <!-- HORAS EXTRAS -->
        <div class="card mt-4">
            <div class="card-header">
                <i class="fas fa-clock me-2"></i>Registro de Horas Extras - Quincena Seleccionada
            </div>
            <div class="card-body">
                <form id="form-registrar-horas-extras">
                    <div id="contenedor-formularios-horas-extras"></div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-success" id="btn-agregar-hora-extra"><i class="fas fa-plus me-2"></i>Agregar</button>
                        <button type="button" class="btn btn-primary" id="btn-registrar-horas-extras"><i class="fas fa-save me-2"></i>Guardar Horas Extras Offline</button>
                    </div>
                </form>

                <div id="historial-horas-extras-quincena" class="mt-4"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/db.js"></script>
    <script>
        let datos = { activos: [], egresos: [], ausencias: [], horasExtras: [] };
        let nombresActivos = [];

        $(document).ready(async function() {
            $('#planilla-date-picker').val(getHoyStr());
            await cargarYGenerar();
            agregarFormularioHoraExtra();

            $('#planilla-date-picker').on('change', function() { generarPlanilla(this.value); });
            $('#buscador-planilla').on('input', function() {
                const q = $(this).val().toLowerCase();
                $('#tabla-planilla tbody tr').each(function() {
                    $(this).toggle(String($(this).data('nombre')).toLowerCase().includes(q));
                });
            });

            $('#btn-agregar-hora-extra').on('click', agregarFormularioHoraExtra);
            $('#btn-registrar-horas-extras').on('click', registrarHorasExtrasOffline);
            $(document).on('click', '.btn-quitar-item-hora-extra', function() { $(this).closest('.formulario-item').remove(); });

            // Autocomplete colaboradores
            $(document).on('input', '.colaborador-hora-extra', function() {
                const input = $(this), val = input.val().toLowerCase(), list = input.next('.autocomplete-list');
                if (!val) return list.hide();
                const matches = nombresActivos.filter(n => n.toLowerCase().includes(val));
                list.empty().toggle(matches.length > 0);
                matches.forEach(m => list.append(`<div class="autocomplete-item">${m}</div>`));
            });
            $(document).on('click', '.autocomplete-item', function() {
                const container = $(this).closest('.autocomplete-container');
                container.find('.colaborador-hora-extra').val($(this).text());
                $(this).closest('.autocomplete-list').hide();
            });
            $(document).on('click', e => {
                if (!$(e.target).closest('.autocomplete-container').length) $('.autocomplete-list').hide();
            });

            $(document).on('click', '.btn-edit-hora-extra', function() {
                editarHoraExtra($(this).data('identidad'), $(this).data('fecha'));
            });
            $(document).on('click', '.btn-delete-hora-extra', function() {
                eliminarHoraExtra($(this).data('identidad'), $(this).data('fecha'));
            });

            if (syncChannel) syncChannel.onmessage = cargarYGenerar;
        });

        async function cargarYGenerar() {
            datos = await PB_DB.obtenerDatosPrincipales();
            nombresActivos = (datos.activos || []).map(c => c.nombre);
            generarPlanilla($('#planilla-date-picker').val());
        }

        function generarPlanilla(fechaStr) {
            const fecha = parsearFechaUTC(fechaStr);
            if (!fecha) return;
            const dia = fecha.getUTCDate(), mes = fecha.getUTCMonth(), ano = fecha.getUTCFullYear();

            const inicioQuincena = dia <= 15 ? new Date(Date.UTC(ano, mes, 1)) : new Date(Date.UTC(ano, mes, 16));
            const finQuincena = dia <= 15 ? new Date(Date.UTC(ano, mes, 15)) : new Date(Date.UTC(ano, mes + 1, 0));

            const diasArray = [];
            for (let d = new Date(inicioQuincena); d <= finQuincena; d.setUTCDate(d.getUTCDate() + 1)) {
                diasArray.push(new Date(d));
            }

            const diasSemana = ['D', 'L', 'M', 'Mi', 'J', 'V', 'S'];
            let r1 = '<tr><th>Colaborador</th>', r2 = '<tr><th></th>';
            diasArray.forEach(d => {
                r1 += `<th>${d.getUTCDate()}</th>`;
                r2 += `<th>${diasSemana[d.getUTCDay()]}</th>`;
            });
            $('#tabla-planilla thead').html(r1 + '</tr>' + r2 + '</tr>');

            const ausMap = new Map();
            (datos.ausencias || []).forEach(a => {
                if (!ausMap.has(a.identidad)) ausMap.set(a.identidad, []);
                ausMap.get(a.identidad).push({ inicio: parsearFechaUTC(a.fecha), fin: parsearFechaUTC(a.fechaFin || a.fecha), motivo: a.motivo });
            });

            const egMap = new Map();
            (datos.egresos || []).forEach(e => {
                egMap.set(e.identidad, { fechaEgreso: parsearFechaUTC(e.fechaEgreso), razon: e.razon });
            });

            const cols = [];
            (datos.activos || []).forEach(c => {
                const fi = parsearFechaUTC(c.fechaInicio);
                if (fi && fi <= finQuincena) cols.push({ ...c, fechaInicioUTC: fi });
            });
            (datos.egresos || []).forEach(e => {
                const fi = parsearFechaUTC(e.fechaInicio);
                const fe = parsearFechaUTC(e.fechaEgreso);
                if (fi && fe && fi <= finQuincena && fe >= inicioQuincena && !cols.some(c => c.identidad === e.identidad)) {
                    cols.push({ ...e, fechaInicioUTC: fi });
                }
            });
            cols.sort((a, b) => a.nombre.localeCompare(b.nombre));

            const tbody = $('#tabla-planilla tbody').empty();
            cols.forEach(col => {
                let row = `<tr data-nombre="${col.nombre}"><td>${col.nombre}</td>`;
                const egInfo = egMap.get(col.identidad);
                const ausCol = ausMap.get(col.identidad) || [];
                let egresoFlag = false;

                for (let i = 0; i < diasArray.length; i++) {
                    if (egresoFlag) break;
                    const fDia = diasArray[i];
                    let celda = '';

                    if (egInfo && egInfo.fechaEgreso && fDia >= egInfo.fechaEgreso) {
                        celda = `<td colspan="${diasArray.length - i}" class="egreso-cell">${egInfo.razon}</td>`;
                        egresoFlag = true;
                    } else if (fDia < col.fechaInicioUTC) {
                        celda = '<td class="nuevo-ingreso">NI</td>';
                    } else {
                        for (const aus of ausCol) {
                            if (fDia >= aus.inicio && fDia <= aus.fin) {
                                celda = aus.motivo === 'Incapacidad' ? '<td class="incapacidad">I</td>'
                                      : aus.motivo === 'Falta Injustificada' ? '<td class="falta">NSP</td>'
                                      : '<td class="permiso">P</td>';
                                break;
                            }
                        }
                        if (!celda) celda = '<td class="asistencia">✔</td>';
                    }
                    row += celda;
                }
                tbody.append(row + '</tr>');
            });

            $('#planilla-simbologia').html(`
                <div class="planilla-simbologia">
                    <span class="simb-asistencia">✔ = Asistencia</span>
                    <span class="simb-ausencia">I = Incapacidad</span>
                    <span class="simb-ausencia">P = Permiso</span>
                    <span class="simb-ausencia">NSP = No Se Presentó</span>
                    <span class="simb-ausencia">NI = Nuevo Ingreso</span>
                    <span class="simb-egreso">Motivo de Egreso</span>
                </div>`);

            mostrarHorasExtrasQuincena(inicioQuincena, finQuincena);
        }

        function agregarFormularioHoraExtra() {
            const esPrimero = $('#contenedor-formularios-horas-extras .formulario-item').length === 0;
            const btnQuitar = esPrimero ? '' : '<button type="button" class="btn btn-danger btn-quitar-item btn-quitar-item-hora-extra"><i class="fas fa-times"></i></button>';
            $('#contenedor-formularios-horas-extras').append(`
                <div class="formulario-item">
                    ${btnQuitar}
                    <div class="row">
                        <div class="col-md-3 mb-2">
                            <label class="form-label">Fecha</label>
                            <input type="date" class="form-control fecha-hora-extra" value="${getHoyStr()}" required>
                        </div>
                        <div class="col-md-4 mb-2">
                            <label class="form-label">Colaborador</label>
                            <div class="autocomplete-container">
                                <input type="text" class="form-control colaborador-hora-extra" placeholder="Escriba el nombre..." required>
                                <div class="autocomplete-list"></div>
                            </div>
                        </div>
                        <div class="col-md-2 mb-2">
                            <label class="form-label">Horas Extras</label>
                            <input type="number" class="form-control cantidad-horas-extra" min="0.5" step="0.5" placeholder="0" required>
                        </div>
                        <div class="col-md-3 mb-2">
                            <label class="form-label">Observaciones</label>
                            <input type="text" class="form-control observaciones-hora-extra" placeholder="Opcional">
                        </div>
                    </div>
                </div>`);
        }

        async function registrarHorasExtrasOffline() {
            const lista = [];
            let valido = true;

            $('#contenedor-formularios-horas-extras .formulario-item').each(function() {
                const item = $(this);
                const fecha = item.find('.fecha-hora-extra').val();
                const nombre = item.find('.colaborador-hora-extra').val().trim();
                const cantidadHoras = parseFloat(item.find('.cantidad-horas-extra').val());
                const observaciones = item.find('.observaciones-hora-extra').val().trim();

                const col = datos.activos.find(c => c.nombre.toLowerCase() === nombre.toLowerCase());
                if (!fecha || !col || isNaN(cantidadHoras) || cantidadHoras < 0.5) {
                    valido = false;
                } else {
                    lista.push({ fecha, nombre: col.nombre, identidad: col.identidad, cantidadHoras, observaciones });
                }
            });

            if (!valido || lista.length === 0) {
                return Swal.fire('Datos inválidos', 'Verifica fecha, colaborador activo y horas (mínimo 0.5).', 'warning');
            }

            await PB_DB.agregarPendiente({
                titulo: `Registrar ${lista.length} Hora(s) Extra(s)`,
                detalle: lista.map(h => `${h.nombre} (${h.cantidadHoras}h)`).join(', '),
                destino: 'principal',
                accion: 'registrar_horas_extras_masivo',
                payload: { datos: JSON.stringify(lista) }
            });

            await PB_DB.actualizarDatosPrincipales(cache => {
                cache.horasExtras = [...(cache.horasExtras || []), ...lista.map(h => ({ ...h, _pendienteSync: true }))];
                return cache;
            });

            $('#contenedor-formularios-horas-extras').empty();
            agregarFormularioHoraExtra();
            await cargarYGenerar();
            Swal.fire({ icon: 'success', title: 'Horas extras guardadas offline', timer: 1500, showConfirmButton: false });
        }

        function mostrarHorasExtrasQuincena(inicio, fin) {
            const cont = $('#historial-horas-extras-quincena').empty();
            const lista = (datos.horasExtras || []).filter(he => {
                const f = parsearFechaUTC(he.fecha);
                return f && f >= inicio && f <= fin;
            }).sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

            if (lista.length === 0) {
                cont.html('<div class="alert alert-info mb-0">No hay horas extras registradas para esta quincena.</div>');
                return;
            }

            const rows = lista.map(he => `
                <tr>
                    <td>${formatearFecha(he.fecha)}</td>
                    <td>${he.nombre}${he._pendienteSync ? ' <span class="badge-offline-pending">Pendiente</span>' : ''}</td>
                    <td>${he.identidad}</td>
                    <td>${he.cantidadHoras}</td>
                    <td>${he.observaciones || ''}</td>
                    <td style="white-space:nowrap;">
                        <button class="btn btn-warning btn-sm btn-action btn-edit-hora-extra" data-identidad="${he.identidad}" data-fecha="${he.fecha}"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-danger btn-sm btn-action btn-delete-hora-extra" data-identidad="${he.identidad}" data-fecha="${he.fecha}"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`).join('');

            cont.html(`
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead><tr><th>Fecha</th><th>Nombre</th><th>Identidad</th><th>Horas</th><th>Observaciones</th><th>Acciones</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`);
        }

        function editarHoraExtra(identidad, fecha) {
            const orig = datos.horasExtras.find(h => h.identidad === identidad && h.fecha === fecha);
            if (!orig) return;

            Swal.fire({
                title: 'Editar Hora Extra',
                html: `
                    <div class="text-start">
                        <label class="form-label">Fecha</label>
                        <input type="date" id="ed-he-fecha" class="form-control mb-2" value="${orig.fecha}">
                        <label class="form-label">Horas</label>
                        <input type="number" id="ed-he-horas" class="form-control mb-2" min="0.5" step="0.5" value="${orig.cantidadHoras}">
                        <label class="form-label">Observaciones</label>
                        <input type="text" id="ed-he-obs" class="form-control" value="${orig.observaciones || ''}">
                    </div>`,
                showCancelButton: true,
                confirmButtonText: 'Guardar Offline',
                preConfirm: () => ({
                    fecha: $('#ed-he-fecha').val(),
                    cantidadHoras: parseFloat($('#ed-he-horas').val()),
                    observaciones: $('#ed-he-obs').val()
                })
            }).then(async res => {
                if (!res.isConfirmed) return;
                const nuevos = { nombre: orig.nombre, identidad: orig.identidad, ...res.value };

                await PB_DB.agregarPendiente({
                    titulo: `Editar Hora Extra: ${orig.nombre}`,
                    detalle: `${formatearFecha(nuevos.fecha)} (${nuevos.cantidadHoras}h)`,
                    destino: 'principal',
                    accion: 'editar_hora_extra',
                    payload: {
                        horaExtraOriginal: JSON.stringify({ identidad: orig.identidad, fecha: orig.fecha }),
                        datosNuevos: JSON.stringify(nuevos)
                    }
                });

                await PB_DB.actualizarDatosPrincipales(cache => {
                    cache.horasExtras = (cache.horasExtras || []).map(h =>
                        (h.identidad === orig.identidad && h.fecha === orig.fecha) ? { ...nuevos, _pendienteSync: true } : h
                    );
                    return cache;
                });

                await cargarYGenerar();
                Swal.fire({ icon: 'success', title: 'Guardado offline', timer: 1400, showConfirmButton: false });
            });
        }

        function eliminarHoraExtra(identidad, fecha) {
            Swal.fire({
                title: '¿Eliminar hora extra?',
                text: `Se eliminará el registro del ${formatearFecha(fecha)} (offline).`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sí, eliminar'
            }).then(async res => {
                if (!res.isConfirmed) return;

                await PB_DB.agregarPendiente({
                    titulo: `Eliminar Hora Extra`,
                    detalle: `ID: ${identidad} - Fecha: ${formatearFecha(fecha)}`,
                    destino: 'principal',
                    accion: 'eliminar_hora_extra',
                    payload: { identidad, fecha }
                });

                await PB_DB.actualizarDatosPrincipales(cache => {
                    cache.horasExtras = (cache.horasExtras || []).filter(h => !(h.identidad === identidad && h.fecha === fecha));
                    return cache;
                });

                await cargarYGenerar();
                Swal.fire({ icon: 'success', title: 'Eliminado offline', timer: 1400, showConfirmButton: false });
            });
        }
    </script>
</body>
</html>
