<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Ausencia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="subpage-body">
    <div class="container-fluid">
        <div id="alerta-solo-admin" class="alert alert-warning" style="display: none;">
            <i class="fas fa-lock me-2"></i>El registro de ausencias requiere activar el <strong>Modo Administrador</strong>.
        </div>

        <div id="bloque-registrar-ausencia">
            <div class="alert alert-info py-2 mb-3 small">
                <i class="fas fa-database me-2"></i>Las ausencias se guardan localmente en IndexedDB, rectifican automáticamente Control de Asistencia si la fecha ya fue reportada, y quedan pendientes de sincronizar.
            </div>

            <form id="form-registrar-ausencia">
                <div id="contenedor-formularios-ausencia"></div>
                <div class="form-actions">
                    <button type="button" class="btn btn-success" id="btn-agregar-ausencia"><i class="fas fa-plus me-2"></i>Agregar</button>
                    <button type="button" class="btn btn-primary" id="btn-registrar-ausencia"><i class="fas fa-save me-2"></i>Guardar Ausencias Offline</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/db.js"></script>
    <script>
        let datos = { activos: [], ausencias: [] };
        let nombresActivos = [];

        $(document).ready(async function() {
            aplicarEstadoAdmin();
            await cargarDatosLocales();
            agregarFormularioAusencia();

            $('#btn-agregar-ausencia').on('click', function() {
                if (!isAdminMode()) return;
                agregarFormularioAusencia();
            });
            $('#btn-registrar-ausencia').on('click', function() {
                if (!isAdminMode()) return;
                registrarAusenciaOffline();
            });
            $(document).on('click', '.btn-quitar-item-ausencia', function() {
                if (!isAdminMode()) return;
                $(this).closest('.formulario-item').remove();
            });

            $(document).on('input', '.colaborador-ausencia', function() {
                const input = $(this), val = input.val().toLowerCase(), list = input.next('.autocomplete-list');
                if (!val) return list.hide();
                const sug = nombresActivos.filter(n => n.toLowerCase().includes(val));
                list.empty().toggle(sug.length > 0);
                sug.forEach(s => list.append(`<div class="autocomplete-item">${s}</div>`));
            });

            $(document).on('click', '.autocomplete-item', function() {
                const container = $(this).closest('.autocomplete-container');
                const input = container.find('.colaborador-ausencia');
                input.val($(this).text());
                $(this).closest('.autocomplete-list').hide();
                validarCampo(input[0]);
            });

            $(document).on('click', e => {
                if (!$(e.target).closest('.autocomplete-container').length) $('.autocomplete-list').hide();
            });

            $(document).on('change input', 'input[required], select[required]', function() {
                validarCampo(this);
            });

            if (syncChannel) {
                syncChannel.onmessage = () => {
                    aplicarEstadoAdmin();
                    cargarDatosLocales();
                };
            }
        });

        function aplicarEstadoAdmin() {
            const admin = isAdminMode();
            $('#bloque-registrar-ausencia').toggle(admin);
            $('#alerta-solo-admin').toggle(!admin);
        }

        async function cargarDatosLocales() {
            datos = await PB_DB.obtenerDatosPrincipales();
            nombresActivos = (datos.activos || []).map(c => c.nombre);
        }

        function agregarFormularioAusencia() {
            const esPrimero = $('#contenedor-formularios-ausencia .formulario-item').length === 0;
            const btnQuitar = esPrimero ? '' : '<button type="button" class="btn btn-danger btn-quitar-item btn-quitar-item-ausencia" title="Quitar registro"><i class="fas fa-times"></i></button>';

            $('#contenedor-formularios-ausencia').append(`
                <div class="formulario-item">
                    ${btnQuitar}
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Fecha de Ausencia</label>
                            <input type="date" class="form-control fecha-ausencia" value="${getHoyStr()}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Días de Ausencia</label>
                            <input type="number" class="form-control dias-incapacidad" value="1" min="1" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Colaborador</label>
                            <div class="autocomplete-container">
                                <input type="text" class="form-control colaborador-ausencia" placeholder="Escriba el nombre..." required>
                                <div class="autocomplete-list"></div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Motivo</label>
                            <select class="form-select motivo-ausencia" required>
                                <option value="">Seleccionar...</option>
                                <option value="Incapacidad">Incapacidad</option>
                                <option value="Permiso">Permiso</option>
                                <option value="Falta Injustificada">Falta Injustificada</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Observaciones</label>
                            <textarea class="form-control observaciones-ausencia" rows="1"></textarea>
                        </div>
                    </div>
                </div>`);
        }

        async function registrarAusenciaOffline() {
            if (!isAdminMode()) {
                Swal.fire('Acceso restringido', 'Active el Modo Administrador para registrar ausencias.', 'warning');
                return;
            }

            await cargarDatosLocales();
            const lista = [];
            let esValido = true;

            $('#contenedor-formularios-ausencia .formulario-item').each(function(index) {
                const item = $(this);
                let itemValido = true;

                item.find('input[required], select[required]').each(function() {
                    validarCampo(this);
                    if ($(this).hasClass('is-invalid')) itemValido = false;
                });

                const fecha = item.find('.fecha-ausencia').val();
                const diasIncapacidad = parseInt(item.find('.dias-incapacidad').val(), 10);
                const colaborador = item.find('.colaborador-ausencia').val().trim();
                const motivo = item.find('.motivo-ausencia').val();
                const observaciones = item.find('.observaciones-ausencia').val().trim();

                if (itemValido) {
                    const colInfo = datos.activos.find(c => c.nombre.toLowerCase() === colaborador.toLowerCase());
                    if (!colInfo) {
                        item.find('.colaborador-ausencia').addClass('is-invalid').removeClass('is-valid');
                        Swal.fire('Error', `El colaborador '${colaborador}' (#${index + 1}) no está activo.`, 'error');
                        itemValido = false;
                    } else {
                        const inicio = new Date(fecha + 'T00:00:00');
                        const fin = new Date(inicio);
                        fin.setDate(fin.getDate() + diasIncapacidad - 1);
                        const fechaFinStr = `${fin.getFullYear()}-${String(fin.getMonth() + 1).padStart(2, '0')}-${String(fin.getDate()).padStart(2, '0')}`;

                        for (let d = new Date(inicio); d <= fin; d.setDate(d.getDate() + 1)) {
                            const fStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                            const dupExistente = datos.ausencias.some(a => a.identidad === colInfo.identidad && fStr >= a.fecha && fStr <= (a.fechaFin || a.fecha));
                            const dupLote = lista.some(a => a.identidad === colInfo.identidad && fStr >= a.fecha && fStr <= a.fechaFin);
                            if (dupExistente || dupLote) {
                                Swal.fire('Duplicado', `Ya existe una ausencia para '${colInfo.nombre}' el ${formatearFecha(fStr)}.`, 'error');
                                itemValido = false;
                                break;
                            }
                        }

                        if (itemValido) {
                            lista.push({
                                fecha,
                                fechaFin: fechaFinStr,
                                diasIncapacidad,
                                colaborador: colInfo.nombre,
                                identidad: colInfo.identidad,
                                fechaNacimiento: colInfo.fechaNacimiento || '',
                                sexo: colInfo.sexo || '',
                                motivo,
                                observaciones
                            });
                        }
                    }
                }
                if (!itemValido) esValido = false;
            });

            if (!esValido || lista.length === 0) return;

            const conf = await Swal.fire({
                title: '¿Guardar ausencias offline?',
                html: `Se guardarán <strong>${lista.length}</strong> ausencia(s) pendientes de sincronizar.`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Sí, guardar',
                cancelButtonText: 'Cancelar'
            });
            if (!conf.isConfirmed) return;

            const payloadParaEnviar = lista.map(({ identidad, fechaNacimiento, sexo, ...rest }) => rest);

            await PB_DB.agregarPendiente({
                titulo: `Registrar ${lista.length} Ausencia(s)`,
                detalle: lista.map(a => `${a.colaborador} (${a.motivo}, ${a.diasIncapacidad}d)`).join(', '),
                destino: 'principal',
                accion: 'registrar_ausencias_masivo',
                payload: { datos: JSON.stringify(payloadParaEnviar) }
            });

            let diasRectificados = 0;
            await PB_DB.actualizarDatosPrincipales(cache => {
                const nuevas = lista.map(a => ({
                    fecha: a.fecha,
                    fechaFin: a.fechaFin,
                    nombre: a.colaborador,
                    identidad: a.identidad,
                    fechaNacimiento: a.fechaNacimiento,
                    sexo: a.sexo,
                    motivo: a.motivo,
                    diasIncapacidad: a.diasIncapacidad,
                    observaciones: a.observaciones,
                    _pendienteSync: true
                }));
                cache.ausencias = [...(cache.ausencias || []), ...nuevas];

                const fechasAfectadas = [];
                nuevas.forEach(a => {
                    obtenerRangoFechasStr(a.fecha, a.fechaFin).forEach(f => fechasAfectadas.push(f));
                });
                diasRectificados = rectificarAsistenciaEnCache(cache, fechasAfectadas);
                return cache;
            });

            $('#contenedor-formularios-ausencia').empty();
            agregarFormularioAusencia();
            await cargarDatosLocales();

            if (diasRectificados > 0) {
                Swal.fire({
                    icon: 'success',
                    title: 'Guardado Offline',
                    html: `Ausencias guardadas. Se rectificaron <strong>${diasRectificados}</strong> día(s) en Control de Asistencia.`,
                    timer: 2400,
                    showConfirmButton: false
                });
            } else {
                Swal.fire({ icon: 'success', title: 'Guardado Offline', timer: 1800, showConfirmButton: false });
            }
        }
    </script>
</body>
</html>
