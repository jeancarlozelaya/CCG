<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasa de Rotación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="subpage-body">
    <div class="container-fluid">
        <div class="rotacion-periodos">
            <div class="periodo-card"><h4>Rotación General</h4><div class="porcentaje" id="rotacion-general">0%</div><div class="detalle" id="detalle-general">0 egresos</div></div>
            <div class="periodo-card"><h4>Rotación del Mes</h4><div class="porcentaje" id="rotacion-mes">0%</div><div class="detalle" id="detalle-mes">0 egresos</div></div>
            <div class="periodo-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);"><h4>Últimos 3 Meses</h4><div class="porcentaje" id="rotacion-3meses">0%</div><div class="detalle" id="detalle-3meses">0 egresos</div></div>
            <div class="periodo-card" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);"><h4>Últimos 6 Meses</h4><div class="porcentaje" id="rotacion-6meses">0%</div><div class="detalle" id="detalle-6meses">0 egresos</div></div>
            <div class="periodo-card" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);"><h4>Últimos 12 Meses</h4><div class="porcentaje" id="rotacion-12meses">0%</div><div class="detalle" id="detalle-12meses">0 egresos</div></div>
        </div>

        <div class="card mb-4">
            <div class="card-header">Egresos por Mes</div>
            <div class="card-body">
                <div class="d-flex gap-2 mb-3">
                    <select id="filtro-ano-rotacion" class="form-select" style="width:auto;"></select>
                    <button id="btn-filtrar-rotacion-grafico" class="btn btn-primary btn-sm">Filtrar</button>
                </div>
                <div class="chart-container"><canvas id="graficoRotacionAnual"></canvas></div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header">Motivos de Egreso</div>
            <div class="card-body">
                <div class="d-flex flex-wrap gap-2 mb-3">
                    <select id="filtro-mes-egresos" class="form-select" style="width:auto;"></select>
                    <select id="filtro-ano-egresos" class="form-select" style="width:auto;"></select>
                    <button id="btn-filtrar-egresos" class="btn btn-primary btn-sm">Filtrar</button>
                </div>
                <div class="row">
                    <div class="col-md-4"><div class="chart-container" style="height:320px;"><canvas id="graficoEgresosMotivoActual"></canvas></div></div>
                    <div class="col-md-4"><div class="chart-container" style="height:320px;"><canvas id="graficoEgresosMotivoHistorico"></canvas></div></div>
                    <div class="col-md-4" id="contenedorGraficoFiltradoEgresos" style="display:none;"><div class="chart-container" style="height:320px;"><canvas id="graficoEgresosMotivoFiltrado"></canvas></div></div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Historial de Egresos</div>
            <div class="card-body">
                <div class="date-range-container">
                    <div class="form-group"><label class="form-label">Desde</label><input type="date" class="form-control" id="fecha-inicio-personalizado"></div>
                    <div class="form-group"><label class="form-label">Hasta</label><input type="date" class="form-control" id="fecha-fin-personalizado"></div>
                    <div class="form-group d-flex align-items-end"><button type="button" class="btn btn-primary btn-sm" id="btn-calcular-rotacion-personalizado">Filtrar</button></div>
                </div>
                <div class="search-container">
                    <i class="fas fa-search"></i>
                    <input type="text" class="form-control" id="buscador-egresos" placeholder="Buscar por nombre, identidad o motivo...">
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead><tr><th>Fecha Egreso</th><th>Nombre</th><th>Identidad</th><th>Razón</th></tr></thead>
                        <tbody id="tabla-egresos"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/db.js"></script>
    <script>
        let datos = { activos: [], ingresos: [], egresos: [] };
        let gAnual = null, gActual = null, gHist = null, gFilt = null;

        $(document).ready(async function() {
            await cargarYRenderizar();

            $('#btn-filtrar-rotacion-grafico').on('click', () => crearGraficoRotacionAnual(parseInt($('#filtro-ano-rotacion').val(), 10)));
            $('#btn-filtrar-egresos').on('click', () => {
                const a = parseInt($('#filtro-ano-egresos').val(), 10), m = parseInt($('#filtro-mes-egresos').val(), 10);
                $('#contenedorGraficoFiltradoEgresos').show();
                crearGraficoPie('graficoEgresosMotivoFiltrado', gFilt, inst => gFilt = inst,
                    datos.egresos.filter(e => { const f = new Date(e.fechaEgreso + 'T00:00:00'); return f.getFullYear() === a && f.getMonth() === m; }),
                    `Egresos (${new Date(a, m).toLocaleString('es-ES', { month: 'long' })} ${a})`);
            });

            $('#btn-calcular-rotacion-personalizado').on('click', () => {
                const ini = $('#fecha-inicio-personalizado').val(), fin = $('#fecha-fin-personalizado').val();
                let lista = datos.egresos;
                if (ini) lista = lista.filter(e => e.fechaEgreso >= ini);
                if (fin) lista = lista.filter(e => e.fechaEgreso <= fin);
                mostrarEgresos(lista);
            });

            $('#buscador-egresos').on('input', function() {
                const q = $(this).val().toLowerCase();
                $('#tabla-egresos tr').each(function() {
                    $(this).toggle($(this).text().toLowerCase().includes(q));
                });
            });

            if (syncChannel) syncChannel.onmessage = cargarYRenderizar;
        });

        async function cargarYRenderizar() {
            datos = await PB_DB.obtenerDatosPrincipales();
            calcularPeriodos();
            popularFiltros();
            const hoy = new Date();
            crearGraficoRotacionAnual(hoy.getFullYear());
            crearGraficoPie('graficoEgresosMotivoActual', gActual, inst => gActual = inst,
                datos.egresos.filter(e => { const f = new Date(e.fechaEgreso + 'T00:00:00'); return f.getMonth() === hoy.getMonth() && f.getFullYear() === hoy.getFullYear(); }),
                'Egresos (Mes Actual)');
            crearGraficoPie('graficoEgresosMotivoHistorico', gHist, inst => gHist = inst, datos.egresos, 'Egresos (Histórico)');
            mostrarEgresos(datos.egresos);
        }

        function calcularPeriodos() {
            const hoy = new Date();
            const map = [
                ['mes', new Date(hoy.getFullYear(), hoy.getMonth(), 1)],
                ['3meses', new Date(hoy.getFullYear(), hoy.getMonth() - 3, 1)],
                ['6meses', new Date(hoy.getFullYear(), hoy.getMonth() - 6, 1)],
                ['12meses', new Date(hoy.getFullYear(), hoy.getMonth() - 12, 1)]
            ];
            map.forEach(([id, ini]) => {
                const r = calcularRotacionUnificada(datos.activos, datos.egresos, ini, hoy);
                $(`#rotacion-${id}`).text(r.porcentaje + '%');
                $(`#detalle-${id}`).text(`${r.egresos} egresos`);
            });
            if (datos.ingresos.length > 0) {
                const primero = datos.ingresos.reduce((min, c) => {
                    const f = new Date(c.fechaInicio + 'T00:00:00');
                    return f < min ? f : min;
                }, new Date());
                const rg = calcularRotacionUnificada(datos.activos, datos.egresos, primero, hoy);
                $('#rotacion-general').text(rg.porcentaje + '%');
                $('#detalle-general').text(`${rg.egresos} egresos`);
            }
        }

        function popularFiltros() {
            const fMes = $('#filtro-mes-egresos').empty();
            const fAno = $('#filtro-ano-egresos').empty();
            const fAnoRot = $('#filtro-ano-rotacion').empty();
            const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
            meses.forEach((m, i) => fMes.append(`<option value="${i}">${m}</option>`));

            const anos = [...new Set(datos.egresos.map(e => new Date(e.fechaEgreso + 'T00:00:00').getFullYear()))];
            const anoAct = new Date().getFullYear();
            if (!anos.includes(anoAct)) anos.push(anoAct);
            anos.sort((a, b) => b - a).forEach(a => {
                fAno.append(`<option value="${a}">${a}</option>`);
                fAnoRot.append(`<option value="${a}">${a}</option>`);
            });
            fMes.val(new Date().getMonth());
            fAno.val(anoAct);
            fAnoRot.val(anoAct);
        }

        function crearGraficoRotacionAnual(ano) {
            if (gAnual) gAnual.destroy();
            const counts = Array(12).fill(0);
            datos.egresos.forEach(e => {
                const f = new Date(e.fechaEgreso + 'T00:00:00');
                if (f.getFullYear() === ano) counts[f.getMonth()]++;
            });
            gAnual = new Chart(document.getElementById('graficoRotacionAnual').getContext('2d'), {
                type: 'line',
                data: {
                    labels: ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"],
                    datasets: [{ label: `Egresos por Mes en ${ano}`, data: counts, borderColor: '#e74c3c', backgroundColor: 'rgba(231,76,60,0.1)', fill: true, tension: 0.4 }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });
        }

        function crearGraficoPie(canvasId, prevInst, setInst, lista, titulo) {
            if (prevInst) prevInst.destroy();
            const conteo = {};
            lista.forEach(e => { conteo[e.razon] = (conteo[e.razon] || 0) + 1; });
            const inst = new Chart(document.getElementById(canvasId).getContext('2d'), {
                type: 'pie',
                data: { labels: Object.keys(conteo), datasets: [{ data: Object.values(conteo), backgroundColor: ['#2980b9','#c0392b','#f39c12','#8e44ad','#27ae60'] }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: titulo } } }
            });
            setInst(inst);
        }

        function mostrarEgresos(lista) {
            const tb = $('#tabla-egresos').empty();
            if (lista.length === 0) return tb.append('<tr><td colspan="4" class="text-center">No hay egresos.</td></tr>');
            [...lista].sort((a, b) => new Date(b.fechaEgreso) - new Date(a.fechaEgreso)).forEach(e => {
                tb.append(`<tr><td>${formatearFecha(e.fechaEgreso)}</td><td>${e.nombre}</td><td>${e.identidad}</td><td>${e.razon}</td></tr>`);
            });
        }
    </script>
</body>
</html>
