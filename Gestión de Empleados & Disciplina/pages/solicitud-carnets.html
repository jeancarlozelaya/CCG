<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Carnets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .carnet-toolbar {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }
        .carnet-card {
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: all 0.25s ease;
            margin-bottom: 15px;
            background: white;
            border: 1px solid #e9ecef;
            overflow: hidden;
        }
        .carnet-card.no-vista {
            border: 1px solid #a9dfbf;
            border-left: 5px solid #16a085;
            box-shadow: 0 4px 14px rgba(22, 160, 133, 0.13);
        }
        .carnet-card.seleccionada {
            outline: 2px solid #2ecc71;
        }
        .carnet-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .carnet-card-header {
            padding: 13px 18px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .carnet-card.no-vista .carnet-card-header {
            background: linear-gradient(135deg, #e8f8f5, #d1f2eb);
            border-bottom-color: #a3e4d7;
        }
        .carnet-card-body {
            padding: 20px;
        }
        .carnet-check {
            width: 19px;
            height: 19px;
            cursor: pointer;
            accent-color: #16a085;
            flex-shrink: 0;
        }
        .carnet-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #dee2e6;
            flex-shrink: 0;
            cursor: pointer;
        }
        .carnet-avatar-placeholder {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 22px;
            color: white;
            flex-shrink: 0;
            cursor: pointer;
        }
        .carnet-detalle-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 6px 12px;
            display: inline-block;
            font-size: 0.8rem;
            color: #495057;
            margin-right: 5px;
            margin-top: 4px;
        }
        .carnet-detalle-item i {
            margin-right: 5px;
            color: #6c757d;
        }
        .carnet-evidencias {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .carnet-foto-evidencia {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }
        .carnet-foto-evidencia:hover {
            transform: scale(1.05);
            border-color: #3498db;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }
        .carnet-badge-nueva {
            font-size: 0.72rem;
            padding: 4px 12px;
            border-radius: 20px;
            background: #16a085;
            color: white;
            font-weight: 700;
        }
        .carnet-badge-vista {
            font-size: 0.72rem;
            padding: 4px 12px;
            border-radius: 20px;
            background: #d4edda;
            color: #155724;
            font-weight: 600;
        }
    </style>
</head>
<body class="subpage-body">
    <div class="container-fluid">
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                <span><i class="fas fa-id-badge me-2"></i>Solicitudes de Carnet</span>
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <button class="btn btn-warning btn-sm" id="btn-marcar-todas-vistas" style="display: none;">
                        <i class="fas fa-check-double me-1"></i>Marcar todas como vistas (<span id="count-no-vistas">0</span>)
                    </button>
                    <button class="btn btn-light btn-sm" id="btn-refrescar-carnets">
                        <i class="fas fa-sync-alt me-1"></i>Actualizar
                    </button>
                </div>
            </div>

            <div class="card-body">
                <div id="aviso-red-carnets" class="alert alert-warning py-2 px-3 small mb-3" style="display: none;"></div>

                <!-- BARRA DE FILTROS Y EXPORTACIÓN EXCEL -->
                <div class="carnet-toolbar">
                    <div class="d-flex flex-wrap align-items-center gap-2 flex-grow-1">
                        <div class="input-group input-group-sm" style="max-width: 260px;">
                            <span class="input-group-text bg-white"><i class="fas fa-search text-muted"></i></span>
                            <input type="text" id="buscar-carnet" class="form-control" placeholder="Buscar nombre o identidad...">
                        </div>
                        <select id="filtro-estado-carnet" class="form-select form-select-sm" style="max-width: 175px;">
                            <option value="todas">Todas las solicitudes</option>
                            <option value="nuevas">Solo nuevas (sin ver)</option>
                            <option value="vistas">Solo vistas</option>
                        </select>
                    </div>

                    <div class="d-flex flex-wrap align-items-center gap-2">
                        <button type="button" class="btn btn-outline-primary btn-sm" id="btn-sel-nuevas">
                            <i class="fas fa-bell me-1"></i>Sel. Nuevas (<span id="count-nuevas-btn">0</span>)
                        </button>
                        <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-sel-todas">
                            <i class="fas fa-check-square me-1"></i>Sel. Todas
                        </button>
                        <button type="button" class="btn btn-outline-dark btn-sm" id="btn-limpiar-sel">
                            <i class="fas fa-times me-1"></i>Limpiar
                        </button>
                        <button type="button" class="btn btn-success btn-sm fw-bold" id="btn-exportar-excel" disabled>
                            <i class="fas fa-file-excel me-1"></i>Generar Excel (<span id="count-seleccionadas">0</span>)
                        </button>
                    </div>
                </div>

                <div id="contenedor-carnets"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/db.js"></script>
    <script>
        let datos = { activos: [], egresos: [], ausencias: [], disciplina: [], evaluaciones: [], incidentes: [] };
        let colaboradoresActivos = [];
        let colaboradoresEgresos = [];
        let ausencias = [];
        let disciplina = [];
        let evaluaciones = [];
        let incidentes = [];

        let listaSolicitudes = [];
        let seleccionadasKeys = new Set();

        $(document).ready(async function() {
            await cargarDatosBase();
            await cargarSolicitudes(false);

            $('#btn-refrescar-carnets').on('click', () => cargarSolicitudes(true));
            $('#btn-marcar-todas-vistas').on('click', marcarTodasComoVistas);
            $('#buscar-carnet').on('input', renderSolicitudes);
            $('#filtro-estado-carnet').on('change', renderSolicitudes);

            $('#btn-sel-nuevas').on('click', function() {
                seleccionadasKeys.clear();
                obtenerFiltradas().forEach(s => {
                    if (!s.vista) seleccionadasKeys.add(obtenerClave(s));
                });
                renderSolicitudes();
            });

            $('#btn-sel-todas').on('click', function() {
                obtenerFiltradas().forEach(s => seleccionadasKeys.add(obtenerClave(s)));
                renderSolicitudes();
            });

            $('#btn-limpiar-sel').on('click', function() {
                seleccionadasKeys.clear();
                renderSolicitudes();
            });

            $('#btn-exportar-excel').on('click', generarExcelSeleccionados);

            $(document).on('change', '.carnet-check', function() {
                const key = $(this).data('key');
                if (this.checked) seleccionadasKeys.add(key);
                else seleccionadasKeys.delete(key);
                $(this).closest('.carnet-card').toggleClass('seleccionada', this.checked);
                actualizarContadorSeleccion();
            });

            $(document).on('click', '.btn-marcar-vista', async function() {
                const key = $(this).data('key');
                await marcarUnaComoVista(key, $(this));
            });

            $(document).on('click', '.carnet-avatar-click', function() {
                const identidad = $(this).data('identidad');
                abrirHistorialColaborador(identidad);
            });

            $(document).on('click', '.img-evidencia-click', function() {
                const url = $(this).data('url');
                const titulo = $(this).data('titulo') || 'Evidencia del Carnet';
                verFotoEvidencia(url, titulo);
            });

            if (syncChannel) {
                syncChannel.onmessage = async () => {
                    await cargarDatosBase();
                };
            }
        });

        function obtenerClave(s) {
            return `${s.fila || 0}|${s.fechaSolicitud || ''}|${s.identidad || s.colaborador || ''}`;
        }

        function escapeHtml(s) {
            if (s === null || s === undefined) return '';
            return String(s).replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));
        }

        async function cargarDatosBase() {
            datos = await PB_DB.obtenerDatosPrincipales();
            colaboradoresActivos = datos.activos || [];
            colaboradoresEgresos = datos.egresos || [];
            ausencias = datos.ausencias || [];
            disciplina = datos.disciplina || [];
            evaluaciones = datos.evaluaciones || [];
            incidentes = datos.incidentes || [];
        }

        async function fetchConReintento(url, options = {}, reintentos = 2) {
            let ultimoError;
            for (let i = 0; i <= reintentos; i++) {
                try {
                    const resp = await fetch(url, {
                        credentials: 'omit',
                        redirect: 'follow',
                        cache: 'no-store',
                        ...options
                    });
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    return resp;
                } catch (err) {
                    ultimoError = err;
                    if (i < reintentos) {
                        await new Promise(r => setTimeout(r, 700 * (i + 1)));
                    }
                }
            }
            throw ultimoError;
        }

        async function aplicarPendientesLocales(lista) {
            const pendientes = (await PB_DB.obtenerPendientes()).filter(p => p.destino === 'carnets' && p.accion === 'marcar_vista');
            if (pendientes.length === 0) return lista;

            const filasPend = new Set();
            const fechasPend = new Set();
            pendientes.forEach(p => {
                (p.payload.items || []).forEach(it => {
                    if (it.fila) filasPend.add(Number(it.fila));
                    if (it.fechaSolicitud) fechasPend.add(String(it.fechaSolicitud));
                });
            });

            return lista.map(s => {
                if (filasPend.has(Number(s.fila)) || (s.fechaSolicitud && fechasPend.has(String(s.fechaSolicitud)))) {
                    return { ...s, vista: true };
                }
                return s;
            });
        }

        async function cargarSolicitudes(forzarRed = false) {
            const container = $('#contenedor-carnets');
            const $avisoRed = $('#aviso-red-carnets');
            $avisoRed.hide().text('');

            const cached = await PB_DB.obtenerCache('carnets');

            if (cached && cached.datos && !forzarRed) {
                listaSolicitudes = await aplicarPendientesLocales(cached.datos);
                renderSolicitudes();
            } else {
                container.html('<div class="text-center p-4"><div class="spinner-border text-primary" role="status"></div><p class="mt-2">Cargando solicitudes de carnet...</p></div>');
            }

            if (navigator.onLine) {
                try {
                    const response = await fetchConReintento(CARNETS_SCRIPT_URL + "?accion=listar&t=" + Date.now(), { method: 'GET' }, 2);
                    const data = await response.json();
                    if (data && data.success) {
                        const lista = await aplicarPendientesLocales(data.solicitudes || []);
                        listaSolicitudes = lista;
                        await PB_DB.guardarCache('carnets', lista);
                        renderSolicitudes();
                        PB_DB.notificarCambio('carnets_actualizados');
                    } else if (!cached) {
                        mostrarVacio(container);
                    }
                } catch (error) {
                    console.warn('No se pudieron actualizar las solicitudes de carnet desde el servidor:', error);
                    if (cached && cached.datos) {
                        $avisoRed.html('<i class="fas fa-exclamation-circle me-1"></i>No se pudo conectar con Google Apps Script en este momento. Mostrando copia local.').show();
                        listaSolicitudes = await aplicarPendientesLocales(cached.datos);
                        renderSolicitudes();
                    } else {
                        container.html(`
                            <div class="alert alert-danger text-center">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                Error al cargar las solicitudes (${escapeHtml(error.message)}).
                                <div class="mt-2">
                                    <button class="btn btn-sm btn-outline-danger" onclick="cargarSolicitudes(true)">
                                        <i class="fas fa-redo me-1"></i>Reintentar
                                    </button>
                                </div>
                            </div>`);
                    }
                }
            } else if (!cached) {
                container.html(`
                    <div class="alert alert-warning text-center">
                        <i class="fas fa-plane me-2"></i>
                        Modo offline: aún no hay solicitudes guardadas localmente.
                    </div>`);
            }
        }

        function obtenerFiltradas() {
            const q = ($('#buscar-carnet').val() || '').trim().toLowerCase();
            const estadoFiltro = $('#filtro-estado-carnet').val() || 'todas';

            return listaSolicitudes.filter(s => {
                if (estadoFiltro === 'nuevas' && s.vista) return false;
                if (estadoFiltro === 'vistas' && !s.vista) return false;
                if (q) {
                    const nom = (s.colaborador || '').toLowerCase();
                    const id = (s.identidad || '').toLowerCase();
                    if (!nom.includes(q) && !id.includes(q)) return false;
                }
                return true;
            });
        }

        function mostrarVacio(container, mensaje = 'No hay solicitudes de carnet registradas') {
            $('#btn-marcar-todas-vistas').hide();
            container.html(`
                <div class="text-center p-5">
                    <i class="fas fa-id-badge" style="font-size: 4rem; color: #bdc3c7; display: block; margin-bottom: 15px;"></i>
                    <h5 class="text-muted">${mensaje}</h5>
                </div>`);
            actualizarContadores();
        }

        function actualizarContadorSeleccion() {
            const count = seleccionadasKeys.size;
            $('#count-seleccionadas').text(count);
            $('#btn-exportar-excel').prop('disabled', count === 0);
        }

        function actualizarContadores() {
            const noVistas = listaSolicitudes.filter(s => !s.vista).length;
            $('#count-no-vistas').text(noVistas);
            $('#count-nuevas-btn').text(noVistas);
            if (noVistas > 0) $('#btn-marcar-todas-vistas').show();
            else $('#btn-marcar-todas-vistas').hide();
            actualizarContadorSeleccion();
        }

        function extraerUrls(texto) {
            if (!texto) return [];
            const str = String(texto).trim();
            if (!str) return [];
            try {
                if (str.startsWith('[')) {
                    const arr = JSON.parse(str);
                    if (Array.isArray(arr)) return arr.filter(u => typeof u === 'string' && u.trim());
                }
            } catch (e) {}
            return str.split(/[\n,;|]+/).map(u => u.trim()).filter(u => /^https?:\/\//i.test(u));
        }

        function renderSolicitudes() {
            const container = $('#contenedor-carnets');
            actualizarContadores();

            if (!listaSolicitudes || listaSolicitudes.length === 0) {
                mostrarVacio(container);
                return;
            }

            const filtradas = obtenerFiltradas();
            if (filtradas.length === 0) {
                mostrarVacio(container, 'No hay solicitudes que coincidan con el filtro');
                return;
            }

            let html = `<div style="max-height: 580px; overflow-y: auto; padding-right: 5px;">`;

            filtradas.forEach(sol => {
                const key = obtenerClave(sol);
                const checked = seleccionadasKeys.has(key);
                const esVista = Boolean(sol.vista);
                const nombreSeguro = sol.colaborador || 'Sin nombre';
                const iniciales = nombreSeguro.split(' ').map(p => p[0]).join('').substring(0, 2).toUpperCase();

                let colaborador = colaboradoresActivos.find(c => c.identidad === sol.identidad)
                    || colaboradoresEgresos.find(c => c.identidad === sol.identidad);

                const fotoUrl = colaborador && colaborador.fotoUrl ? colaborador.fotoUrl : '';
                const colores = ['#16a085', '#3498db', '#2ecc71', '#e67e22', '#9b59b6', '#2c3e50'];
                const colorFondo = colores[nombreSeguro.length % colores.length];

                const identidadAttr = escapeHtml(sol.identidad || '');
                const fotoHtml = fotoUrl
                    ? `<img src="${escapeHtml(fotoUrl)}" class="carnet-avatar carnet-avatar-click" data-identidad="${identidadAttr}" alt="${escapeHtml(nombreSeguro)}" onerror="this.outerHTML='<div class=\\'carnet-avatar-placeholder carnet-avatar-click\\' data-identidad=\\'${identidadAttr}\\' style=\\'background:${colorFondo};\\'>${escapeHtml(iniciales)}</div>'">`
                    : `<div class="carnet-avatar-placeholder carnet-avatar-click" data-identidad="${identidadAttr}" style="background: ${colorFondo};">${escapeHtml(iniciales)}</div>`;

                const fechaFormateada = formatearFecha(sol.fechaSolicitud);
                const horaFormateada = formatearHoraDesdeFecha(sol.fechaSolicitud);

                const estadoBadge = esVista
                    ? `<span class="carnet-badge-vista"><i class="fas fa-check-double me-1"></i>Vista</span>`
                    : `<span class="carnet-badge-nueva"><i class="fas fa-bell me-1"></i>Nueva</span>`;

                const botonMarcar = esVista
                    ? ''
                    : `<button type="button" class="btn btn-outline-success btn-sm btn-marcar-vista" data-key="${escapeHtml(key)}">
                           <i class="fas fa-check me-1"></i>Marcar como vista
                       </button>`;

                const urlsFotos = extraerUrls(sol.fotos);
                const urlsFirma = extraerUrls(sol.firma);
                const firmaPrincipal = urlsFirma.length > 0 ? urlsFirma[0] : '';

                const firmaHtml = firmaPrincipal ? `
                    <div style="flex-shrink: 0; text-align: center; background: #f0f8ff; padding: 6px 12px; border-radius: 8px; border: 1px solid #d4edda; min-width: 100px;">
                        <div style="font-size: 0.65rem; color: #28a745; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px;">
                            <i class="fas fa-signature me-1"></i>Firma
                        </div>
                        <img src="${escapeHtml(firmaPrincipal)}"
                             class="img-evidencia-click"
                             data-url="${escapeHtml(firmaPrincipal)}"
                             data-titulo="Firma del Solicitante"
                             style="max-width: 120px; max-height: 50px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; background: white; padding: 2px;"
                             onerror="this.style.display='none'; this.parentElement.innerHTML += '<span style=\\'color: #999; font-size: 0.7rem;\\'>No disponible</span>'">
                    </div>` : '';

                const fotosHtml = urlsFotos.length > 0 ? `
                    <div class="carnet-evidencias">
                        ${urlsFotos.map(f => `
                            <img src="${escapeHtml(f)}"
                                 class="carnet-foto-evidencia img-evidencia-click"
                                 data-url="${escapeHtml(f)}"
                                 data-titulo="Evidencia del Carnet"
                                 onerror="this.style.display='none'"
                                 alt="Evidencia">
                        `).join('')}
                    </div>` : '';

                html += `
                    <div class="carnet-card ${esVista ? '' : 'no-vista'} ${checked ? 'seleccionada' : ''}">
                        <div class="carnet-card-header">
                            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                                <input type="checkbox" class="carnet-check" data-key="${escapeHtml(key)}" ${checked ? 'checked' : ''} title="Incluir en Excel">
                                ${estadoBadge}
                                <span style="font-size: 0.78rem; color: #6c757d;">
                                    <i class="fas fa-calendar-alt me-1"></i>${fechaFormateada}
                                </span>
                                ${horaFormateada ? `<span style="font-size: 0.78rem; color: #6c757d;"><i class="fas fa-clock me-1"></i>${horaFormateada}</span>` : ''}
                            </div>
                            <div>${botonMarcar}</div>
                        </div>
                        <div class="carnet-card-body">
                            <div style="display: flex; gap: 18px; align-items: flex-start;">
                                ${fotoHtml}
                                <div style="flex: 1; min-width: 0;">
                                    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; flex-wrap: wrap;">
                                        <div style="flex: 1; min-width: 150px;">
                                            <h5 style="font-weight: 700; color: #2c3e50; margin: 0 0 4px 0; font-size: 1.05rem;">
                                                ${escapeHtml(nombreSeguro)}
                                            </h5>
                                            <div style="display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px;">
                                                ${sol.identidad ? `<span class="carnet-detalle-item"><i class="fas fa-id-card"></i>${escapeHtml(sol.identidad)}</span>` : ''}
                                                <span class="carnet-detalle-item"><i class="fas fa-hourglass-half"></i>Tiempo: ${escapeHtml(sol.tiempoOrganizacion || 'N/D')}</span>
                                                <span class="carnet-detalle-item"><i class="fas fa-id-badge"></i>¿Tenía carnet?: ${escapeHtml(sol.teniaCarnet || 'N/D')}</span>
                                                <span class="carnet-detalle-item"><i class="fas fa-address-card"></i>¿Tiene anterior?: ${escapeHtml(sol.tieneCarnetAnterior || 'N/A')}</span>
                                            </div>
                                        </div>
                                        ${firmaHtml}
                                    </div>
                                    ${fotosHtml}
                                </div>
                            </div>
                        </div>
                    </div>`;
            });

            const noVistas = listaSolicitudes.filter(s => !s.vista).length;
            html += `</div>
                <div class="text-muted small text-center mt-3">
                    Mostrando <strong>${filtradas.length}</strong> de <strong>${listaSolicitudes.length}</strong> solicitudes · Sin ver: <strong>${noVistas}</strong>
                </div>`;

            container.html(html);
        }

        function verFotoEvidencia(url, titulo = 'Evidencia del Carnet') {
            if (!url) return;

        async function enviarMarcadoVista(items, descripcion) {
            if (navigator.onLine) {
                try {
                    const body = new URLSearchParams();
                    body.append('accion', 'marcar_vista');
                    body.append('items', JSON.stringify(items));

                    const resp = await fetchConReintento(CARNETS_SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                        body: body.toString()
                    }, 1);

                    const resJson = await resp.json();
                    if (!resJson.success) throw new Error(resJson.error || 'Error en servidor');
                    return { online: true };
                } catch (err) {
                    console.warn('Fallo envío inmediato de vista en carnets, encolando offline:', err);
                }
            }

            await PB_DB.agregarPendiente({
                titulo: 'Marcar Solicitud(es) de Carnet como Vista',
                detalle: descripcion,
                destino: 'carnets',
                accion: 'marcar_vista',
                payload: { items }
            });
            return { online: false };
        }

        async function marcarComoVistasLista(solicitudesAMarcar, mensajeExito) {
            if (!solicitudesAMarcar || solicitudesAMarcar.length === 0) return;

            const keysSet = new Set(solicitudesAMarcar.map(obtenerClave));
            const items = solicitudesAMarcar.map(s => ({ fila: s.fila || 0, fechaSolicitud: s.fechaSolicitud || '' }));

            listaSolicitudes = listaSolicitudes.map(s => keysSet.has(obtenerClave(s)) ? { ...s, vista: true } : s);
            await PB_DB.guardarCache('carnets', listaSolicitudes);
            renderSolicitudes();

            const desc = solicitudesAMarcar.length === 1
                ? `${solicitudesAMarcar[0].colaborador} (${formatearFecha(solicitudesAMarcar[0].fechaSolicitud)})`
                : `${solicitudesAMarcar.length} solicitud(es) de carnet`;

            const res = await enviarMarcadoVista(items, desc);
            PB_DB.notificarCambio('carnets_actualizados');

            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: res.online ? 'success' : 'info',
                title: res.online ? mensajeExito : 'Marcado localmente (pendiente de sincronizar)',
                showConfirmButton: false,
                timer: 2200
            });
        }

        async function marcarUnaComoVista(key, $btn) {
            const sol = listaSolicitudes.find(s => obtenerClave(s) === key);
            if (!sol || sol.vista) return;

            if ($btn) {
                $btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin me-1"></i>Guardando...');
            }
            await marcarComoVistasLista([sol], 'Solicitud marcada como vista');

        async function marcarTodasComoVistas() {
            const noVistas = listaSolicitudes.filter(s => !s.vista);
            if (noVistas.length === 0) return;

            const $btn = $('#btn-marcar-todas-vistas');
            $btn.prop('disabled', true);
            await marcarComoVistasLista(noVistas, 'Todas marcadas como vistas');

        function cargarScriptExterno(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = () => resolve(true);
                script.onerror = () => reject(new Error('No se pudo cargar ' + src));
                document.head.appendChild(script);
            });
        }

        async function asegurarLibreriaXLSX() {
            if (typeof XLSX !== 'undefined') return true;
            const urlsRespaldo = [
                'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
                'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
                'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'
            ];
            for (const url of urlsRespaldo) {
                try {
                    await cargarScriptExterno(url);
                    if (typeof XLSX !== 'undefined') return true;
                } catch (e) {}
            }
            return false;
        }

        function descargarCSVCompatibleExcel(filasExcel, nombreArchivo) {
            const headers = Object.keys(filasExcel[0]);
            const escaparCSV = (val) => {
                const s = String(val === null || val === undefined ? '' : val).replace(/"/g, '""');
                return `"${s}"`;
            };
            const lineas = [
                headers.map(escaparCSV).join(','),
                ...filasExcel.map(fila => headers.map(h => escaparCSV(fila[h])).join(','))
            ];
            const contenido = '\uFEFF' + lineas.join('\r\n');
            const blob = new Blob([contenido], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = nombreArchivo;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        async function generarExcelSeleccionados() {
            const seleccionadas = listaSolicitudes.filter(s => seleccionadasKeys.has(obtenerClave(s)));
            if (seleccionadas.length === 0) {
                return Swal.fire('Sin selección', 'Marca al menos una solicitud para generar el archivo Excel.', 'warning');
            }

            const filasExcel = seleccionadas.map((s, idx) => {
                const fecha = formatearFecha(s.fechaSolicitud);
                const hora = formatearHoraDesdeFecha(s.fechaSolicitud);
                return {
                    "N°": idx + 1,
                    "Fecha de Solicitud": hora ? `${fecha} ${hora}` : fecha,
                    "Colaborador": s.colaborador || "",
                    "Identidad": s.identidad || "",
                    "Tiempo en la Organización": s.tiempoOrganizacion || "",
                    "¿Tenía Carnet Antes?": s.teniaCarnet || "",
                    "¿Tiene el Carnet Anterior?": s.tieneCarnetAnterior || "",
                    "Fotos de Evidencia": s.fotos || "",
                    "Firma del Solicitante": s.firma || "",
                    "Estado": s.vista ? "Vista" : "Nueva"
                };
            });

            const $btn = $('#btn-exportar-excel');
            $btn.prop('disabled', true);
            const xlsxDisponible = await asegurarLibreriaXLSX();
            $btn.prop('disabled', false);

            let nombreArchivo = `Solicitud_Carnets_${getHoyStr()}.xlsx`;

            if (xlsxDisponible) {
                const ws = XLSX.utils.json_to_sheet(filasExcel);
                ws['!cols'] = [
                    { wch: 5 },
                    { wch: 22 },
                    { wch: 30 },
                    { wch: 18 },
                    { wch: 24 },
                    { wch: 20 },
                    { wch: 24 },
                    { wch: 42 },
                    { wch: 42 },
                    { wch: 12 }
                ];
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Solicitud de Carnets");
                XLSX.writeFile(wb, nombreArchivo);
            } else {
                nombreArchivo = `Solicitud_Carnets_${getHoyStr()}.csv`;
                descargarCSVCompatibleExcel(filasExcel, nombreArchivo);
            }

            const noVistasExportadas = seleccionadas.filter(s => !s.vista);
            if (noVistasExportadas.length > 0) {
                const conf = await Swal.fire({
                    icon: 'success',
                    title: 'Archivo Generado',
                    html: `Se exportaron <strong>${seleccionadas.length}</strong> solicitud(es) en <code>${nombreArchivo}</code>.<br><br>
                           Hay <strong>${noVistasExportadas.length}</strong> solicitud(es) nueva(s) en este archivo. ¿Deseas marcarlas como <strong>Vistas</strong> ahora?`,
                    showCancelButton: true,
                    confirmButtonText: '<i class="fas fa-check me-1"></i>Sí, marcar como vistas',
                    cancelButtonText: 'Dejar sin marcar',
                    confirmButtonColor: '#16a085'
                });
                if (conf.isConfirmed) {
                    await marcarComoVistasLista(noVistasExportadas, 'Solicitudes exportadas marcadas como vistas');
                }
            } else {
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: 'success',
                    title: `Archivo generado (${seleccionadas.length} registros)`,
                    showConfirmButton: false,
                    timer: 2500
                });
            }
        }

        function abrirHistorialColaborador(identidad) {
            if (!identidad) {
                Swal.fire('Sin identidad', 'Esta solicitud no tiene número de identidad asociado.', 'info');
                return;
            }
            let colaborador = colaboradoresActivos.find(c => c.identidad === identidad);
            let esEgresado = false;
            if (!colaborador) {
                colaborador = colaboradoresEgresos.find(c => c.identidad === identidad);
                esEgresado = true;
            }
            if (!colaborador) {
                Swal.fire('No encontrado', 'No se encontró información de este colaborador en la base local.', 'info');
                return;
            }
            mostrarDetalleColaboradorCompleto(identidad, esEgresado);
        }

                            data: { labels: ord.map(e => formatearFecha(e.fechaEvaluacion)), datasets: [{ label: 'Nota Final', data: ord.map(e => parseFloat(e.notaFinal)), borderColor: '#3498db', backgroundColor: 'rgba(52,152,219,0.15)', fill: true, tension: 0.4 }] },
                            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100 } } }
                        });
                    }
                    const s = document.createElement('style');
                    s.id = styleId;
                    s.textContent = `#historialTabs .nav-link.active{background:white;color:#2c3e50;box-shadow:0 2px 8px rgba(0,0,0,0.08);border-bottom:none;} .swal2-popup{border-radius:16px!important;padding:20px!important;} .swal2-close{color:white!important;}`;
                    document.head.appendChild(s);
                },
                willClose: () => {
                    const el = document.getElementById(styleId);
                    if (el) el.remove();
                }
            });
        }
    </script>
</body>
