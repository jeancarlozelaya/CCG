<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vencimiento de Contratos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="subpage-body">
    <div class="container-fluid">
        <p class="text-center text-muted mb-4">A continuación se muestran los contratos activos por vencer o ya vencidos.</p>

        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" class="form-control" id="buscador-vencimientos" placeholder="Buscar por nombre o identidad...">
        </div>

        <div class="card mb-4">
            <div class="card-header card-header-warning">
                <i class="fas fa-exclamation-triangle me-2"></i>Contratos por Vencer (Próximos 60 días)
            </div>
            <div id="contenedor-vencimientos" class="card-body"></div>
        </div>

        <div class="card mb-4">
            <div class="card-header card-header-danger">
                <i class="fas fa-exclamation-circle me-2"></i>Contratos Vencidos (Requieren Acción)
            </div>
            <div id="contenedor-contratos-vencidos" class="card-body"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/db.js"></script>
    <script>
        let datos = { activos: [], egresos: [], ausencias: [], disciplina: [], evaluaciones: [], incidentes: [] };
        let colaboradoresActivos = [];
        let colaboradoresEgresos = [];
        let ausencias = [];
        let disciplina = [];
        let evaluaciones = [];
        let incidentes = [];

        $(document).ready(async function() {
            await cargarYRenderizar();

            $('#buscador-vencimientos').on('input', filtrarVencimientos);

            $(document).on('click', '#contenedor-vencimientos .resumen-disciplina-item, #contenedor-contratos-vencidos .resumen-disciplina-item', function() {
                const identidad = $(this).data('identidad');
                mostrarDetalleColaboradorCompleto(identidad, false);
            });

            if (syncChannel) {
                syncChannel.onmessage = cargarYRenderizar;
            }
        });

        async function cargarYRenderizar() {
            datos = await PB_DB.obtenerDatosPrincipales();
            colaboradoresActivos = datos.activos || [];
            colaboradoresEgresos = datos.egresos || [];
            ausencias = datos.ausencias || [];
            disciplina = datos.disciplina || [];
            evaluaciones = datos.evaluaciones || [];
            incidentes = datos.incidentes || [];

            actualizarVencimientosContrato();
            filtrarVencimientos();
        }

        function fechaDateAStr(d) {
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function actualizarVencimientosContrato() {
            const containerPorVencer = $('#contenedor-vencimientos').empty();
            const containerVencidos = $('#contenedor-contratos-vencidos').empty();

            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);

            const empleadosPorVencer = [];
            const empleadosVencidos = [];

            colaboradoresActivos.forEach(col => {
                if (!col.fechaInicio) return;
                const duracion = normalizarDuracionContrato(col.duracionContrato);
                const fechaVencimiento = calcularFechaVencimientoContrato(col.fechaInicio, duracion);
                if (!fechaVencimiento) return;

                const diasRestantes = Math.round((fechaVencimiento - hoy) / (1000 * 60 * 60 * 24));

                if (diasRestantes < 0) {
                    empleadosVencidos.push({ ...col, duracion, fechaVencimiento, diasRestantes });
                } else if (diasRestantes <= 60) {
                    empleadosPorVencer.push({ ...col, duracion, fechaVencimiento, diasRestantes });
                }
            });

            empleadosPorVencer.sort((a, b) => a.diasRestantes - b.diasRestantes);
            empleadosVencidos.sort((a, b) => a.diasRestantes - b.diasRestantes);

            if (empleadosPorVencer.length === 0) {
                containerPorVencer.html('<div class="text-center p-3 text-success"><i class="fas fa-check-circle fa-2x mb-2"></i><p class="mb-0">¡Todo en orden! Ningún contrato vence en los próximos 60 días.</p></div>');
            } else {
                let listHtml = '';
                empleadosPorVencer.forEach(item => {
                    let color = 'bg-info text-dark';
                    if (item.diasRestantes <= 7) color = 'bg-danger';
                    else if (item.diasRestantes <= 15) color = 'bg-warning text-dark';

                    const fotoSrc = item.fotoUrl || `https://ui-avatars.com/api/?name=${item.nombre.replace(/\s/g, "+")}&background=random`;
                    const fechaVencStr = fechaDateAStr(item.fechaVencimiento);
                    listHtml += `
                        <div class="resumen-disciplina-item" data-identidad="${item.identidad}" style="cursor: pointer;">
                            <img src="${fotoSrc}" class="resumen-disciplina-img" onerror="this.src='https://ui-avatars.com/api/?name=${item.nombre.replace(/\s/g, "+")}&background=random'">
                            <div class="resumen-disciplina-info">
                                <h6>${item.nombre}</h6>
                                <p class="mb-0 small">
                                    <strong>Vence:</strong> ${formatearFecha(fechaVencStr)}
                                    <span class="badge bg-light text-dark border ms-1">${item.duracion}</span>
                                </p>
                            </div>
                            <span class="badge ${color}">${item.diasRestantes} día(s) restante(s)</span>
                        </div>`;
                });
                containerPorVencer.html(listHtml);
            }

            if (empleadosVencidos.length === 0) {
                containerVencidos.html('<div class="text-center p-3 text-muted"><i class="fas fa-info-circle fa-2x mb-2"></i><p class="mb-0">No hay contratos vencidos pendientes de acción.</p></div>');
            } else {
                let listHtml = '';
                empleadosVencidos.forEach(item => {
                    const fotoSrc = item.fotoUrl || `https://ui-avatars.com/api/?name=${item.nombre.replace(/\s/g, "+")}&background=random`;
                    const fechaVencStr = fechaDateAStr(item.fechaVencimiento);
                    listHtml += `
                        <div class="resumen-disciplina-item" data-identidad="${item.identidad}" style="cursor: pointer;">
                            <img src="${fotoSrc}" class="resumen-disciplina-img" onerror="this.src='https://ui-avatars.com/api/?name=${item.nombre.replace(/\s/g, "+")}&background=random'">
                            <div class="resumen-disciplina-info">
                                <h6>${item.nombre}</h6>
                                <p class="mb-0 small">
                                    <strong>Venció:</strong> ${formatearFecha(fechaVencStr)}
                                    <span class="badge bg-light text-dark border ms-1">${item.duracion}</span>
                                </p>
                            </div>
                            <span class="badge bg-danger">Vencido (${Math.abs(item.diasRestantes)} día(s))</span>
                        </div>`;
                });
                containerVencidos.html(listHtml);
            }
        }

        function filtrarVencimientos() {
            const texto = $('#buscador-vencimientos').val().toLowerCase();
            $('#contenedor-vencimientos .resumen-disciplina-item, #contenedor-contratos-vencidos .resumen-disciplina-item').each(function() {
                const nombre = $(this).find('h6').text().toLowerCase();
                const identidad = String($(this).data('identidad')).toLowerCase();
                $(this).toggle(nombre.includes(texto) || identidad.includes(texto));
            });
        }

        // ==================== MODAL HISTORIAL COMPLETO (DISEÑO ORIGINAL) ====================
        function mostrarDetalleColaboradorCompleto(identidad, esEgresado = false) {
            const colaborador = esEgresado
                ? colaboradoresEgresos.find(c => c.identidad === identidad)
                : colaboradoresActivos.find(c => c.identidad === identidad);

            if (!colaborador) return;

            const historialAusencias = ausencias.filter(d => d.identidad === identidad).sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
            const historialDisciplina = disciplina.filter(d => d.identidad === identidad).sort((a,b) => new Date(b.fechaFalta) - new Date(a.fechaFalta));
            const historialEvaluaciones = evaluaciones.filter(d => d.identidad === identidad).sort((a,b) => new Date(a.fechaEvaluacion) - new Date(b.fechaEvaluacion));
            const historialIncidentes = incidentes.filter(d => d.identidad === identidad).sort((a,b) => new Date(b.fechaIncidente) - new Date(a.fechaIncidente));

            const estadoColor = esEgresado ? '#e74c3c' : '#2ecc71';
            const estadoIcono = esEgresado ? 'fa-user-slash' : 'fa-user-check';
            const fotoSrc = colaborador.fotoUrl || `https://ui-avatars.com/api/?name=${colaborador.nombre.replace(/\s/g, "+")}&background=3498db&color=fff&size=200&font-size=0.5`;

            let edad = '';
            if (colaborador.fechaNacimiento) {
                const edadCalculada = calcularEdad(colaborador.fechaNacimiento);
                if (edadCalculada !== null) edad = edadCalculada;
            }

            const duracion = normalizarDuracionContrato(colaborador.duracionContrato);

            function generarContenidoAusencias() {
                if (historialAusencias.length === 0) {
                    return `
                        <div class="text-center py-5">
                            <div style="width: 60px; height: 60px; background: rgba(46, 204, 113, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;">
                                <i class="fas fa-calendar-check" style="font-size: 28px; color: #2ecc71;"></i>
                            </div>
                            <h6 style="color: #2c3e50; font-weight: 600; margin: 0; font-size: 0.95rem;">Sin Ausencias</h6>
                            <p style="color: #95a5a6; font-size: 0.8rem; margin: 4px 0 0;">No hay ausencias registradas</p>
                        </div>`;
                }
                let html = '<div style="max-height: 350px; overflow-y: auto; padding-right: 5px; text-align: left;">';
                historialAusencias.forEach((a, index) => {
                    const fechaFin = a.fechaFin && a.fechaFin !== a.fecha ? ` → ${formatearFecha(a.fechaFin)}` : '';
                    let badgeColor = 'secondary';
                    if (a.motivo === 'Incapacidad') badgeColor = 'warning';
                    else if (a.motivo === 'Falta Injustificada') badgeColor = 'danger';
                    else if (a.motivo === 'Permiso') badgeColor = 'info';

                    html += `
                        <div style="background: ${index % 2 === 0 ? '#f8f9fa' : 'white'}; border-radius: 8px; padding: 10px 12px; margin-bottom: 5px; border-left: 4px solid var(--bs-${badgeColor});">
                            <div>
                                <span class="badge bg-${badgeColor} me-1" style="font-size: 0.7rem;">${a.motivo}</span>
                                <span style="font-weight: 600; color: #2c3e50; font-size: 0.85rem;">${formatearFecha(a.fecha)}${fechaFin}</span>
                                <span class="badge bg-secondary ms-1" style="font-size: 0.65rem;">${a.diasIncapacidad || 1} día(s)</span>
                                ${a.observaciones ? `<div style="margin-top: 4px; font-size: 0.8rem; color: #7f8c8d;"><i class="fas fa-comment me-1"></i>${a.observaciones}</div>` : ''}
                            </div>
                        </div>`;
                });
                html += '</div>';
                return html;
            }

            function generarContenidoDisciplina() {
                if (historialDisciplina.length === 0) {
                    return `
                        <div class="text-center py-5">
                            <div style="width: 60px; height: 60px; background: rgba(46, 204, 113, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;">
                                <i class="fas fa-check-circle" style="font-size: 28px; color: #2ecc71;"></i>
                            </div>
                            <h6 style="color: #2c3e50; font-weight: 600; margin: 0; font-size: 0.95rem;">Sin Disciplina</h6>
                            <p style="color: #95a5a6; font-size: 0.8rem; margin: 4px 0 0;">No hay acciones disciplinarias</p>
                        </div>`;
                }
                let html = '<div style="max-height: 350px; overflow-y: auto; padding-right: 5px; text-align: left;">';
                historialDisciplina.forEach((d, index) => {
                    const faltasLista = d.descripcionFaltas.split('; ').map(f => `<li style="font-size: 0.8rem;">${f}</li>`).join('');
                    html += `
                        <div style="background: ${index % 2 === 0 ? '#f8f9fa' : 'white'}; border-radius: 8px; padding: 10px 12px; margin-bottom: 5px; border-left: 4px solid #e74c3c;">
                            <div>
                                <span class="badge bg-danger me-1" style="font-size: 0.7rem;">${formatearFecha(d.fechaFalta)}</span>
                                <ul style="margin: 4px 0 0 0; padding-left: 18px;">${faltasLista}</ul>
                                ${d.observaciones ? `<div style="margin-top: 4px; font-size: 0.8rem; color: #7f8c8d;"><i class="fas fa-comment me-1"></i>${d.observaciones}</div>` : ''}
                            </div>
                        </div>`;
                });
                html += '</div>';
                return html;
            }

            function generarContenidoEvaluaciones() {
                if (historialEvaluaciones.length === 0) {
                    return `
                        <div class="text-center py-5">
                            <div style="width: 60px; height: 60px; background: rgba(46, 204, 113, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;">
                                <i class="fas fa-chart-line" style="font-size: 28px; color: #2ecc71;"></i>
                            </div>
                            <h6 style="color: #2c3e50; font-weight: 600; margin: 0; font-size: 0.95rem;">Sin Evaluaciones</h6>
                            <p style="color: #95a5a6; font-size: 0.8rem; margin: 4px 0 0;">No hay evaluaciones registradas</p>
                        </div>`;
                }
                let html = `
                    <div style="background: #f8f9fa; border-radius: 10px; padding: 12px; margin-bottom: 12px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <span style="font-weight: 600; color: #2c3e50; font-size: 0.85rem;"><i class="fas fa-chart-area me-2" style="color: #3498db;"></i>Progreso de Notas</span>
                            <span class="badge bg-primary" style="font-size: 0.7rem;">${historialEvaluaciones.length} evaluación(es)</span>
                        </div>
                        <div class="chart-container" style="height: 140px; margin-bottom: 0;"><canvas id="graficoProgresoCompleto"></canvas></div>
                    </div>
                    <div style="max-height: 180px; overflow-y: auto; padding-right: 5px; text-align: left;">`;
                historialEvaluaciones.forEach((e, index) => {
                    const nota = parseFloat(e.notaFinal);
                    let badgeColor = 'success', icono = 'fa-crown';
                    if (nota < 60) { badgeColor = 'danger'; icono = 'fa-times-circle'; }
                    else if (nota < 70) { badgeColor = 'warning'; icono = 'fa-exclamation-triangle'; }
                    else if (nota < 80) { badgeColor = 'info'; icono = 'fa-info-circle'; }
                    else if (nota < 90) { badgeColor = 'primary'; icono = 'fa-thumbs-up'; }

                    html += `
                        <div style="background: ${index % 2 === 0 ? '#f8f9fa' : 'white'}; border-radius: 8px; padding: 8px 12px; margin-bottom: 4px; border-left: 4px solid var(--bs-${badgeColor});">
                            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
                                <span style="font-size: 0.8rem; color: #7f8c8d;">${formatearFecha(e.fechaEvaluacion)}</span>
                                <span class="badge bg-${badgeColor}" style="font-size: 0.8rem; padding: 3px 10px;">
                                    <i class="fas ${icono} me-1"></i>${e.notaFinal}
                                </span>
                            </div>
                            ${e.observaciones ? `<div style="margin-top: 3px; font-size: 0.75rem; color: #7f8c8d;"><i class="fas fa-comment me-1"></i>${e.observaciones}</div>` : ''}
                        </div>`;
                });
                html += '</div>';
                return html;
            }

            function generarContenidoIncidentes() {
                if (historialIncidentes.length === 0) {
                    return `
                        <div class="text-center py-5">
                            <div style="width: 60px; height: 60px; background: rgba(46, 204, 113, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;">
                                <i class="fas fa-shield-alt" style="font-size: 28px; color: #2ecc71;"></i>
                            </div>
                            <h6 style="color: #2c3e50; font-weight: 600; margin: 0; font-size: 0.95rem;">Sin Incidentes</h6>
                            <p style="color: #95a5a6; font-size: 0.8rem; margin: 4px 0 0;">No hay incidentes registrados</p>
                        </div>`;
                }
                let html = '<div style="max-height: 350px; overflow-y: auto; padding-right: 5px; text-align: left;">';
                historialIncidentes.forEach((inc, index) => {
                    let badgeColor = 'secondary';
                    if (inc.categoriaSiso === 'FAT' || inc.categoriaSiso === 'LWC') badgeColor = 'danger';
                    else if (inc.categoriaSiso === 'MTC') badgeColor = 'warning';
                    else if (inc.categoriaSiso === 'FAC') badgeColor = 'info';
                    else if (inc.categoriaSiso === 'N-M') badgeColor = 'success';

                    html += `
                        <div style="background: ${index % 2 === 0 ? '#f8f9fa' : 'white'}; border-radius: 8px; padding: 10px 12px; margin-bottom: 5px; border-left: 4px solid var(--bs-${badgeColor});">
                            <div>
                                <div style="display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px;">
                                    <span class="badge bg-secondary" style="font-size: 0.65rem;">${formatearFecha(inc.fechaIncidente)}</span>
                                    <span class="badge bg-${badgeColor}" style="font-size: 0.65rem;">${inc.categoriaSiso}</span>
                                    ${inc.parteAfectada ? `<span class="badge bg-primary" style="font-size: 0.65rem;">${inc.parteAfectada}</span>` : ''}
                                </div>
                                <div style="font-size: 0.8rem; color: #2c3e50;">
                                    <div><span style="font-weight: 600;">Causa:</span> ${inc.causa}</div>
                                    <div><span style="font-weight: 600;">Descripción:</span> ${inc.descripcion}</div>
                                    ${inc.medidas ? `<div style="margin-top: 3px;"><span style="font-weight: 600;">Medidas:</span> <span style="color: #27ae60;">${inc.medidas}</span></div>` : ''}
                                </div>
                            </div>
                        </div>`;
                });
                html += '</div>';
                return html;
            }

            const totalAusencias = historialAusencias.length;
            const totalDisciplina = historialDisciplina.length;
            const totalEvaluaciones = historialEvaluaciones.length;
            const totalIncidentes = historialIncidentes.length;

            const isMobile = window.innerWidth < 576;
            const headerPadding = isMobile ? '15px 20px' : '25px 30px';
            const fotoSize = isMobile ? '70px' : '100px';
            const nombreSize = isMobile ? '1.2rem' : '1.5rem';

            const modalHtml = `
                <div style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 0;">
                    <div style="background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); border-radius: 16px; padding: ${headerPadding}; margin: -20px -25px 20px -25px; color: white; position: relative; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.2);">
                        <div style="position: absolute; top: -50%; right: -20%; width: 200px; height: 200px; background: radial-gradient(circle, rgba(52, 152, 219, 0.1) 0%, transparent 70%); border-radius: 50%;"></div>
                        <div style="position: absolute; bottom: -40%; left: -10%; width: 180px; height: 180px; background: radial-gradient(circle, rgba(46, 204, 113, 0.08) 0%, transparent 70%); border-radius: 50%;"></div>

                        <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap; position: relative; z-index: 1; justify-content: flex-start;">
                            <div style="position: relative; flex-shrink: 0;">
                                <div style="position: absolute; inset: -3px; background: linear-gradient(135deg, ${estadoColor}, #3498db); border-radius: 50%; padding: 3px; box-shadow: 0 0 20px rgba(52,152,219,0.25);">
                                    <div style="width: 100%; height: 100%; border-radius: 50%; background: #1a1a2e;"></div>
                                </div>
                                <img src="${fotoSrc}"
                                     style="width: ${fotoSize}; height: ${fotoSize}; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.15); position: relative; z-index: 1;"
                                     onerror="this.src='https://ui-avatars.com/api/?name=${colaborador.nombre.replace(/\s/g, "+")}&background=3498db&color=fff&size=150&font-size=0.5'">
                                <div style="position: absolute; bottom: 0px; right: 0px; background: ${estadoColor}; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border: 2px solid white; z-index: 2; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">
                                    <i class="fas ${estadoIcono}" style="font-size: 10px; color: white;"></i>
                                </div>
                            </div>

                            <div style="flex: 1; min-width: 150px; text-align: left;">
                                <h3 style="margin: 0; font-weight: 700; font-size: ${nombreSize}; letter-spacing: -0.5px; background: linear-gradient(135deg, #fff, #a8d8ea); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: left;">
                                    ${colaborador.nombre}
                                </h3>
                                <div style="margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-start;">
                                    <span class="badge" style="background: rgba(255,255,255,0.12); padding: 3px 10px; font-size: 0.7rem;">
                                        <i class="fas fa-id-card me-1"></i>${colaborador.identidad}
                                    </span>
                                    ${colaborador.sexo ? `<span class="badge" style="background: ${colaborador.sexo === 'Masculino' ? 'rgba(52, 152, 219, 0.25)' : 'rgba(231, 76, 60, 0.25)'}; padding: 3px 10px; font-size: 0.7rem;">
                                        <i class="fas ${colaborador.sexo === 'Masculino' ? 'fa-mars' : 'fa-venus'} me-1"></i>${colaborador.sexo}
                                    </span>` : ''}
                                    ${edad ? `<span class="badge" style="background: rgba(241, 196, 15, 0.2); padding: 3px 10px; font-size: 0.7rem;">
                                        <i class="fas fa-birthday-cake me-1"></i>${edad} años
                                    </span>` : ''}
                                    <span class="badge" style="background: rgba(46, 204, 113, 0.15); color: #2ecc71; border: 1px solid #2ecc71; padding: 3px 10px; font-size: 0.65rem;">
                                        <i class="fas fa-calendar-plus me-1"></i>${formatearFecha(colaborador.fechaInicio)}
                                    </span>
                                    <span class="badge" style="background: rgba(52, 152, 219, 0.2); color: #a8d8ea; border: 1px solid rgba(52, 152, 219, 0.6); padding: 3px 10px; font-size: 0.65rem;">
                                        <i class="fas fa-file-signature me-1"></i>Contrato: ${duracion}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <ul class="nav nav-tabs" id="historialTabs" role="tablist" style="border-bottom: none; margin-bottom: 15px; gap: 3px; background: #f8f9fa; border-radius: 10px; padding: 3px; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; justify-content: flex-start;">
                        <li class="nav-item" role="presentation" style="flex: 0 0 auto;">
                            <button class="nav-link active" id="tab-ausencias" data-bs-toggle="tab" data-bs-target="#content-ausencias" type="button" role="tab"
                                    style="border: none; border-radius: 6px; padding: 6px 12px; font-weight: 600; font-size: 0.75rem; transition: all 0.3s; white-space: nowrap;">
                                <i class="fas fa-clock me-1"></i>Ausencias
                                <span class="badge ${totalAusencias > 0 ? 'bg-danger' : 'bg-secondary'}" style="margin-left: 3px; font-size: 0.6rem;">${totalAusencias}</span>
                            </button>
                        </li>
                        <li class="nav-item" role="presentation" style="flex: 0 0 auto;">
                            <button class="nav-link" id="tab-disciplina" data-bs-toggle="tab" data-bs-target="#content-disciplina" type="button" role="tab"
                                    style="border: none; border-radius: 6px; padding: 6px 12px; font-weight: 600; font-size: 0.75rem; transition: all 0.3s; white-space: nowrap;">
                                <i class="fas fa-gavel me-1"></i>Disciplina
                                <span class="badge ${totalDisciplina > 0 ? 'bg-danger' : 'bg-secondary'}" style="margin-left: 3px; font-size: 0.6rem;">${totalDisciplina}</span>
                            </button>
                        </li>
                        <li class="nav-item" role="presentation" style="flex: 0 0 auto;">
                            <button class="nav-link" id="tab-evaluaciones" data-bs-toggle="tab" data-bs-target="#content-evaluaciones" type="button" role="tab"
                                    style="border: none; border-radius: 6px; padding: 6px 12px; font-weight: 600; font-size: 0.75rem; transition: all 0.3s; white-space: nowrap;">
                                <i class="fas fa-chart-bar me-1"></i>Evaluaciones
                                <span class="badge ${totalEvaluaciones > 0 ? 'bg-danger' : 'bg-secondary'}" style="margin-left: 3px; font-size: 0.6rem;">${totalEvaluaciones}</span>
                            </button>
                        </li>
                        <li class="nav-item" role="presentation" style="flex: 0 0 auto;">
                            <button class="nav-link" id="tab-incidentes" data-bs-toggle="tab" data-bs-target="#content-incidentes" type="button" role="tab"
                                    style="border: none; border-radius: 6px; padding: 6px 12px; font-weight: 600; font-size: 0.75rem; transition: all 0.3s; white-space: nowrap;">
                                <i class="fas fa-exclamation-triangle me-1"></i>Incidentes
                                <span class="badge ${totalIncidentes > 0 ? 'bg-danger' : 'bg-secondary'}" style="margin-left: 3px; font-size: 0.6rem;">${totalIncidentes}</span>
                            </button>
                        </li>
                    </ul>

                    <div class="tab-content" style="background: white; border-radius: 10px; padding: 5px;">
                        <div class="tab-pane fade show active" id="content-ausencias" role="tabpanel">${generarContenidoAusencias()}</div>
                        <div class="tab-pane fade" id="content-disciplina" role="tabpanel">${generarContenidoDisciplina()}</div>
                        <div class="tab-pane fade" id="content-evaluaciones" role="tabpanel">${generarContenidoEvaluaciones()}</div>
                        <div class="tab-pane fade" id="content-incidentes" role="tabpanel">${generarContenidoIncidentes()}</div>
                    </div>
                </div>`;

            const styleId = 'historial-venc-style-' + Date.now();

            Swal.fire({
                title: null,
                html: modalHtml,
                width: window.innerWidth < 576 ? '95%' : '900px',
                showCloseButton: true,
                showConfirmButton: false,
                customClass: {
                    popup: 'animated fadeInDown',
                    closeButton: 'btn-close-white'
                },
                didOpen: () => {
                    if (historialEvaluaciones.length > 0) {
                        const ctx = document.getElementById('graficoProgresoCompleto').getContext('2d');
                        const ordenadas = [...historialEvaluaciones].sort((a,b) => new Date(a.fechaEvaluacion) - new Date(b.fechaEvaluacion));
                        new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: ordenadas.map(e => formatearFecha(e.fechaEvaluacion)),
                                datasets: [{
                                    label: 'Nota Final',
                                    data: ordenadas.map(e => parseFloat(e.notaFinal)),
                                    borderColor: '#3498db',
                                    backgroundColor: 'rgba(52, 152, 219, 0.15)',
                                    fill: true,
                                    tension: 0.4,
                                    pointBackgroundColor: '#3498db',
                                    pointBorderColor: 'white',
                                    pointBorderWidth: 2,
                                    pointRadius: 4,
                                    pointHoverRadius: 6
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: {
                                    legend: { display: false },
                                    tooltip: { callbacks: { label: (ctx) => 'Nota: ' + ctx.parsed.y } }
                                },
                                scales: {
                                    y: { beginAtZero: true, max: 100, ticks: { stepSize: 20, font: { size: 10 } }, grid: { color: 'rgba(0,0,0,0.05)' } },
                                    x: { grid: { display: false }, ticks: { font: { size: 9 } } }
                                }
                            }
                        });
                    }

                    const style = document.createElement('style');
                    style.id = styleId;
                    style.textContent = `
                        #historialTabs .nav-link { color: #7f8c8d; background: transparent; }
                        #historialTabs .nav-link:hover { color: #2c3e50; background: rgba(52, 152, 219, 0.05); }
                        #historialTabs .nav-link.active { color: #2c3e50; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-bottom: none; }
                        .swal2-popup { border-radius: 16px !important; padding: 20px !important; }
                        .swal2-close { color: white !important; opacity: 0.6; transition: all 0.3s; background: rgba(255,255,255,0.1); border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
                        .swal2-close:hover { opacity: 1; background: rgba(255,255,255,0.2); }
                        .swal2-close:focus { box-shadow: none; }
                        @media (max-width: 576px) {
                            .swal2-popup { padding: 15px !important; margin: 10px !important; }
                            #historialTabs .nav-link { font-size: 0.65rem !important; padding: 4px 8px !important; }
                        }
                    `;
                    document.head.appendChild(style);
                },
                willClose: () => {
                    const el = document.getElementById(styleId);
                    if (el) el.remove();
                }
            });
        }
    </script>
</body>
</html>
