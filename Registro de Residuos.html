                                            <i class="fas fa-check"></i>
                                        </button>
                                        <button class="btn-cancelar" onclick="cancelarEliminacionDevolucion(${index})" title="Cancelar eliminación">
                                            <i class="fas fa-times"></i>
                                        </button>
                                    ` : `
                                        <button class="btn-eliminar" onclick="solicitarEliminacionDevolucion(${index})" title="Eliminar registro">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    `}
                                </td>
                            </tr>
                        `;
                    });
                }
                
                tablaHTML += `
                                </tbody>
                            </table>
                        </div>
                        <div class="scroll-indicator">
                            <i class="fas fa-arrows-alt-h"></i> Desliza horizontalmente para ver más información
                        </div>
                `;
                
                modalBody.innerHTML = tablaHTML;
            }
            
            modal.style.display = 'flex';
        }

        // ========== FUNCIONES DE EDICIÓN Y ELIMINACIÓN ==========
        function editarRegistroResiduos(index) {
            const registro = datosResiduos[index];
            registroEnEdicion = registro;
            localStorage.setItem('registroEditando', JSON.stringify(registro));
            
            if (pestañaActiva !== 'residuos') {
                cambiarTab('residuos');
            }
            
            cargarRegistroEnFormulario(registro);
            cerrarModal();
            
            Swal.fire({
                title: 'Registro cargado para edición',
                text: 'El registro se ha cargado en el formulario. Realiza los cambios necesarios y guarda el registro actualizado.',
                icon: 'info',
                confirmButtonText: 'Entendido',
                confirmButtonColor: '#3498db'
            });
        }

        function cargarRegistroEnFormulario(registro) {
            document.getElementById('fecha-residuos').value = registro.fecha;
            $(`#edificio-group button[data-value="${registro.edificio}"]`).click();
            $(`#tipo-residuo-residuos button[data-value="${registro.tipoResiduo}"]`).click();
            $(`#clasificacion-residuos button[data-value="${registro.clasificacion}"]`).click();
            $(`#estado-fisico-residuos button[data-value="${registro.estadoFisico}"]`).click();
            document.getElementById('cantidad-residuos').value = registro.cantidad;
            $('#cantidad-residuos').focus();
        }

        // Eliminación Residuos
        function solicitarEliminacionResiduos(index) {
            datosResiduos[index].enConfirmacion = true;
            guardarDatosResiduos();
            mostrarModalRegistros();
        }

        function confirmarEliminacionResiduos(index) {
            datosResiduos.splice(index, 1);
            guardarDatosResiduos();
            actualizarContadores();
            mostrarModalRegistros();
        }

        function cancelarEliminacionResiduos(index) {
            delete datosResiduos[index].enConfirmacion;
            guardarDatosResiduos();
            mostrarModalRegistros();
        }

        // Eliminación Recolección
        function solicitarEliminacionRecoleccion(index) {
            datosRecoleccion[index].enConfirmacion = true;
            guardarDatosRecoleccion();
            mostrarModalRegistros();
        }

        function confirmarEliminacionRecoleccion(index) {
            datosRecoleccion.splice(index, 1);
            guardarDatosRecoleccion();
            actualizarContadores();
            mostrarModalRegistros();
        }

        function cancelarEliminacionRecoleccion(index) {
            delete datosRecoleccion[index].enConfirmacion;
            guardarDatosRecoleccion();
            mostrarModalRegistros();
        }

        // Eliminación Devolución
        function solicitarEliminacionDevolucion(index) {
            datosDevolucion[index].enConfirmacion = true;
            guardarDatosDevolucion();
            mostrarModalRegistros();
        }

        function confirmarEliminacionDevolucion(index) {
            datosDevolucion.splice(index, 1);
            guardarDatosDevolucion();
            actualizarContadores();
            mostrarModalRegistros();
        }

        function cancelarEliminacionDevolucion(index) {
            delete datosDevolucion[index].enConfirmacion;
            guardarDatosDevolucion();
            mostrarModalRegistros();
        }

        function cerrarModal() {
            if (pestañaActiva === 'residuos') {
                datosResiduos.forEach(registro => {
                    if (registro.enConfirmacion) {
                        delete registro.enConfirmacion;
                    }
                });
                guardarDatosResiduos();
            } else if (pestañaActiva === 'recoleccion') {
                datosRecoleccion.forEach(registro => {
                    if (registro.enConfirmacion) {
                        delete registro.enConfirmacion;
                    }
                });
                guardarDatosRecoleccion();
            } else {
                datosDevolucion.forEach(registro => {
                    if (registro.enConfirmacion) {
                        delete registro.enConfirmacion;
                    }
                });
                guardarDatosDevolucion();
            }
            
            document.getElementById('modal-registros').style.display = 'none';
        }

        // ========== FUNCIONES DE RESPONSABLE ==========
        function cargarResponsable() {
            const responsableGuardado = localStorage.getItem('responsable');
            if (responsableGuardado) {
                try {
                    responsableActual = JSON.parse(responsableGuardado);
                } catch (e) {
                    responsableActual = responsableGuardado;
                }
                actualizarInterfazResponsable();
            }
        }

        function guardarResponsable() {
            const nombreInput = document.getElementById('nombre-responsable');
            const nombre = nombreInput.value.trim();
            
            if (!nombre) {
                Swal.fire({
                    title: 'Campo requerido',
                    text: 'Por favor ingrese el nombre del responsable',
                    icon: 'warning',
                    confirmButtonText: 'Entendido',
                    confirmButtonColor: '#f39c12'
                });
                return;
            }
            
            responsableActual = nombre;
            localStorage.setItem('responsable', JSON.stringify(nombre));
            
            actualizarInterfazResponsable();
            cerrarModalResponsable();
            
            Swal.fire({
                title: 'Responsable guardado',
                text: `El responsable ${nombre} ha sido guardado correctamente`,
                icon: 'success',
                confirmButtonText: 'Aceptar',
                confirmButtonColor: '#28a745',
                timer: 2000,
                showConfirmButton: true
            });
        }

        function actualizarInterfazResponsable() {
            const responsableInfo = document.getElementById('responsable-info');
            const responsableNombre = document.getElementById('responsable-nombre');
            
            if (responsableActual) {
                responsableInfo.style.display = 'flex';
                responsableNombre.textContent = responsableActual;
            } else {
                responsableInfo.style.display = 'none';
            }
            
            actualizarEstadoBotonSincronizar();
        }

        function mostrarModalResponsable() {
            const modal = document.getElementById('modal-responsable');
            const nombreInput = document.getElementById('nombre-responsable');
            
            if (responsableActual) {
                nombreInput.value = responsableActual;
            } else {
                nombreInput.value = '';
            }
            
            modal.style.display = 'flex';
        }

        function cerrarModalResponsable() {
            document.getElementById('modal-responsable').style.display = 'none';
        }

        // ========== SINCRONIZACIÓN ==========
        function actualizarEstadoBotonSincronizar() {
            const btnSincronizar = document.getElementById('btn-sincronizar');
            if (!btnSincronizar) return;
            
            let datosActuales = [];
            if (pestañaActiva === 'residuos') {
                datosActuales = datosResiduos;
            } else if (pestañaActiva === 'recoleccion') {
                datosActuales = datosRecoleccion;
            } else {
                datosActuales = datosDevolucion;
            }
            
            if (sincronizando) {
                btnSincronizar.disabled = true;
                btnSincronizar.title = 'Sincronización en curso';
            } else if (!isOnline) {
                btnSincronizar.disabled = true;
                btnSincronizar.title = 'Sin conexión a internet';
            } else if (!responsableActual) {
                btnSincronizar.disabled = true;
                btnSincronizar.title = 'Debe configurar un responsable primero';
            } else if (datosActuales.length === 0) {
                btnSincronizar.disabled = true;
                btnSincronizar.title = 'No hay registros pendientes';
            } else {
                btnSincronizar.disabled = false;
                btnSincronizar.title = 'Sincronizar datos';
            }
        }

        function sincronizarDatos() {
            if (sincronizando) {
                Swal.fire({
                    title: 'Sincronización en curso',
                    text: 'Ya hay una sincronización en proceso. Por favor espera.',
                    icon: 'info',
                    confirmButtonText: 'Entendido',
                    timer: 3000
                });
                return;
            }

            if (!isOnline) {
                Swal.fire({
                    title: 'Sin conexión',
                    text: 'No hay conexión a internet. Verifica tu conexión e intenta nuevamente.',
                    icon: 'error',
                    confirmButtonText: 'Entendido',
                    confirmButtonColor: '#e74c3c'
                });
                return;
            }

            let datosActuales = [];
            let scriptURL = '';
            let tipoRegistro = '';
            
            if (pestañaActiva === 'residuos') {
                datosActuales = datosResiduos;
                scriptURL = SCRIPT_URL_RESIDUOS;
                tipoRegistro = 'residuos';
            } else if (pestañaActiva === 'recoleccion') {
                datosActuales = datosRecoleccion;
                scriptURL = SCRIPT_URL_RECOLECCION;
                tipoRegistro = 'recoleccion';
            } else {
                datosActuales = datosDevolucion;
                scriptURL = SCRIPT_URL_DEVOLUCION;
                tipoRegistro = 'devolucion';
            }

            if (datosActuales.length === 0) {
                Swal.fire({
                    title: 'Sin datos',
                    text: 'No hay registros pendientes para sincronizar.',
                    icon: 'info',
                    confirmButtonText: 'Entendido',
                    confirmButtonColor: '#3498db'
                });
                return;
            }

            if (!responsableActual) {
                Swal.fire({
                    title: 'Responsable requerido',
                    text: 'Debe configurar un responsable antes de sincronizar',
                    icon: 'warning',
                    confirmButtonText: 'Configurar',
                    confirmButtonColor: '#f39c12',
                    showCancelButton: true,
                    cancelButtonText: 'Cancelar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        cerrarModal();
                        mostrarModalResponsable();
                    }
                });
                return;
            }

            sincronizando = true;
            const btnSincronizar = document.getElementById('btn-sincronizar');
            if (btnSincronizar) {
                btnSincronizar.disabled = true;
                btnSincronizar.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sincronizando...';
            }

            const idsBackup = datosActuales.map(r => r.id);

            cerrarModal();
            $('#sync-button').addClass('syncing');
            $('#overlay').css('display', 'flex');
            $('#loading-detail').text(`Sincronizando datos de ${tipoRegistro}... (Intento ${datosActuales[0]?.syncAttempts + 1 || 1})`);

            datosActuales.forEach(r => r.syncAttempts = (r.syncAttempts || 0) + 1);
            if (pestañaActiva === 'residuos') {
                guardarDatosResiduos();
            } else if (pestañaActiva === 'recoleccion') {
                guardarDatosRecoleccion();
            } else {
                guardarDatosDevolucion();
            }

            const timeoutDuration = 60000;
            const timeoutPromise = new Promise((_, reject) => {
                setTimeout(() => reject(new Error('Timeout')), timeoutDuration);
            });

            const ajaxPromise = new Promise((resolve, reject) => {
                console.log(`📤 Enviando ${datosActuales.length} registros de ${tipoRegistro}...`);
                
                const datosParaEnviar = datosActuales.map(registro => ({
                    ...registro,
                    responsable: responsableActual
                }));
                
                $.ajax({
                    url: scriptURL,
                    type: "POST",
                    data: {
                        registros: JSON.stringify(datosParaEnviar),
                        tipo: pestañaActiva,
                        ids: JSON.stringify(idsBackup)
                    },
                    timeout: timeoutDuration,
                    success: function(response) {
                        console.log('✅ Respuesta recibida:', response);
                        resolve(response);
                    },
                    error: function(xhr, status, error) {
                        console.log('❌ Error en AJAX:', status, error);
                        reject({status, error, responseText: xhr.responseText});
                    }
                });
            });

            Promise.race([ajaxPromise, timeoutPromise])
                .then(function(response) {
                    $('#overlay').hide();
                    $('#sync-button').removeClass('syncing');
                    
                    console.log('✅ Procesando respuesta...');
                    let responseData;
                    try {
                        responseData = typeof response === 'string' ? JSON.parse(response) : response;
                    } catch (e) {
                        console.log('❌ Error parseando respuesta:', e);
                        responseData = {success: false, message: 'Respuesta no válida del servidor'};
                    }
                    
                    const idsProcesados = responseData.idsProcesados || [];
                    const idsExistentes = responseData.idsExistentes || [];
                    const idsConError = responseData.idsConError || [];
                    
                    console.log(`📊 Resultados del servidor:`);
                    console.log(`   ✅ Procesados: ${idsProcesados.length}`);
                    console.log(`   ⚠️ Existentes: ${idsExistentes.length}`);
                    console.log(`   ❌ Con error: ${idsConError.length}`);
                    
                    let registrosEliminados = 0;
                    let registrosMantenidos = 0;
                    
                    if (pestañaActiva === 'residuos') {
                        const originalLength = datosResiduos.length;
                        datosResiduos = datosResiduos.filter(r => {
                            if (idsProcesados.includes(r.id)) {
                                registrosEliminados++;
                                return false;
                            }
                            if (idsExistentes.includes(r.id)) {
                                registrosEliminados++;
                                return false;
                            }
                            if (idsConError.includes(r.id)) {
                                registrosMantenidos++;
                                return true;
                            }
                            registrosMantenidos++;
                            return true;
                        });
                        guardarDatosResiduos();
                    } else if (pestañaActiva === 'recoleccion') {
                        const originalLength = datosRecoleccion.length;
                        datosRecoleccion = datosRecoleccion.filter(r => {
                            if (idsProcesados.includes(r.id)) {
                                registrosEliminados++;
                                return false;
                            }
                            if (idsExistentes.includes(r.id)) {
                                registrosEliminados++;
                                return false;
                            }
                            if (idsConError.includes(r.id)) {
                                registrosMantenidos++;
                                return true;
                            }
                            registrosMantenidos++;
                            return true;
                        });
                        guardarDatosRecoleccion();
                    } else {
                        const originalLength = datosDevolucion.length;
                        datosDevolucion = datosDevolucion.filter(r => {
                            if (idsProcesados.includes(r.id)) {
                                registrosEliminados++;
                                return false;
                            }
                            if (idsExistentes.includes(r.id)) {
                                registrosEliminados++;
                                return false;
                            }
                            if (idsConError.includes(r.id)) {
                                registrosMantenidos++;
                                return true;
                            }
                            registrosMantenidos++;
                            return true;
                        });
                        guardarDatosDevolucion();
                    }
                    
                    actualizarContadores();
                    
                    let mensajeHTML = `
                        <div style="text-align: center;">
                            <p style="font-size: 1.1em; margin-bottom: 15px;">${responseData.message}</p>
                            <div style="text-align: left; margin: 15px 0; padding: 15px; background-color: #f8f9fa; border-radius: 8px;">
                                <p style="margin: 5px 0; color: #28a745;">
                                    <i class="fas fa-check-circle"></i> Sincronizados: ${idsProcesados.length}
                                </p>
                                ${idsExistentes.length > 0 ? `
                                    <p style="margin: 5px 0; color: #f39c12;">
                                        <i class="fas fa-exclamation-triangle"></i> Ya estaban en el servidor: ${idsExistentes.length}
                                    </p>
                                ` : ''}
                                ${idsConError.length > 0 ? `
                                    <p style="margin: 5px 0; color: #e74c3c;">
                                        <i class="fas fa-times-circle"></i> Con error (reintentar): ${idsConError.length}
                                    </p>
                                ` : ''}
                                <p style="margin: 5px 0; color: #3498db;">
                                    <i class="fas fa-user"></i> Responsable: ${responsableActual}
                                </p>
                            </div>
                            <p style="font-size: 0.9em; color: #6c757d; margin-top: 10px;">
                                <i class="fas fa-info-circle"></i> ${registrosEliminados} registros eliminados de la lista local
                                ${registrosMantenidos > 0 ? ` | 📌 ${registrosMantenidos} registros mantenidos para reintentar` : ''}
                            </p>
                        </div>
                    `;
                    
                    let icono = 'success';
                    let titulo = 'Sincronización Exitosa';
                    
                    if (idsConError.length > 0 && idsProcesados.length === 0 && idsExistentes.length === 0) {
                        icono = 'error';
                        titulo = 'Error en Sincronización';
                    } else if (idsConError.length > 0) {
                        icono = 'warning';
                        titulo = 'Sincronización Parcial';
                    } else if (idsExistentes.length > 0 && idsProcesados.length === 0 && idsConError.length === 0) {
                        icono = 'info';
                        titulo = 'Datos ya sincronizados';
                    }
                    
                    Swal.fire({
                        title: titulo,
                        html: mensajeHTML,
                        icon: icono,
                        confirmButtonText: 'Aceptar',
                        confirmButtonColor: icono === 'success' ? '#28a745' : '#f39c12',
                        width: '600px'
                    });
                    
                    sincronizando = false;
                    if (btnSincronizar) {
                        btnSincronizar.disabled = false;
                        btnSincronizar.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Sincronizar';
                    }
                    
                    if (document.getElementById('modal-registros').style.display === 'flex') {
                        mostrarModalRegistros();
                    }
                })
                .catch(function(error) {
                    $('#overlay').hide();
                    $('#sync-button').removeClass('syncing');
                    
                    console.log('❌ Error en sincronización:', error);
                    
                    sincronizando = false;
                    if (btnSincronizar) {
                        btnSincronizar.disabled = false;
                        btnSincronizar.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Sincronizar';
                    }
                    
                    const esTimeout = error.message && error.message.includes('Timeout');
                    
                    if (pestañaActiva === 'residuos') {
                        datosResiduos.forEach(r => {
                            if (r.syncAttempts > 0) r.syncAttempts--;
                        });
                        guardarDatosResiduos();
                    } else if (pestañaActiva === 'recoleccion') {
                        datosRecoleccion.forEach(r => {
                            if (r.syncAttempts > 0) r.syncAttempts--;
                        });
                        guardarDatosRecoleccion();
                    } else {
                        datosDevolucion.forEach(r => {
                            if (r.syncAttempts > 0) r.syncAttempts--;
                        });
                        guardarDatosDevolucion();
                    }
                    actualizarContadores();
                    
                    let errorMessage = '';
                    if (esTimeout) {
                        errorMessage = 'La sincronización está tomando demasiado tiempo. ';
                        errorMessage += 'Es posible que los datos se hayan guardado. ';
                        errorMessage += 'Revisa los registros para verificar si se sincronizaron correctamente.';
                    } else {
                        errorMessage = 'No se pudo conectar al servidor. ';
                        errorMessage += 'Verifica tu conexión a internet.';
                    }
                    
                    Swal.fire({
                        title: esTimeout ? 'Tiempo de espera agotado' : 'Error de Conexión',
                        html: `
                            <div style="text-align: center;">
                                <p style="font-size: 1.1em; margin-bottom: 15px;">${errorMessage}</p>
                                <p style="font-size: 0.9em; color: #7f8c8d; margin-top: 15px;">
                                    <i class="fas fa-info-circle"></i> Los registros se mantienen guardados localmente.
                                    ${esTimeout ? 'En el próximo intento se verificarán duplicados automáticamente.' : ''}
                                </p>
                                <div style="color: ${esTimeout ? '#f39c12' : '#e74c3c'}; font-size: 2em; margin-top: 15px;">
                                    <i class="fas ${esTimeout ? 'fa-clock' : 'fa-wifi-slash'}"></i>
                                </div>
                            </div>
                        `,
                        icon: esTimeout ? 'warning' : 'error',
                        confirmButtonText: 'Entendido',
                        confirmButtonColor: esTimeout ? '#f39c12' : '#e74c3c',
                        width: '500px'
                    });
                });
        }

        // ========== FUNCIONES DE CONEXIÓN ==========
        function actualizarEstadoConexion() {
            isOnline = navigator.onLine;
            console.log('🔄 Estado de conexión actualizado:', isOnline ? 'ONLINE' : 'OFFLINE');
            
            const indicator = document.getElementById('conexion-indicator');
            const icon = document.getElementById('conexion-icon');
            const tooltip = document.getElementById('conexion-tooltip');
            const status = document.getElementById('conexion-status');
            
            if (isOnline) {
                if (indicator) {
                    indicator.className = 'conexion-indicator online';
                    indicator.title = 'Conectado a internet';
                }
                if (icon) icon.className = 'fas fa-wifi';
                if (tooltip) tooltip.textContent = 'Conectado a internet';
                
                if (status) {
                    status.className = 'conexion-status online';
                    status.innerHTML = '<i class="fas fa-wifi"></i><span>Conectado</span>';
                }

                actualizarEstadoBotonSincronizar();
                
                console.log('✅ Conexión restaurada - Modo online');
            } else {
                if (indicator) {
                    indicator.className = 'conexion-indicator offline';
                    indicator.title = 'Sin conexión a internet';
                }
                if (icon) icon.className = 'fas fa-wifi-slash';
                if (tooltip) tooltip.textContent = 'Sin conexión - Modo offline';
                
                if (status) {
                    status.className = 'conexion-status offline';
                    status.innerHTML = '<i class="fas fa-wifi-slash"></i><span>Sin conexión</span>';
                }

                const btnSincronizar = document.getElementById('btn-sincronizar');
                if (btnSincronizar) {
                    btnSincronizar.disabled = true;
                }
                
                console.log('❌ Sin conexión a internet - Modo offline activado');
            }
        }

        window.addEventListener('online', function() {
            console.log('🌐 Evento online detectado');
            actualizarEstadoConexion();
        });

        window.addEventListener('offline', function() {
            console.log('📵 Evento offline detectado');
            actualizarEstadoConexion();
        });

        window.onclick = function(event) {
            const modalRegistros = document.getElementById('modal-registros');
            const modalResponsable = document.getElementById('modal-responsable');
            
            if (event.target === modalRegistros) {
                cerrarModal();
            }
            if (event.target === modalResponsable) {
                cerrarModalResponsable();
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw-index.js')
                    .then(function(registration) {
                        console.log('✅ Service Worker registrado con éxito:', registration.scope);
                    })
                    .catch(function(error) {
                        console.log('❌ Error al registrar Service Worker:', error);
                    });
            });
        }
    </script>
</body>
</html>
