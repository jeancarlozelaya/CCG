<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pisos Brillantes - Resumen</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
      --primary-color: #2c3e50;
      --secondary-color: #3498db;
      --accent-color: #e74c3c;
      --success-color: #2ecc71;
      --warning-color: #f39c12;
      --light-color: #ecf0f1;
      --dark-color: #34495e;
      --text-color: #333;
      --border-color: #ddd;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      --transition: all 0.3s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f7fa;
      color: var(--text-color);
      line-height: 1.6;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    .header {
      background: linear-gradient(135deg, var(--primary-color), var(--dark-color));
      color: white;
      text-align: center;
      padding: 18px 0;
      font-size: 1.5rem;
      font-weight: bold;
      box-shadow: var(--shadow);
      position: relative;
    }

    .form-container {
      width: 90%;
      max-width: 1400px;
      margin: 25px auto;
      padding: 25px;
      background-color: white;
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 25px;
      font-size: 1.8rem;
      position: relative;
      padding-bottom: 10px;
    }

    h1:after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 4px;
      background-color: var(--secondary-color);
      border-radius: 2px;
    }

    /* Panel de filtros */
    .filtros-principales {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .date-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .date-group label {
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }

    .filtros-principales input[type="date"] {
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1em;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      background-color: #f8f8f8;
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      min-width: 160px;
    }

    .filtros-principales input[type="date"]:hover { border-color: var(--secondary-color); }

    .filtros-principales input[type="date"]:focus {
      outline: none;
      border-color: var(--secondary-color);
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.25);
      background-color: #ffffff;
    }

    .btn-filtrar {
      background-color: var(--success-color);
      color: white;
      border: none;
      padding: 11px 28px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1em;
      font-weight: 600;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-filtrar:hover { background-color: #218838; transform: translateY(-1px); }
    .btn-filtrar:disabled { background-color: #6c757d; cursor: not-allowed; transform: none; }

    .btn-generar-html {
      background-color: #6f42c1;
      color: white;
      border: none;
      padding: 11px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1em;
      font-weight: 600;
      transition: var(--transition);
      display: none;
      align-items: center;
      gap: 8px;
    }

    .btn-generar-html:hover { background-color: #5a32a3; transform: translateY(-1px); }

    /* Overlay de carga */
    .loading-overlay {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      margin-top: 15px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(52, 152, 219, 0.2);
      border-radius: 50%;
      border-top-color: var(--secondary-color);
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 15px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Pestañas */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 25px 0 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 12px 30px;
      background: #e9ecef;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      color: #555;
    }

    .tab-btn:hover { background: #dde1e6; }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--secondary-color), #2980b9);
      color: white;
      box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Filtro por edificio */
    .filtros-secundarios {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      background: #f8f9fa;
      padding: 12px 20px;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
    }

    .filtros-secundarios label { font-weight: 600; color: #333; }

    .filtros-secundarios select {
      padding: 8px 15px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 0.95rem;
      background: white;
      cursor: pointer;
      min-width: 220px;
    }

    .filtros-secundarios select:focus { outline: none; border-color: var(--secondary-color); }

    .btn-limpiar {
      padding: 8px 18px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s ease;
    }

    .btn-limpiar:hover { background: #c0392b; }

    /* Grid de gráficos */
    .graficos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
      gap: 22px;
      margin-top: 10px;
    }

    .grafico-card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border: 1px solid #e8e8e8;
      display: flex;
      flex-direction: column;
    }

    .grafico-card h3 {
      text-align: center;
      color: var(--primary-color);
      font-size: 1.05rem;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--secondary-color);
    }

    .grafico-card .chart-container {
      position: relative;
      width: 100%;
      height: 280px;
    }

    .grafico-card canvas { width: 100% !important; height: 100% !important; }

    .contador-graficos {
      text-align: center;
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 10px;
    }

    /* Tabla de promedios */
    .tabla-promedios-container {
      margin-top: 30px;
      background: white;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border: 1px solid #e8e8e8;
    }

    .tabla-promedios-container h3 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 18px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--secondary-color);
    }

    .promedios-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .promedios-table th {
      background: linear-gradient(135deg, var(--secondary-color), #2980b9);
      color: white;
      padding: 12px;
      text-align: center;
      font-weight: 600;
    }

    .promedios-table td {
      padding: 10px;
      border-bottom: 1px solid #e0e0e0;
      text-align: center;
    }

    .promedios-table tr:nth-child(even) { background-color: #f8f9fa; }
    .promedios-table tr:hover { background-color: #f0f7ff; }

    .promedio-destacado { font-weight: bold; color: var(--primary-color); }

    .badge-max {
      background-color: #27ae60;
      color: white;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }

    .badge-min {
      background-color: #e67e22;
      color: white;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }

    /* Sección Anual */
    .anual-chart-wrapper {
      background: white;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border: 1px solid #e8e8e8;
      margin-bottom: 25px;
    }

    .anual-chart-wrapper h3 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 18px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--secondary-color);
    }

    .anual-chart-container { height: 380px; position: relative; }

    .anual-table-container {
      background: white;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border: 1px solid #e8e8e8;
      overflow-x: auto;
    }

    .anual-table-container h3 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 18px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--secondary-color);
    }

    .anual-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .anual-table th {
      background: linear-gradient(135deg, var(--secondary-color), #2980b9);
      color: white;
      padding: 12px;
      text-align: center;
      font-weight: 600;
    }

    .anual-table td {
      padding: 10px;
      border-bottom: 1px solid #e0e0e0;
      text-align: center;
    }

    .anual-table tr:nth-child(even) { background-color: #f8f9fa; }
    .anual-table tr:hover { background-color: #f0f7ff; }

    .no-data {
      text-align: center;
      padding: 40px;
      color: #888;
      font-size: 1.05rem;
      background: white;
      border-radius: 12px;
      border: 1px solid #e8e8e8;
    }

    .no-data i { font-size: 2rem; display: block; margin-bottom: 12px; color: var(--secondary-color); }

    /* Fecha info */
    .info-periodo {
      text-align: center;
      margin-top: 12px;
      font-size: 0.9rem;
      color: #666;
      background: #e9ecef;
      padding: 6px 16px;
      border-radius: 20px;
      display: inline-block;
    }

    .info-periodo-container { text-align: center; margin-top: 12px; }

    @media (max-width: 768px) {
      .form-container { width: 95%; padding: 15px; margin: 15px auto; }
      .graficos-grid { grid-template-columns: 1fr; }
      .grafico-card .chart-container { height: 240px; }
      .filtros-principales { flex-direction: column; align-items: stretch; }
      .filtros-principales input[type="date"] { width: 100%; }
      .btn-filtrar, .btn-generar-html { width: 100%; justify-content: center; }
      .tabs .tab-btn { flex: 1; padding: 10px 15px; font-size: 0.85rem; }
      .filtros-secundarios { flex-direction: column; align-items: stretch; }
      .filtros-secundarios select { min-width: auto; width: 100%; }
      .anual-chart-container { height: 280px; }
    }
</style>
</head>
<body>
  <div class="header">Pisos Brillantes</div>

  <div class="form-container">
    <h1>Resumen de Gastos de Insumos</h1>

    <div class="filtros-principales">
      <div class="date-group">
        <label for="fecha-inicio">Desde:</label>
        <input type="date" id="fecha-inicio">
      </div>
      <div class="date-group">
        <label for="fecha-fin">Hasta:</label>
        <input type="date" id="fecha-fin">
      </div>
      <button type="button" class="btn-filtrar" id="btn-filtrar" onclick="filtrarDatos()">
        <i class="fas fa-filter"></i> Filtrar Datos
      </button>
      <button type="button" class="btn-generar-html" id="btn-generar-html" onclick="generarHTMLGraficos()">
        <i class="fas fa-file-code"></i> Generar HTML
      </button>
    </div>

    <div class="info-periodo-container" id="info-periodo-container" style="display: none;">
      <span class="info-periodo" id="info-periodo"></span>
    </div>

    <div class="loading-overlay" id="loading-overlay">
      <div class="spinner"></div>
      <h4 style="margin-bottom: 5px;">Cargando datos, por favor espera...</h4>
      <p id="loading-message" style="color: #666; font-size: 0.9rem;"></p>
    </div>

    <div id="resultados-container" style="display: none;">

      <div class="tabs">
        <button class="tab-btn active" data-tab="tab-detalle" onclick="switchTab('tab-detalle')">
          <i class="fas fa-chart-bar"></i> Detalle de Consumo
        </button>
        <button class="tab-btn" data-tab="tab-anual" onclick="switchTab('tab-anual')">
          <i class="fas fa-calendar-alt"></i> Consumo Anual
        </button>
      </div>

      <!-- Pestaña Detalle -->
      <div id="tab-detalle" class="tab-content active">
        <div class="filtros-secundarios">
          <label for="filtro-edificio"><i class="fas fa-building"></i> Edificio:</label>
          <select id="filtro-edificio" onchange="aplicarFiltroEdificio()">
            <option value="todos">Todos los edificios</option>
          </select>
          <button class="btn-limpiar" onclick="limpiarFiltroEdificio()">
            <i class="fas fa-undo"></i> Limpiar
          </button>
        </div>

        <div class="contador-graficos" id="contador-graficos">
          Mostrando <span id="graficos-visibles">0</span> gráficos
        </div>

        <div class="graficos-grid" id="graficos-grid"></div>

        <div class="tabla-promedios-container">
          <h3><i class="fas fa-table"></i> Promedio de Consumo Diario por Producto</h3>
          <div id="tabla-promedios-wrapper"></div>
        </div>
      </div>

      <!-- Pestaña Anual -->
      <div id="tab-anual" class="tab-content">
        <div id="anual-contenido"></div>
      </div>

    </div>
  </div>

<script>
  // ============================================
  // CONFIGURACIÓN
  // ============================================
  const API_URL = 'https://script.google.com/macros/s/AKfycbyTMhGvnY0MNY1bRYjx6A57kBJAznNhADiU35X5xlSA5IfeMX2Mcb8XNxvsD5i-OLFq/exec';

  // Estado global
  let resumenData = [];
  let datosDiariosData = [];
  let datosAnualesData = null;
  let edificiosList = [];
  let charts = {};
  let anualChartInstance = null;

  // ============================================
  // INICIALIZACIÓN
  // ============================================
  document.addEventListener('DOMContentLoaded', function() {
    const today = new Date();
    const firstDayOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);

    const formatDate = (date) => {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    document.getElementById('fecha-inicio').value = formatDate(firstDayOfMonth);
    document.getElementById('fecha-fin').value = formatDate(today);
  });

  // ============================================
  // UTILIDADES
  // ============================================
  function formatFechaMostrar(dateStr) {
    if (!dateStr || dateStr === 'N/A') return 'N/A';
    if (dateStr.includes('-')) {
      const parts = dateStr.split('-');
      if (parts.length === 3) return parts[2] + '/' + parts[1] + '/' + parts[0];
    }
    if (dateStr.includes('/')) return dateStr;
    return dateStr;
  }

  function generarColores(cantidad) {
    const colores = [];
    const hueStep = Math.max(1, 360 / Math.max(1, cantidad));
    for (let i = 0; i < cantidad; i++) colores.push('hsl(' + (i * hueStep) + ', 70%, 60%)');
    return colores;
  }

  function generarColoresBordes(cantidad) {
    const colores = [];
    const hueStep = Math.max(1, 360 / Math.max(1, cantidad));
    for (let i = 0; i < cantidad; i++) colores.push('hsl(' + (i * hueStep) + ', 70%, 40%)');
    return colores;
  }

  function generarColoresHover(cantidad) {
    const colores = [];
    const hueStep = Math.max(1, 360 / Math.max(1, cantidad));
    for (let i = 0; i < cantidad; i++) colores.push('hsl(' + (i * hueStep) + ', 80%, 55%)');
    return colores;
  }

  // ============================================
  // CARGA DE DATOS (3 en paralelo)
  // ============================================
  async function filtrarDatos() {
    const fechaInicio = document.getElementById('fecha-inicio').value;
    const fechaFin = document.getElementById('fecha-fin').value;

    if (!fechaInicio || !fechaFin) {
      Swal.fire('Advertencia', 'Por favor, seleccione una fecha de inicio y una fecha de fin.', 'warning');
      return;
    }

    if (new Date(fechaInicio) > new Date(fechaFin)) {
      Swal.fire('Advertencia', 'La fecha de inicio no puede ser posterior a la fecha de fin.', 'warning');
      return;
    }

    const btnFiltrar = document.getElementById('btn-filtrar');
    const btnGenerarHTML = document.getElementById('btn-generar-html');
    btnFiltrar.disabled = true;
    btnGenerarHTML.style.display = 'none';

    const overlay = document.getElementById('loading-overlay');
    const msg = document.getElementById('loading-message');
    overlay.style.display = 'flex';
    msg.textContent = 'Consultando resumen...';

    document.getElementById('resultados-container').style.display = 'none';

    try {
      // Obtener el año basado en la fecha fin
      const año = new Date(fechaFin + 'T12:00:00').getFullYear();

      // Las tres consultas en paralelo
      msg.textContent = 'Consultando resumen, datos diarios y consumo anual...';

      const [resumen, diarios, anual] = await Promise.all([
        fetchJSON(`${API_URL}?action=obtenerResumen&fechaInicio=${fechaInicio}&fechaFin=${fechaFin}`),
        fetchJSON(`${API_URL}?action=obtenerDatosDiarios&fechaInicio=${fechaInicio}&fechaFin=${fechaFin}`),
        fetchJSON(`${API_URL}?action=obtenerDatosAnuales&año=${año}`)
      ]);

      if (resumen.error) throw new Error(resumen.mensaje || 'Error al obtener resumen');
      if (diarios.error) throw new Error(diarios.mensaje || 'Error al obtener datos diarios');

      resumenData = resumen.resumen || [];
      datosDiariosData = diarios.datosDiarios || [];
      datosAnualesData = (anual && !anual.error) ? anual : null;

      if (resumenData.length === 0) {
        overlay.style.display = 'none';
        Swal.fire('Sin datos', 'No hay datos en el rango de fechas seleccionado.', 'info');
        btnFiltrar.disabled = false;
        return;
      }

      // Extraer lista de edificios
      const setEd = new Set();
      resumenData.forEach(item => { if (item.area) setEd.add(item.area); });
      edificiosList = Array.from(setEd).sort();

      // Rellenar select de edificios
      const selectEd = document.getElementById('filtro-edificio');
      selectEd.innerHTML = '<option value="todos">Todos los edificios</option>' +
        edificiosList.map(e => `<option value="${e.replace(/"/g, '&quot;')}">${e}</option>`).join('');

      // Info período
      document.getElementById('info-periodo').innerHTML =
        `<i class="fas fa-calendar-alt"></i> Período: ${formatFechaMostrar(fechaInicio)} al ${formatFechaMostrar(fechaFin)}`;
      document.getElementById('info-periodo-container').style.display = 'block';

      // Mostrar resultados
      document.getElementById('resultados-container').style.display = 'block';
      overlay.style.display = 'none';

      // Renderizar vistas
      switchTab('tab-detalle');
      generarGraficos('todos');
      renderizarAnual();

      // Mostrar botón Generar HTML
      btnGenerarHTML.style.display = 'inline-flex';

      Swal.fire({
        icon: 'success',
        title: 'Datos cargados',
        text: 'Resumen y gráficos generados correctamente.',
        timer: 1800,
        showConfirmButton: false
      });

    } catch (error) {
      console.error('Error:', error);
      overlay.style.display = 'none';
      Swal.fire('Error', 'Error al cargar los datos: ' + error.message, 'error');
    } finally {
      btnFiltrar.disabled = false;
    }
  }

  function fetchJSON(url) {
    return fetch(url).then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  // ============================================
  // TABS
  // ============================================
  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    const btn = document.querySelector('.tab-btn[data-tab="' + tabId + '"]');
    if (btn) btn.classList.add('active');

    setTimeout(() => {
      Object.values(charts).forEach(c => { if (c && c.resize) c.resize(); });
      if (anualChartInstance && anualChartInstance.resize) anualChartInstance.resize();
    }, 150);
  }

  // ============================================
  // FILTRO POR EDIFICIO
  // ============================================
  function aplicarFiltroEdificio() {
    const edificio = document.getElementById('filtro-edificio').value;
    generarGraficos(edificio);
  }

  function limpiarFiltroEdificio() {
    document.getElementById('filtro-edificio').value = 'todos';
    generarGraficos('todos');
  }

  // ============================================
  // GENERACIÓN DE GRÁFICOS (PESTAÑA DETALLE)
  // ============================================
  function generarGraficos(edificioFiltro) {
    // Destruir gráficos previos
    Object.values(charts).forEach(c => { if (c) c.destroy(); });
    charts = {};

    const datosFiltrados = edificioFiltro === 'todos'
      ? resumenData
      : resumenData.filter(item => item.area === edificioFiltro);

    const grid = document.getElementById('graficos-grid');
    grid.innerHTML = '';

    if (datosFiltrados.length === 0) {
      grid.innerHTML = '<div class="no-data" style="grid-column:1/-1;"><p>No hay datos para el edificio seleccionado.</p></div>';
      document.getElementById('graficos-visibles').textContent = '0';
      document.getElementById('tabla-promedios-wrapper').innerHTML = '<p style="text-align:center;padding:20px;color:#999;">Sin datos de promedios.</p>';
      return;
    }

    const sufijo = edificioFiltro !== 'todos' ? ' - ' + edificioFiltro : '';
    let totalGraficos = 0;

    const tooltipOptions = {
      enabled: true,
      mode: 'index',
      intersect: false,
      callbacks: {
        label: function(ctx) {
          return ctx.dataset.label + ': ' + ctx.raw.toLocaleString('es-HN') + ' unidades';
        }
      },
      backgroundColor: 'rgba(0, 0, 0, 0.8)',
      titleColor: 'white',
      bodyColor: 'white',
      borderColor: '#3498db',
      borderWidth: 1,
      cornerRadius: 6
    };

    // 1. Gráfico por producto
    const productosMap = {};
    datosFiltrados.forEach(item => {
      productosMap[item.producto] = (productosMap[item.producto] || 0) + item.cantidadTotal;
    });

    const prodLabels = Object.keys(productosMap);
    const prodData = Object.values(productosMap);

    if (prodLabels.length > 0) {
      totalGraficos++;
      const card = document.createElement('div');
      card.className = 'grafico-card';
      card.innerHTML = `<h3>Consumo por Producto${sufijo}</h3><div class="chart-container"><canvas id="chart-prod"></canvas></div>`;
      grid.appendChild(card);

      const n = prodLabels.length;
      charts['prod'] = new Chart(document.getElementById('chart-prod').getContext('2d'), {
        type: 'bar',
        data: {
          labels: prodLabels,
          datasets: [{
            label: 'Consumo por Producto',
            data: prodData,
            backgroundColor: generarColores(n),
            borderColor: generarColoresBordes(n),
            borderWidth: 1,
            hoverBackgroundColor: generarColoresHover(n)
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: { tooltip: tooltipOptions },
          scales: {
            y: { beginAtZero: true, title: { display: true, text: 'Cantidad (unidades)' } },
            x: { ticks: { maxRotation: 45, minRotation: 30 } }
          }
        }
      });
    }

    // 2. Gráficos por edificio/producto
    const porEdificioProducto = {};
    datosFiltrados.forEach(item => {
      if (!porEdificioProducto[item.producto]) porEdificioProducto[item.producto] = {};
      porEdificioProducto[item.producto][item.area] =
        (porEdificioProducto[item.producto][item.area] || 0) + item.cantidadTotal;
    });

    for (const producto in porEdificioProducto) {
      totalGraficos++;
      const labels = Object.keys(porEdificioProducto[producto]);
      const data = Object.values(porEdificioProducto[producto]);
      const id = 'chart-ed-' + producto.replace(/[^a-zA-Z0-9]/g, '_');

      const card = document.createElement('div');
      card.className = 'grafico-card';
      card.innerHTML = `<h3>Consumo en Edificios (${producto})${sufijo}</h3><div class="chart-container"><canvas id="${id}"></canvas></div>`;
      grid.appendChild(card);

      const n = labels.length;
      charts[id] = new Chart(document.getElementById(id).getContext('2d'), {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Consumo de ' + producto,
            data: data,
            backgroundColor: generarColores(n),
            borderColor: generarColoresBordes(n),
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: { tooltip: tooltipOptions },
          scales: { y: { beginAtZero: true, title: { display: true, text: 'Cantidad (unidades)' } } }
        }
      });
    }

    // 3. Gráficos por nivel
    const porNivel = {};
    datosFiltrados.forEach(item => {
      if (!porNivel[item.area]) porNivel[item.area] = {};
      if (!porNivel[item.area][item.producto]) porNivel[item.area][item.producto] = {};
      const nivel = !item.nivel || item.nivel === 'Sin Nivel' ? '0' : item.nivel;
      porNivel[item.area][item.producto][nivel] =
        (porNivel[item.area][item.producto][nivel] || 0) + item.cantidadTotal;
    });

    for (const edif in porNivel) {
      for (const producto in porNivel[edif]) {
        totalGraficos++;
        const nivelesMap = porNivel[edif][producto];
        const labels = Object.keys(nivelesMap);
        const data = Object.values(nivelesMap);
        const id = 'chart-niv-' + edif.replace(/[^a-zA-Z0-9]/g, '_') + '-' + producto.replace(/[^a-zA-Z0-9]/g, '_');

        const card = document.createElement('div');
        card.className = 'grafico-card';
        card.innerHTML = `<h3>Consumo en ${edif} - ${producto} por Nivel</h3><div class="chart-container"><canvas id="${id}"></canvas></div>`;
        grid.appendChild(card);

        const n = labels.length;
        charts[id] = new Chart(document.getElementById(id).getContext('2d'), {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: 'Consumo en ' + edif,
              data: data,
              backgroundColor: generarColores(n),
              borderColor: generarColoresBordes(n),
              borderWidth: 1
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { tooltip: tooltipOptions },
            scales: { y: { beginAtZero: true, title: { display: true, text: 'Cantidad (unidades)' } } }
          }
        });
      }
    }

    // 4. Gráficos diarios (filtrados por productos del edificio)
    const productosDelFiltro = new Set(datosFiltrados.map(i => i.producto));

    datosDiariosData.forEach(dp => {
      if (!productosDelFiltro.has(dp.producto)) return;
      if (!dp.datos || dp.datos.length === 0) return;

      totalGraficos++;
      const id = 'chart-dia-' + dp.producto.replace(/[^a-zA-Z0-9]/g, '_');
      const card = document.createElement('div');
      card.className = 'grafico-card';
      card.innerHTML = `<h3>Consumo Diario (${dp.producto})${sufijo}</h3><div class="chart-container"><canvas id="${id}"></canvas></div>`;
      grid.appendChild(card);

      const fechas = dp.datos.map(d => d.fecha);
      const cantidades = dp.datos.map(d => d.cantidad);

      charts[id] = new Chart(document.getElementById(id).getContext('2d'), {
        type: 'line',
        data: {
          labels: fechas,
          datasets: [{
            label: 'Consumo Diario ' + dp.producto,
            data: cantidades,
            borderColor: 'rgba(54, 162, 235, 1)',
            backgroundColor: 'rgba(54, 162, 235, 0.1)',
            borderWidth: 2,
            pointBackgroundColor: 'rgba(54, 162, 235, 1)',
            pointBorderColor: '#fff',
            pointRadius: 4,
            pointHoverRadius: 7,
            pointBorderWidth: 2,
            tension: 0.2,
            fill: true
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { tooltip: tooltipOptions },
          scales: {
            y: { beginAtZero: true, title: { display: true, text: 'Cantidad (unidades)' } },
            x: { ticks: { maxRotation: 45, minRotation: 45, autoSkip: true, maxTicksLimit: 8 } }
          }
        }
      });
    });

    document.getElementById('graficos-visibles').textContent = totalGraficos;

    // 5. Tabla de promedios
    generarTablaPromedios(edificioFiltro, datosFiltrados);
  }

  // ============================================
  // TABLA DE PROMEDIOS
  // ============================================
  function generarTablaPromedios(edificioFiltro, datosFiltrados) {
    const wrapper = document.getElementById('tabla-promedios-wrapper');
    const fechaInicio = document.getElementById('fecha-inicio').value;
    const fechaFin = document.getElementById('fecha-fin').value;

    const fI = new Date(fechaInicio + 'T12:00:00');
    const fF = new Date(fechaFin + 'T12:00:00');
    const diffDays = Math.floor(Math.abs(fF - fI) / (1000 * 60 * 60 * 24)) + 1;

    // Productos del filtro actual
    const productosMap = {};
    datosFiltrados.forEach(item => {
      productosMap[item.producto] = (productosMap[item.producto] || 0) + item.cantidadTotal;
    });

    const productosFiltrados = new Set(Object.keys(productosMap));
    const promedios = [];

    for (const producto in productosMap) {
      const total = productosMap[producto];
      const promedio = total / diffDays;

      let diasConConsumo = 0;
      let diaMaximo = { fecha: 'N/A', cantidad: 0 };
      let diaMinimo = { fecha: 'N/A', cantidad: 0 };

      const dp = datosDiariosData.find(d => d.producto === producto);
      if (dp && dp.datos && dp.datos.length > 0) {
        const conConsumo = dp.datos.filter(d => d.cantidad > 0);
        diasConConsumo = conConsumo.length;
        if (conConsumo.length > 0) {
          diaMaximo = conConsumo.reduce((max, d) => d.cantidad > max.cantidad ? d : max, conConsumo[0]);
          diaMinimo = conConsumo.reduce((min, d) => d.cantidad < min.cantidad ? d : min, conConsumo[0]);
        }
      }

      promedios.push({
        producto, total, promedio, diasConConsumo, diaMaximo, diaMinimo
      });
    }

    promedios.sort((a, b) => b.promedio - a.promedio);

    if (promedios.length === 0) {
      wrapper.innerHTML = '<p style="text-align:center;padding:20px;color:#999;">Sin datos de promedios para el filtro actual.</p>';
      return;
    }

    let html = `<table class="promedios-table">
      <thead>
        <tr>
          <th>Producto</th>
          <th>Total Período</th>
          <th>Promedio Diario</th>
          <th>Días con Consumo</th>
          <th>Día Mayor Consumo</th>
          <th>Día Menor Consumo</th>
        </tr>
      </thead>
      <tbody>`;

    promedios.forEach(item => {
      html += `<tr>
        <td><strong>${item.producto}</strong></td>
        <td>${item.total.toLocaleString('es-HN')} und.</td>
        <td class="promedio-destacado">${item.promedio.toFixed(1)} und./día</td>
        <td>${item.diasConConsumo} de ${diffDays} días</td>
        <td>${formatFechaMostrar(item.diaMaximo.fecha)}: <span class="badge-max">${item.diaMaximo.cantidad} und.</span></td>
        <td>${item.diaMinimo.fecha !== 'N/A' ? formatFechaMostrar(item.diaMinimo.fecha) + ': ' : ''}<span class="badge-min">${item.diaMinimo.cantidad} und.</span></td>
      </tr>`;
    });

    html += `</tbody></table>
      <div style="margin-top:15px;font-size:12px;color:#666;text-align:center;">
        * Promedio calculado sobre ${diffDays} días (${formatFechaMostrar(fechaInicio)} al ${formatFechaMostrar(fechaFin)})
      </div>`;

    wrapper.innerHTML = html;
  }

  // ============================================
  // VISTA ANUAL
  // ============================================
  function renderizarAnual() {
    const contenedor = document.getElementById('anual-contenido');

    if (!datosAnualesData || !datosAnualesData.datos || datosAnualesData.datos.length === 0 ||
        !datosAnualesData.meses || datosAnualesData.meses.length === 0) {
      contenedor.innerHTML = `<div class="no-data">
        <i class="fas fa-info-circle"></i>
        <p>No hay datos anuales disponibles para el período seleccionado.</p>
        <p style="font-size:0.85rem;margin-top:8px;color:#999;">Verifique que existan hojas mensuales para el año en curso.</p>
      </div>`;
      return;
    }

    const data = datosAnualesData;

    contenedor.innerHTML = `
      <div class="anual-chart-wrapper">
        <h3><i class="fas fa-chart-line"></i> Tendencia de Consumo Anual - ${data.año}</h3>
        <div class="anual-chart-container"><canvas id="anual-chart-canvas"></canvas></div>
      </div>
      <div class="anual-table-container">
        <h3><i class="fas fa-table"></i> Totales Mensuales por Producto - ${data.año}</h3>
        <table class="anual-table">
          <thead>
            <tr>
              <th>Producto</th>
              ${data.meses.map(m => `<th>${m}</th>`).join('')}
              <th>Total Anual</th>
            </tr>
          </thead>
          <tbody>
            ${data.datos.map(item => {
              const total = item.valores.reduce((s, v) => s + v, 0);
              return `<tr>
                <td><strong>${item.producto}</strong></td>
                ${item.valores.map(v => `<td>${v.toLocaleString('es-HN')} und.</td>`).join('')}
                <td><strong>${total.toLocaleString('es-HN')} und.</strong></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;

    // Destruir gráfico anual anterior
    if (anualChartInstance) { anualChartInstance.destroy(); anualChartInstance = null; }

    setTimeout(() => {
      const ctx = document.getElementById('anual-chart-canvas');
      if (!ctx) return;

      const datasets = data.datos.map((item, index) => {
        const hue = (index * 137) % 360;
        return {
          label: item.producto,
          data: item.valores,
          borderColor: 'hsl(' + hue + ', 70%, 50%)',
          backgroundColor: 'hsla(' + hue + ', 70%, 90%, 0.3)',
          tension: 0.3,
          fill: false,
          pointRadius: 4,
          pointHoverRadius: 6,
          borderWidth: 2
        };
      });

      anualChartInstance = new Chart(ctx.getContext('2d'), {
        type: 'line',
        data: { labels: data.meses, datasets: datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            tooltip: {
              callbacks: {
                label: function(c) { return c.dataset.label + ': ' + c.raw.toLocaleString('es-HN') + ' und.'; }
              }
            },
            legend: { position: 'bottom', labels: { boxWidth: 12, padding: 15 } }
          },
          scales: {
            y: { beginAtZero: true, title: { display: true, text: 'Cantidad (unidades)', font: { weight: 'bold', size: 11 } } },
            x: { title: { display: true, text: 'Mes', font: { weight: 'bold', size: 11 } } }
          }
        }
      });
    }, 50);
  }

  // ============================================
  // GENERAR HTML STANDALONE
  // ============================================
  function generarHTMLGraficos() {
    if (resumenData.length === 0) {
      Swal.fire('Advertencia', 'Debe cargar los datos primero.', 'warning');
      return;
    }

    Swal.fire({
      title: 'Generando HTML...',
      html: 'Construyendo el archivo, por favor espera.',
      allowOutsideClick: false,
      didOpen: () => { Swal.showLoading(); }
    });

    setTimeout(() => {
      try {
        const fechaInicio = document.getElementById('fecha-inicio').value;
        const fechaFin = document.getElementById('fecha-fin').value;

        // Preparar promedios pre-calculados
        const promediosPorEdificio = {};

        function calcularPromedios(datos) {
          const productosMap = {};
          datos.forEach(item => {
            productosMap[item.producto] = (productosMap[item.producto] || 0) + item.cantidadTotal;
          });

          const fI = new Date(fechaInicio + 'T12:00:00');
          const fF = new Date(fechaFin + 'T12:00:00');
          const diffDays = Math.floor(Math.abs(fF - fI) / (1000 * 60 * 60 * 24)) + 1;

          const resultado = [];
          for (const producto in productosMap) {
            const total = productosMap[producto];
            const promedio = total / diffDays;

            let diasConConsumo = 0;
            let diaMaximo = { fecha: 'N/A', cantidad: 0 };
            let diaMinimo = { fecha: 'N/A', cantidad: 0 };

            const dp = datosDiariosData.find(d => d.producto === producto);
            if (dp && dp.datos && dp.datos.length > 0) {
              const conConsumo = dp.datos.filter(d => d.cantidad > 0);
              diasConConsumo = conConsumo.length;
              if (conConsumo.length > 0) {
                diaMaximo = conConsumo.reduce((m, d) => d.cantidad > m.cantidad ? d : m, conConsumo[0]);
                diaMinimo = conConsumo.reduce((m, d) => d.cantidad < m.cantidad ? d : m, conConsumo[0]);
              }
            }

            resultado.push({ producto, total, promedio, diasConConsumo, diaMaximo, diaMinimo, diffDays });
          }
          resultado.sort((a, b) => b.promedio - a.promedio);
          return resultado;
        }

        promediosPorEdificio['todos'] = calcularPromedios(resumenData);
        edificiosList.forEach(ed => {
          promediosPorEdificio[ed] = calcularPromedios(resumenData.filter(i => i.area === ed));
        });

        // Preparar datos diarios filtrados por edificio
        const datosDiariosPorEdificio = { todos: datosDiariosData };
        edificiosList.forEach(ed => {
          const productosDelEdificio = new Set(
            resumenData.filter(i => i.area === ed).map(i => i.producto)
          );
          datosDiariosPorEdificio[ed] = datosDiariosData.filter(dp => productosDelEdificio.has(dp.producto));
        });

        // Preparar datos de gráficos por edificio
        function prepararDatosGraficos(datos, diarios) {
          const resultado = { productos: { labels: [], data: [] }, edificios: {}, niveles: {}, diarios: diarios || [] };

          const prodMap = {};
          datos.forEach(item => {
            prodMap[item.producto] = (prodMap[item.producto] || 0) + item.cantidadTotal;
          });
          resultado.productos.labels = Object.keys(prodMap);
          resultado.productos.data = Object.values(prodMap);

          datos.forEach(item => {
            if (!resultado.edificios[item.producto]) resultado.edificios[item.producto] = { labels: [], data: [] };
            const idx = resultado.edificios[item.producto].labels.indexOf(item.area);
            if (idx === -1) {
              resultado.edificios[item.producto].labels.push(item.area);
              resultado.edificios[item.producto].data.push(item.cantidadTotal);
            } else {
              resultado.edificios[item.producto].data[idx] += item.cantidadTotal;
            }
          });

          datos.forEach(item => {
            if (!resultado.niveles[item.area]) resultado.niveles[item.area] = {};
            if (!resultado.niveles[item.area][item.producto]) resultado.niveles[item.area][item.producto] = { labels: [], data: [] };
            const nivel = !item.nivel || item.nivel === 'Sin Nivel' ? '0' : item.nivel;
            const idx = resultado.niveles[item.area][item.producto].labels.indexOf(nivel);
            if (idx === -1) {
              resultado.niveles[item.area][item.producto].labels.push(nivel);
              resultado.niveles[item.area][item.producto].data.push(item.cantidadTotal);
            } else {
              resultado.niveles[item.area][item.producto].data[idx] += item.cantidadTotal;
            }
          });

          return resultado;
        }

        const datosCompletos = prepararDatosGraficos(resumenData, datosDiariosData);
        const datosPorEdificio = {};
        edificiosList.forEach(ed => {
          const filtrado = resumenData.filter(i => i.area === ed);
          datosPorEdificio[ed] = prepararDatosGraficos(filtrado, datosDiariosPorEdificio[ed]);
        });

        const htmlContent = construirHTMLStandalone({
          fechaInicio,
          fechaFin,
          edificiosList,
          datosCompletos,
          datosPorEdificio,
          promediosPorEdificio,
          datosAnuales: datosAnualesData
        });

        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Graficos_Consumo_${fechaInicio}_al_${fechaFin}.html`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        Swal.close();
        Swal.fire({
          icon: 'success',
          title: '¡HTML Generado!',
          html: 'El archivo se ha descargado correctamente.',
          timer: 3500,
          timerProgressBar: true
        });

      } catch (error) {
        console.error('Error al generar HTML:', error);
        Swal.close();
        Swal.fire('Error', 'Error al generar el HTML: ' + error.message, 'error');
      }
    }, 300);
  }

  // ============================================
  // CONSTRUIR HTML STANDALONE
  // ============================================
  function construirHTMLStandalone(opts) {
    const { fechaInicio, fechaFin, edificiosList, datosCompletos, datosPorEdificio, promediosPorEdificio, datosAnuales } = opts;

    const fmtF = (s) => {
      if (!s) return '';
      const [y, m, d] = s.split('-');
      return `${d}/${m}/${y}`;
    };

    const json = {
      datosCompletos: JSON.stringify(datosCompletos),
      datosPorEdificio: JSON.stringify(datosPorEdificio),
      edificiosList: JSON.stringify(edificiosList),
      promediosPorEdificio: JSON.stringify(promediosPorEdificio),
      datosAnuales: JSON.stringify(datosAnuales)
    };

    const fechaGen = new Date().toLocaleDateString('es-ES') + ' ' + new Date().toLocaleTimeString('es-ES');

    return `<!DOCTYPE html>

.filtros-container{display:flex;justify-content:center;align-items:center;gap:15px;margin-bottom:22px;flex-wrap:wrap;background:#fff;padding:14px 20px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.filtros-container label{font-weight:600;color:#333}
.filtros-container select{padding:8px 15px;border:2px solid #ddd;border-radius:6px;font-size:.95rem;background:#fff;cursor:pointer;min-width:220px}
.filtros-container select:focus{outline:none;border-color:#3498db}
.btn-limpiar{padding:8px 18px;background:#e74c3c;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.btn-limpiar:hover{background:#c0392b}
.graficos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(480px,1fr));gap:22px;max-width:1400px;margin:0 auto}
.grafico-card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 4px 15px rgba(0,0,0,.08);border:1px solid #e8e8e8;display:flex;flex-direction:column}
.grafico-card h3{text-align:center;color:#2c3e50;font-size:1.05rem;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #3498db}
.grafico-card .chart-container{position:relative;width:100%;height:280px}
.grafico-card canvas{width:100%!important;height:100%!important}
.tabla-promedios-container{max-width:1400px;margin:28px auto 0;background:#fff;border-radius:12px;padding:22px;box-shadow:0 4px 15px rgba(0,0,0,.08);border:1px solid #e8e8e8}
.tabla-promedios-container h3{text-align:center;color:#2c3e50;margin-bottom:18px;padding-bottom:8px;border-bottom:2px solid #3498db}
.promedios-table{width:100%;border-collapse:collapse;font-size:14px}
.promedios-table th{background:linear-gradient(135deg,#3498db,#2980b9);color:#fff;padding:12px;text-align:center;font-weight:600}
.promedios-table td{padding:10px;border-bottom:1px solid #e0e0e0;text-align:center}
.promedios-table tr:nth-child(even){background:#f8f9fa}
.promedios-table tr:hover{background:#f0f7ff}
.promedio-destacado{font-weight:bold;color:#2c3e50}
.badge-max{background:#27ae60;color:#fff;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:bold}
.badge-min{background:#e67e22;color:#fff;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:bold}
.anual-container{max-width:1400px;margin:0 auto}
.anual-chart-wrapper,.anual-table-container{background:#fff;border-radius:12px;padding:22px;box-shadow:0 4px 15px rgba(0,0,0,.08);border:1px solid #e8e8e8;margin-bottom:25px}
.anual-chart-wrapper h3,.anual-table-container h3{text-align:center;color:#2c3e50;margin-bottom:18px;padding-bottom:8px;border-bottom:2px solid #3498db}
.anual-chart-container{height:380px;position:relative}
.anual-table-container{overflow-x:auto}
.anual-table{width:100%;border-collapse:collapse;font-size:14px}
.anual-table th{background:linear-gradient(135deg,#3498db,#2980b9);color:#fff;padding:12px;text-align:center;font-weight:600}
.anual-table td{padding:10px;border-bottom:1px solid #e0e0e0;text-align:center}
.anual-table tr:nth-child(even){background:#f8f9fa}
.no-data{text-align:center;padding:40px;color:#888;font-size:1.05rem;background:#fff;border-radius:12px;border:1px solid #e8e8e8}
.no-data i{font-size:2rem;display:block;margin-bottom:12px;color:#3498db}
.contador-graficos{text-align:center;font-size:.9rem;color:#888;margin-bottom:10px}
.footer{text-align:center;margin-top:35px;padding:18px;color:#888;font-size:.85rem;border-top:1px solid #ddd}
@media (max-width:768px){.graficos-grid{grid-template-columns:1fr}.header{font-size:1.3rem}.grafico-card .chart-container{height:240px}.tabs .tab-btn{flex:1;padding:10px 15px;font-size:.85rem}.filtros-container{flex-direction:column;align-items:stretch}.filtros-container select{min-width:auto;width:100%}.anual-chart-container{height:280px}}
</style>
</head>
<body>
<div class="header">Pisos Brillantes</div>
<div class="sub-header">
  <h2 style="color:#2c3e50;margin-bottom:6px;">Detalle de Consumo de Insumos</h2>
  <span class="info-periodo"><i class="fas fa-calendar-alt"></i> Período: ${fmtF(fechaInicio)} al ${fmtF(fechaFin)}</span>
  <div style="margin-top:8px;font-size:.8rem;color:#888;">
    <i class="fas fa-mouse-pointer"></i> Pase el mouse sobre los gráficos para ver detalles
    <i class="fas fa-file" style="margin-left:12px;"></i> Generado el ${fechaGen}
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="tab-graficos" onclick="switchTab('tab-graficos')"><i class="fas fa-chart-bar"></i> Detalle de Consumo</button>
  <button class="tab-btn" data-tab="tab-anual" onclick="switchTab('tab-anual')"><i class="fas fa-calendar-alt"></i> Consumo Anual</button>
</div>

<div id="tab-graficos" class="tab-content active">
  <div class="filtros-container">
    <label for="filtro-edificio"><i class="fas fa-building"></i> Edificio:</label>
    <select id="filtro-edificio" onchange="aplicarFiltros()">
      <option value="todos">Todos los edificios</option>
    </select>
    <button class="btn-limpiar" onclick="limpiarFiltros()"><i class="fas fa-undo"></i> Limpiar</button>
  </div>
  <div class="contador-graficos">Mostrando <span id="graficos-visibles">0</span> gráficos</div>
  <div class="graficos-grid" id="graficos-grid"></div>
  <div class="tabla-promedios-container">
    <h3><i class="fas fa-table"></i> Promedio de Consumo Diario por Producto</h3>
    <div id="tabla-promedios-wrapper"></div>
  </div>
</div>

<div id="tab-anual" class="tab-content">
  <div class="anual-container" id="anual-container"></div>
</div>

<div class="footer">Documento generado automáticamente desde el sistema de resumen de gastos.</div>

<script>
const datosCompletos = ${json.datosCompletos};
const datosPorEdificio = ${json.datosPorEdificio};
const edificiosList = ${json.edificiosList};
const promediosPorEdificio = ${json.promediosPorEdificio};
const datosAnuales = ${json.datosAnuales};
const fechaInicio = '${fechaInicio}';
const fechaFin = '${fechaFin}';

let charts = {};
let anualChartInstance = null;

function fmtF(s) {
  if (!s || s === 'N/A') return 'N/A';
  if (s.includes('-')) { const [y,m,d]=s.split('-'); return d+'/'+m+'/'+y; }
  return s;
}
function genCol(n){const c=[];const h=Math.max(1,360/Math.max(1,n));for(let i=0;i<n;i++)c.push('hsl('+(i*h)+',70%,60%)');return c;}
function genColB(n){const c=[];const h=Math.max(1,360/Math.max(1,n));for(let i=0;i<n;i++)c.push('hsl('+(i*h)+',70%,40%)');return c;}
function genColH(n){const c=[];const h=Math.max(1,360/Math.max(1,n));for(let i=0;i<n;i++)c.push('hsl('+(i*h)+',80%,55%)');return c;}

// Select de edificios
const sel = document.getElementById('filtro-edificio');
edificiosList.forEach(e => {
  const o = document.createElement('option');
  o.value = e; o.textContent = e;
  sel.appendChild(o);
});

function switchTab(tabId){
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  document.querySelector('.tab-btn[data-tab="'+tabId+'"]').classList.add('active');
  setTimeout(()=>{
    Object.values(charts).forEach(c=>{if(c&&c.resize)c.resize();});
    if(anualChartInstance&&anualChartInstance.resize)anualChartInstance.resize();
  },150);
}

function aplicarFiltros(){
  const ed = document.getElementById('filtro-edificio').value;
  generarGraficos(ed);
}
function limpiarFiltros(){
  document.getElementById('filtro-edificio').value='todos';
  generarGraficos('todos');
}

const tooltipOpts = {
  enabled:true, mode:'index', intersect:false,
  callbacks:{ label:function(c){ return c.dataset.label+': '+c.raw.toLocaleString('es-HN')+' unidades'; } },
  backgroundColor:'rgba(0,0,0,.8)', titleColor:'#fff', bodyColor:'#fff',
  borderColor:'#3498db', borderWidth:1, cornerRadius:6
};

function generarGraficos(edificioFiltro){
  Object.values(charts).forEach(c=>{if(c)c.destroy();});
  charts = {};
  const grid = document.getElementById('graficos-grid');
  grid.innerHTML = '';
  const datos = edificioFiltro==='todos' ? datosCompletos : datosPorEdificio[edificioFiltro];
  if(!datos){ grid.innerHTML='<div class="no-data" style="grid-column:1/-1;">Sin datos para el edificio.</div>'; document.getElementById('graficos-visibles').textContent='0'; generarTablaPromedios(edificioFiltro); return; }
  const sufijo = edificioFiltro!=='todos'?' - '+edificioFiltro:'';
  let total = 0;

  if(datos.productos && datos.productos.labels.length>0){
    total++;
    const card = document.createElement('div');
    card.className='grafico-card';
    card.innerHTML='<h3>Consumo por Producto'+sufijo+'</h3><div class="chart-container"><canvas id="c-prod"></canvas></div>';
    grid.appendChild(card);
    const n = datos.productos.labels.length;
    charts['prod'] = new Chart(document.getElementById('c-prod').getContext('2d'),{
      type:'bar',
      data:{labels:datos.productos.labels,datasets:[{label:'Consumo por Producto',data:datos.productos.data,backgroundColor:genCol(n),borderColor:genColB(n),borderWidth:1,hoverBackgroundColor:genColH(n)}]},
      options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{tooltip:tooltipOpts},scales:{y:{beginAtZero:true,title:{display:true,text:'Cantidad (unidades)'}},x:{ticks:{maxRotation:45,minRotation:30}}}}
    });
  }

  for(const producto in datos.edificios){
    total++;
    const d = datos.edificios[producto];
    const id = 'c-ed-'+producto.replace(/[^a-zA-Z0-9]/g,'_');
    const card = document.createElement('div');
    card.className='grafico-card';
    card.innerHTML='<h3>Consumo en Edificios ('+producto+')'+sufijo+'</h3><div class="chart-container"><canvas id="'+id+'"></canvas></div>';
    grid.appendChild(card);
    const n = d.labels.length;
    charts[id] = new Chart(document.getElementById(id).getContext('2d'),{
      type:'bar',
      data:{labels:d.labels,datasets:[{label:'Consumo de '+producto,data:d.data,backgroundColor:genCol(n),borderColor:genColB(n),borderWidth:1}]},
      options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{tooltip:tooltipOpts},scales:{y:{beginAtZero:true,title:{display:true,text:'Cantidad (unidades)'}}}}
    });
  }

  for(const ed in datos.niveles){
    for(const producto in datos.niveles[ed]){
      total++;
      const d = datos.niveles[ed][producto];
      const id = 'c-niv-'+ed.replace(/[^a-zA-Z0-9]/g,'_')+'-'+producto.replace(/[^a-zA-Z0-9]/g,'_');
      const card = document.createElement('div');
      card.className='grafico-card';
      card.innerHTML='<h3>Consumo en '+ed+' - '+producto+' por Nivel</h3><div class="chart-container"><canvas id="'+id+'"></canvas></div>';
      grid.appendChild(card);
      const n = d.labels.length;
      charts[id] = new Chart(document.getElementById(id).getContext('2d'),{
        type:'bar',
        data:{labels:d.labels,datasets:[{label:'Consumo en '+ed,data:d.data,backgroundColor:genCol(n),borderColor:genColB(n),borderWidth:1}]},
        options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{tooltip:tooltipOpts},scales:{y:{beginAtZero:true,title:{display:true,text:'Cantidad (unidades)'}}}}
      });
    }
  }

  if(datos.diarios && datos.diarios.length>0){
    datos.diarios.forEach(dp=>{
      if(!dp.datos || dp.datos.length===0) return;
      total++;
      const id = 'c-dia-'+dp.producto.replace(/[^a-zA-Z0-9]/g,'_');
      const card = document.createElement('div');
      card.className='grafico-card';
      card.innerHTML='<h3>Consumo Diario ('+dp.producto+')'+sufijo+'</h3><div class="chart-container"><canvas id="'+id+'"></canvas></div>';
      grid.appendChild(card);
      charts[id] = new Chart(document.getElementById(id).getContext('2d'),{
        type:'line',
        data:{labels:dp.datos.map(x=>x.fecha),datasets:[{label:'Consumo Diario '+dp.producto,data:dp.datos.map(x=>x.cantidad),borderColor:'rgba(54,162,235,1)',backgroundColor:'rgba(54,162,235,0.1)',borderWidth:2,pointBackgroundColor:'rgba(54,162,235,1)',pointBorderColor:'#fff',pointRadius:4,pointHoverRadius:7,pointBorderWidth:2,tension:0.2,fill:true}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{tooltip:tooltipOpts},scales:{y:{beginAtZero:true,title:{display:true,text:'Cantidad (unidades)'}},x:{ticks:{maxRotation:45,minRotation:45,autoSkip:true,maxTicksLimit:8}}}}
      });
    });
  }

  document.getElementById('graficos-visibles').textContent = total;
  generarTablaPromedios(edificioFiltro);
}

function generarTablaPromedios(edificioFiltro){
  const wrapper = document.getElementById('tabla-promedios-wrapper');
  const promedios = edificioFiltro==='todos' ? promediosPorEdificio['todos'] : promediosPorEdificio[edificioFiltro];
  if(!promedios || promedios.length===0){
    wrapper.innerHTML='<p style="text-align:center;padding:20px;color:#999;">Sin datos de promedios.</p>';
    return;
  }
  const fI = new Date(fechaInicio+'T12:00:00');
  const fF = new Date(fechaFin+'T12:00:00');
  const diffDays = Math.floor(Math.abs(fF-fI)/(1000*60*60*24))+1;

  let html = '<table class="promedios-table"><thead><tr><th>Producto</th><th>Total Período</th><th>Promedio Diario</th><th>Días con Consumo</th><th>Día Mayor Consumo</th><th>Día Menor Consumo</th></tr></thead><tbody>';
  promedios.forEach(item=>{
    const dMax = item.diaMaximo || {fecha:'N/A',cantidad:0};
    const dMin = item.diaMinimo || {fecha:'N/A',cantidad:0};
    html += '<tr><td><strong>'+item.producto+'</strong></td><td>'+item.total.toLocaleString('es-HN')+' und.</td><td class="promedio-destacado">'+item.promedio.toFixed(1)+' und./día</td><td>'+item.diasConConsumo+' de '+diffDays+' días</td><td>'+fmtF(dMax.fecha)+': <span class="badge-max">'+dMax.cantidad+' und.</span></td><td>'+(dMin.fecha!=='N/A'?fmtF(dMin.fecha)+': ':'')+'<span class="badge-min">'+dMin.cantidad+' und.</span></td></tr>';
  });
  html += '</tbody></table><div style="margin-top:15px;font-size:12px;color:#666;text-align:center;">* Promedio calculado sobre '+diffDays+' días ('+fmtF(fechaInicio)+' al '+fmtF(fechaFin)+')</div>';
  wrapper.innerHTML = html;
}

function renderizarAnual(){
  const cont = document.getElementById('anual-container');
  if(!datosAnuales || !datosAnuales.datos || datosAnuales.datos.length===0 || !datosAnuales.meses || datosAnuales.meses.length===0){
    cont.innerHTML='<div class="no-data"><i class="fas fa-info-circle"></i><p>No hay datos anuales disponibles.</p></div>';
    return;
  }
  let html = '<div class="anual-chart-wrapper"><h3><i class="fas fa-chart-line"></i> Tendencia de Consumo Anual - '+datosAnuales.año+'</h3><div class="anual-chart-container"><canvas id="c-anual"></canvas></div></div>';
  html += '<div class="anual-table-container"><h3><i class="fas fa-table"></i> Totales Mensuales por Producto - '+datosAnuales.año+'</h3><table class="anual-table"><thead><tr><th>Producto</th>';
  datosAnuales.meses.forEach(m=>{ html+='<th>'+m+'</th>'; });
  html+='<th>Total Anual</th></tr></thead><tbody>';
  datosAnuales.datos.forEach(item=>{
    const total = item.valores.reduce((s,v)=>s+v,0);
    html+='<tr><td><strong>'+item.producto+'</strong></td>';
    item.valores.forEach(v=>{ html+='<td>'+v.toLocaleString('es-HN')+' und.</td>'; });
    html+='<td><strong>'+total.toLocaleString('es-HN')+' und.</strong></td></tr>';
  });
  html+='</tbody></table></div>';
  cont.innerHTML = html;

  setTimeout(()=>{
    const ctx = document.getElementById('c-anual');
    if(!ctx) return;
    if(anualChartInstance){ anualChartInstance.destroy(); anualChartInstance = null; }
    const datasets = datosAnuales.datos.map((item,idx)=>{
      const hue = (idx*137)%360;
      return {label:item.producto,data:item.valores,borderColor:'hsl('+hue+',70%,50%)',backgroundColor:'hsla('+hue+',70%,90%,0.3)',tension:0.3,fill:false,pointRadius:4,pointHoverRadius:6,borderWidth:2};
    });
    anualChartInstance = new Chart(ctx.getContext('2d'),{
      type:'line',
      data:{labels:datosAnuales.meses,datasets:datasets},
      options:{responsive:true,maintainAspectRatio:false,plugins:{tooltip:{callbacks:{label:function(c){return c.dataset.label+': '+c.raw.toLocaleString('es-HN')+' und.';}}},legend:{position:'bottom',labels:{boxWidth:12,padding:15}}},scales:{y:{beginAtZero:true,title:{display:true,text:'Cantidad (unidades)',font:{weight:'bold',size:11}}},x:{title:{display:true,text:'Mes',font:{weight:'bold',size:11}}}}}
    });
  },50);
}

document.addEventListener('DOMContentLoaded',function(){
  generarGraficos('todos');
  renderizarAnual();
});
<\/script>
</body>
</html>`;
  }
</script>
</body>
</html>
